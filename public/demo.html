<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;
  -webkit-tap-highlight-color:transparent;user-select:none;}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
#orb{
  position:fixed;top:5%;left:50%;transform:translateX(-50%);
  width:13vmin;height:13vmin;min-width:72px;min-height:72px;max-width:124px;max-height:124px;
  border-radius:50%;cursor:pointer;z-index:2;background:transparent;
  box-shadow:0 0 34px 8px rgba(255,205,0,0.35);
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 30px 6px rgba(255,205,0,0.30);}
  50%{box-shadow:0 0 64px 18px rgba(255,215,0,0.62);}
}
body.connecting #orb,body.active #orb{animation:pulseOn 1.1s ease-in-out infinite alternate;}
@keyframes pulseOn{
  from{box-shadow:0 0 50px 12px rgba(255,255,255,0.55);}
  to{box-shadow:0 0 110px 30px rgba(255,225,0,0.9);}
}
#hint{
  position:fixed;top:calc(5% + 13vmin + 12px);left:50%;transform:translateX(-50%);z-index:2;
  font:700 0.82rem/1.3 system-ui,sans-serif;color:rgba(255,255,255,0.92);
  text-align:center;text-shadow:0 1px 8px rgba(0,0,0,0.9);pointer-events:none;
  white-space:nowrap;
}
#startPanel{
  position:fixed;left:50%;bottom:6%;transform:translateX(-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:0.55rem;
  padding:0.9rem 1rem;border-radius:18px;background:rgba(0,0,0,0.72);
  border:1px solid rgba(255,255,255,0.16);box-shadow:0 18px 60px rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);color:#fff;font:600 0.9rem/1.35 system-ui,sans-serif;
  text-align:center;max-width:min(88vw,420px);
}
#startButton{
  border:0;border-radius:999px;background:#f5c518;color:#111;
  font:800 0.95rem/1 system-ui,sans-serif;padding:0.85rem 1.25rem;cursor:pointer;
  box-shadow:0 0 28px rgba(245,197,24,0.45);
}
#startButton:focus-visible{outline:3px solid #fff;outline-offset:3px;}
#status{color:rgba(255,255,255,0.78);font-weight:600;font-size:0.78rem;}
body.active #startButton{background:#fff;}
body.connecting #startButton{opacity:0.72;cursor:wait;}
body.connecting #status::after{content:"Connecting voice...";}
body.active #status::after{content:"Voice is live. Ask your question.";}
body.idle #status::after{content:"One press starts one stable Coral voice session.";}
body.error #status::after{content:"Voice did not connect. Check mic permission, then press again.";}
body.no-bg::before{
  content:attr(data-title);position:fixed;inset:0;display:grid;place-items:center;
  padding:2rem;text-align:center;font:800 clamp(2rem,8vw,5rem)/1 system-ui,sans-serif;
  color:#fff;background:radial-gradient(circle at 50% 25%,#123 0,#05070b 58%,#000 100%);
}
</style>
</head>
<body class="idle">
<img id="bg" src="" alt=""/>
<div id="hint">AI voice</div>
<div id="orb" role="button" tabindex="0" aria-label="Click to talk"></div>
<div id="startPanel">
  <button id="startButton" type="button">Press to start AI voice</button>
  <div id="status" aria-live="polite"></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const SRC=(params.get('src')||'siteeye').toLowerCase();
const DEFAULT_BACKGROUNDS={
  siteeye:'/images/canva-index.png',
  predeicer:'/demo/predeicer.png',
  bandage:'/demo/bandage.png',
  dna:'/demo/home%20dna%20paternity.png',
  std:'/demo/std.png',
  aipoint:'/demo/aipoint.png',
  convo:'/demo/convo.png'
};
const BG=params.get('bg')||DEFAULT_BACKGROUNDS[SRC]||'/images/canva-index.png';
const TITLES={
  siteeye:'SiteEye360° Live',
  predeicer:'Pre-Deicer Program',
  bandage:'No More Ouchies',
  dna:'DNA Solutions',
  std:'STD Testing',
  aipoint:'AI Point',
  convo:'Convo AI'
};
document.title=(TITLES[SRC]||'Demo')+' — Talk to AI';
document.body.setAttribute('data-title',TITLES[SRC]||'Demo');
const bg=document.getElementById('bg');
bg.addEventListener('error',function(){document.body.classList.add('no-bg');});
bg.src=BG;

let pc=null,localStream=null,starting=false,audioEl=null;
const sessionUrl='/session?src='+encodeURIComponent(SRC);
function setState(s){document.body.className=s+(document.body.classList.contains('no-bg')?' no-bg':'');}

function ensureAudio(){
  if(!audioEl){audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;}
  return audioEl;
}
function resumeAudio(){
  if(audioEl&&audioEl.paused){audioEl.play().catch(function(){});return true;}
  return false;
}
async function stop(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;setState('idle');
  if(typeof updateButton==='function')updateButton();
}
async function connectVoice(){
  const r=await fetch(sessionUrl,{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  pc.ontrack=e=>{if(audio.srcObject!==e.streams[0]){audio.srcObject=e.streams[0];audio.play().catch(function(){});}};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc.addTrack(localStream.getTracks()[0]);
  const dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}});
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  setState('active');
}
async function start(){
  if(pc||starting)return;
  starting=true;setState('connecting');
  try{await connectVoice();}
  catch(e){
    console.error(e);
    await stop();
    setState('error');
  }
  starting=false;
  if(typeof updateButton==='function')updateButton();
}

const orb=document.getElementById('orb');
const startButton=document.getElementById('startButton');
function updateButton(){
  startButton.textContent=(pc||starting)?'Stop AI voice':'Press to start AI voice';
}
function toggleVoice(){
  if(pc||starting){if(!resumeAudio())stop();}else{start();}
  updateButton();
}
orb.addEventListener('click',function(e){e.stopPropagation();toggleVoice();});
orb.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleVoice();}
});
startButton.addEventListener('click',toggleVoice);
document.addEventListener('keydown',function(e){if(e.key==='Escape')stop();});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(pc||starting))stop();
});
window.addEventListener('pagehide',function(){if(pc||starting)stop();});
window.addEventListener('beforeunload',function(){if(pc||starting)stop();});

setState('idle');
updateButton();
</script>
</body>
</html>
