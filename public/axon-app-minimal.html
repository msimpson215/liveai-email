<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Axon Partner"/>
<meta name="theme-color" content="#061a4e"/>
<meta name="cache-control" content="no-store"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icons/axon-blue-180.png"/>
<link rel="icon" href="/icons/axon-blue-192.png"/>
<title>Axon Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0b1f4a;
  --muted:#5b6b8c;
  --blue:#3b82f6;
  --blue-deep:#1e40af;
  --blue-soft:#93c5fd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Outfit",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(70% 45% at 50% 18%, rgba(147,197,253,.35) 0%, transparent 70%),
    linear-gradient(178deg,#eef4ff 0%,#dbeafe 100%);
  -webkit-font-smoothing:antialiased;
}
.screen{
  width:min(100%,420px);
  min-height:100dvh;
  margin:0 auto;
  padding:clamp(2rem,7vh,3.5rem) 1.6rem clamp(2rem,5vh,3rem);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.mark{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(150deg,var(--blue-soft) 0%,var(--blue) 60%,var(--blue-deep) 100%);
  color:#eff6ff;
  font-family:"Instrument Serif",Georgia,serif;
  font-size:2.1rem;line-height:1;
  display:grid;place-items:center;
  letter-spacing:-.05em;
  box-shadow:0 14px 34px rgba(37,99,235,.28);
  margin-top:clamp(1rem,7vh,3.5rem);
}

.word{margin-top:1.5rem}
.word h1{
  font-family:"Instrument Serif",Georgia,serif;
  font-weight:400;
  font-size:clamp(2.6rem,11vw,3.4rem);
  letter-spacing:-.035em;
  line-height:.95;
}
.word span{
  display:block;
  margin-top:.55rem;
  font-size:.7rem;font-weight:600;
  letter-spacing:.34em;text-transform:uppercase;
  color:var(--muted);
}

.line{
  margin-top:auto;
  padding:2.5rem 0 2rem;
  font-size:1.06rem;
  font-weight:400;
  line-height:1.5;
  color:#4a4740;
  max-width:16rem;
}

.cta{
  width:100%;
  margin-top:auto;
  display:block;
  appearance:none;border:0;cursor:pointer;
  text-decoration:none;
  border-radius:999px;
  padding:1.15rem 1.25rem;
  background:linear-gradient(180deg,#60a5fa,var(--blue));
  color:#eff6ff;
  font:600 1.02rem/1 "Outfit",system-ui,sans-serif;
  letter-spacing:-.01em;
  box-shadow:0 16px 34px rgba(37,99,235,.3);
  transition:transform .15s ease, filter .15s ease;
}
.cta:active{transform:scale(.985)}
.cta:hover{filter:brightness(1.03)}

.foot{
  margin-top:1.1rem;
  font-size:.74rem;color:var(--muted);font-weight:500;
}
.foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(139,135,121,.35)}
</style>
</head>
<body>
  <main class="screen">
    <div class="mark" aria-hidden="true">A</div>

    <div class="word">
      <h1>Axon</h1>
      <span>Partner</span>
    </div>

    <p class="line">Your professional assistant.</p>

    <a class="cta" href="/mockup2.html">Talk to your assistant</a>
    <p class="foot"><a href="/axon-app.html">See other version</a></p>
  </main>
</body>
</html>
