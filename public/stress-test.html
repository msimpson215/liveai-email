<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a2a5e">
<meta name="robots" content="noindex">
<title>Nuclear Stress Test — talk to our AI Assistant</title>
<style>
  :root{ --deep:#062247; --mid:#0c3b78; --line:#c9a227; --white:#f4f8ff; --soft:#b8cbe6; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--deep); color:var(--white); min-height:100vh;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
  }
  .sheet{
    width:100%; max-width:576px; min-height:100vh; display:flex; flex-direction:column;
    background:
      radial-gradient(90% 45% at 50% 34%, rgba(31,110,200,.38) 0%, rgba(6,34,71,0) 70%),
      linear-gradient(180deg,#0a2f61 0%,#062247 55%,#041934 100%);
  }

  /* White cap the hospital mark sits in, curved along the bottom edge. */
  .cap{
    background:#fff; padding:20px 24px 26px; text-align:center;
    border-bottom-left-radius:52% 22px; border-bottom-right-radius:52% 22px;
  }
  .cap .flame{ display:block; margin:0 auto 4px; width:26px; height:30px }
  .cap .mem{ color:#0d2a56; font-size:34px; font-weight:700; letter-spacing:.01em; line-height:1;
    font-family:Georgia,"Times New Roman",serif }
  .cap .hosp{ color:#0d2a56; font-size:16px; letter-spacing:.22em; margin-top:2px;
    font-family:Georgia,"Times New Roman",serif }
  .cap .bjc{ display:inline-block; margin-top:8px; background:#1257a5; color:#fff;
    font-size:14px; font-weight:700; letter-spacing:.08em; padding:3px 9px; border-radius:3px }

  main{ padding:28px 26px 34px; text-align:center; flex:1 0 auto; }
  .askline{ font-size:20px; line-height:1.4; color:var(--white); margin:0 0 8px; }
  h1{ margin:0; font-size:41px; line-height:1.1; letter-spacing:-.015em; }
  .ecg{ display:block; margin:14px auto 16px; width:210px; height:22px }
  .lead{ margin:0 0 26px; font-size:20px; line-height:1.4; color:var(--white); }

  .orb-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
  #orb{
    appearance:none; width:210px; height:210px; border-radius:50%; cursor:pointer;
    border:4px solid #cfe4ff; background:radial-gradient(circle at 50% 42%, #1a4f92 0%, #0a2a58 72%);
    box-shadow:0 0 0 10px rgba(150,197,255,.10), 0 0 52px rgba(120,180,255,.55), inset 0 0 34px rgba(150,200,255,.22);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    transition:box-shadow .25s ease, transform .15s ease;
  }
  #orb:active{ transform:scale(.98) }
  #orb svg{ width:62px; height:62px }
  #orb .cap2{ color:#fff; font-size:21px; font-weight:700 }
  body[data-state="connecting"] #orb{ animation:pulse 1.1s ease-in-out infinite }
  body[data-state="speaking"] #orb{ box-shadow:0 0 0 14px rgba(150,197,255,.16), 0 0 76px rgba(140,195,255,.85), inset 0 0 40px rgba(160,205,255,.3) }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 18px rgba(150,197,255,.16), 0 0 68px rgba(140,195,255,.8) } }

  /* The circle already says it. Only show this line for live states. */
  body[data-state="idle"] .hint{visibility:hidden}
  .hint{ margin:16px 0 0; font-size:15px; color:var(--soft) }
  .mode-btn{
    margin:20px auto 0; display:block; width:100%; max-width:420px; cursor:pointer;
    background:transparent; border:1px solid var(--line); border-radius:32px;
    color:var(--white); font:inherit; font-size:15px; padding:14px 20px;
  }
  .mode-btn.on{ background:var(--line); color:#1a1400; font-weight:700 }
  .mode-note{ margin:12px auto 0; font-size:14px; color:var(--soft); max-width:420px; line-height:1.5 }

  .guard{
    display:flex; align-items:center; gap:16px; text-align:left;
    margin:26px auto 0; max-width:460px; background:rgba(255,255,255,.06);
    border:1px solid rgba(201,162,39,.4); border-radius:12px; padding:16px 18px;
    font-size:15px; line-height:1.5; color:var(--white);
  }
  .guard svg{ flex:0 0 44px; width:44px; height:40px }
  .guard .bar{ flex:0 0 1px; align-self:stretch; background:rgba(201,162,39,.5) }

  @media (max-width:400px){
    h1{font-size:33px} .cap .mem{font-size:27px} #orb{width:180px;height:180px}
    .askline,.lead{font-size:17px}
  }
  .proto{
    position:fixed; top:10px; right:10px; z-index:9;
    background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:5px; font-size:10px; font-weight:800; letter-spacing:.16em;
    padding:5px 9px; text-transform:uppercase; pointer-events:none;
  }
</style>
</head>
<body data-state="idle">
<div class="sheet">
  <div class="proto">Prototype</div>


  <div class="cap">
    <svg class="flame" viewBox="0 0 26 30" fill="#c9a227"><path d="M13 0c3 6-1 8 1 12 1.6 3.2 5-1 5 5 0 5-3.6 8-6 8s-6-2.4-6-7c0-6 5-11 6-18z"/></svg>
    <div class="mem">MEMORIAL</div>
    <div class="hosp">HOSPITAL</div>
    <div class="bjc">BJC</div>
  </div>

  <main>
    <p class="askline">Do you have questions<br>or want to know more?</p>
    <h1>Nuclear Stress Test</h1>
    <svg class="ecg" viewBox="0 0 210 22" fill="none" stroke="#c9a227" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M0 11h78l6-8 6 16 7-12 5 4h103"/>
    </svg>
    <p class="lead">Our AI Assistant can help<br>you understand.</p>

    <div class="orb-wrap">
      <button type="button" id="orb" aria-label="Tap to talk to our AI Assistant">
        <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
          <rect x="19" y="9" width="10" height="18" rx="5" fill="#fff" stroke="none"/>
          <path d="M15 22a9 9 0 0 0 18 0"/><path d="M24 31v6"/>
          <path d="M11 17c-1.6 2-1.6 8 0 10M37 17c1.6 2 1.6 8 0 10" opacity=".85"/>
          <path d="M6 14c-2.6 3.2-2.6 13 0 16M42 14c2.6 3.2 2.6 13 0 16" opacity=".5"/>
        </svg>
        <span class="cap2">Tap to talk</span>
      </button>
      <p class="hint" id="hint">Tap to talk</p>
      <button type="button" id="modeBtn" class="mode-btn">Noisy room? Switch to tap-to-talk &nbsp;&rsaquo;</button>
      <p class="mode-note" id="modeNote"></p>

      <p class="guard">
        <svg viewBox="0 0 44 40" fill="none" stroke="#c9a227" stroke-width="1.8" aria-hidden="true">
          <path d="M22 34C13 28 6 23 6 16a7 7 0 0 1 13-4 7 7 0 0 1 13 4c0 7-7 12-16 18z"/>
          <path d="M10 20h6l3-5 4 9 3-4h8" stroke-linecap="round"/>
        </svg>
        <span class="bar"></span>
        Our AI Assistant cannot give medical advice. Consult with your
        cardiologist or primary care provider.
      </p>
    </div>
  </main>
</div>

<script src="/axon-voice.js"></script>
<script>
const orb=document.getElementById('orb');
const hint=document.getElementById('hint');
let pc=null,localStream=null,starting=false,audioEl=null,voice=null;

function setState(s,msg){
  document.body.dataset.state=s||'idle';
  if(msg!==undefined)hint.textContent=msg;
}
function ensureAudio(){
  if(!audioEl){
    audioEl=document.createElement('audio');
    audioEl.autoplay=true;audioEl.playsInline=true;
    document.body.appendChild(audioEl);
  }
  return audioEl;
}
async function stopVoice(){
  if(voice){voice.detach();voice=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;
  setState('idle','Tap to talk');
}
// A per-clinic URL (/stress-test/bjc) injects its key so the guide can answer
// where-to-go questions for that location.
const CLINIC=(typeof window.STRESS_CLINIC==='string'?window.STRESS_CLINIC:'')||
  (new URLSearchParams(location.search).get('clinic')||'');


/* The call dropped. Nothing used to happen here, so the orb sat there looking
   alive while nothing worked and the only fix was reloading the page. Rebuild
   the connection quietly and keep going; axon-voice.js hands the previous turns
   to the new session so it carries on instead of greeting again. */
let reconnecting=false,reconnectTries=0;
async function handleLost(){
  if(reconnecting)return;
  reconnecting=true;
  const startFn=(typeof connectVoice==='function')?connectVoice:null;
  try{if(voice){voice.detach();voice=null}}catch(e){}
  try{if(pc){pc.close()}}catch(e){}
  pc=null;
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  const wait=Math.min(8000,600*Math.pow(2,reconnectTries++));
  setTimeout(async function(){
    try{ if(startFn)await startFn(); reconnectTries=0; }
    catch(e){ if(reconnectTries<5)handleLost(); }
    finally{ reconnecting=false; }
  },wait);
}

/* ---- Tap-to-talk ----
   In a room with a television or a radio on, hands-free cannot be made to work:
   a TV's voice and a person's voice measure the same through one microphone, so
   the only way to not hear the TV is to keep the microphone shut until the
   person actually wants to speak. Holding the orb does that. */
let tapToTalk=false;
const modeBtn=document.getElementById('modeBtn');
const modeNote=document.getElementById('modeNote');
function setTapToTalk(on,why){
  tapToTalk=!!on;
  if(voice)voice.setPtt(tapToTalk);
  modeBtn.classList.toggle('on',tapToTalk);
  modeBtn.textContent=tapToTalk?'Back to hands-free':'Noisy room? Switch to tap-to-talk';
  modeNote.textContent=tapToTalk
    ? 'Hold the circle while you talk, let go when you\'re done.'
    : (why||'');
  setState(tapToTalk?'listening':'listening',tapToTalk?'Hold the circle and talk':'Tap to talk');
}
function offerTapToTalk(){
  if(tapToTalk)return;
  modeNote.textContent='Sounds like there\'s a TV or people talking near you. Tap-to-talk works better in here.';
}
modeBtn.addEventListener('click',function(e){e.stopPropagation();setTapToTalk(!tapToTalk);});
/* Holding the orb = my turn. Works for mouse, touch and keyboard. */
function holdOn(e){ if(!tapToTalk||!voice)return; e.preventDefault(); voice.hold(true); setState('listening','Listening\u2026 let go when done'); }
function holdOff(){ if(!tapToTalk||!voice)return; voice.hold(false); setState('listening','Hold the circle and talk'); }

async function connectVoice(){
  const url='/session?gate=1&src=stresstest'+(CLINIC?'&clinic='+encodeURIComponent(CLINIC):'');
  const r=await fetch(url,{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error){
    const err=new Error(r.status===429?'busy':(data.error||'session'));
    err.status=r.status;throw err;
  }
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');

  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  let remoteStream=null;
  pc.ontrack=e=>{
    remoteStream=e.streams[0];
    if(audio.srcObject!==e.streams[0]){
      audio.srcObject=e.streams[0];
      audio.play().catch(()=>{});
    }
  };
  localStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
  });
  const micTrack=localStream.getTracks()[0];
  // Mic stays closed through the opening line so the speaker can't feed back
  // into it and trigger a second, overlapping answer.
  micTrack.enabled=false;
  pc.addTrack(micTrack);

  const dc=pc.createDataChannel('oai-events');
  let greeted=false;
  dc.addEventListener('open',()=>{
    if(greeted||AxonVoice.hasHistory())return;
    greeted=true;
    try{dc.send(JSON.stringify({type:'response.create'}))}catch(e){}
  });
  dc.addEventListener('message',ev=>{
    try{
      const msg=JSON.parse(ev.data);
      if(msg.type==='response.created')setState('speaking','Speaking…');
      if(msg.type==='response.done')setState('listening','Listening — go ahead');
    }catch(e){}
  });

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok){
    let detail='';
    try{detail=await sdp.text()}catch(e){}
    const outOfCredit=/insufficient_quota|exceeded your current quota|billing/i.test(detail);
    const err=new Error(outOfCredit?'quota':(sdp.status===429?'busy':'sdp'));
    err.status=sdp.status;throw err;
  }
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  voice=AxonVoice.attach({dc:dc,micTrack:micTrack,localStream:localStream,remoteStream:remoteStream,voice:data.voice,pc:pc,onLost:handleLost,onNoisyRoom:offerTapToTalk});
  if(tapToTalk)voice.setPtt(true);
  setState('listening','Listening — go ahead');
}
async function toggleVoice(){
  if(starting)return;
  if(pc){await stopVoice();return}
  starting=true;
  setState('connecting','One moment…');
  try{
    await connectVoice();
  }catch(e){
    console.error(e);
    starting=false;
    await stopVoice();
    const why=e&&e.message;
    setState('idle',
      why==='quota'?'Temporarily unavailable — please ask a staff member.':
      why==='busy'?'Busy right now. Try again in a minute.':
      'That didn\u2019t connect. Tap to try again.');
    return;
  }
  starting=false;
}
orb.addEventListener('pointerdown',holdOn);
orb.addEventListener('pointerup',holdOff);
orb.addEventListener('pointercancel',holdOff);
orb.addEventListener('pointerleave',holdOff);
orb.addEventListener('click',function(){if(tapToTalk&&pc)return;toggleVoice();});
document.addEventListener('visibilitychange',()=>{
  /* Backgrounding no longer ends the call - axon-voice.js just closes the mic. */
});
window.addEventListener('pagehide',()=>{if(pc||starting)stopVoice()});
</script>
</body>
</html>
