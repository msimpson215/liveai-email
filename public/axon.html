<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Axon"/>
<meta name="theme-color" content="#eef5ff"/>
<meta name="cache-control" content="no-store"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icons/axon-180.png"/>
<link rel="icon" href="/icons/axon-192.png"/>
<title>Axon AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0f2540;
  --body:#4a6789;
  --muted:#587fae;
  --blue:#2f7df6;
  --blue-deep:#1a5fd0;
  --blue-soft:#8fc0ff;
  --sky-1:#f4f9ff;
  --sky-2:#e4f0ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 65% at 50% 0%, #ffffff 0%, var(--sky-1) 42%, var(--sky-2) 100%);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* soft light bloom behind everything */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bloom{
  position:absolute;top:14%;left:50%;transform:translateX(-50%);
  width:min(130vw,620px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(146,193,255,.42) 0%,rgba(196,222,255,.18) 45%,rgba(255,255,255,0) 72%);
  filter:blur(6px);
}
.wash{
  position:absolute;left:-20%;right:-20%;bottom:-14%;height:46vh;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);
}

.screen{
  position:relative;z-index:1;
  width:min(100%,430px);min-height:100dvh;margin:0 auto;
  padding:clamp(1.8rem,6vh,2.8rem) 1.5rem clamp(1.8rem,5vh,2.6rem);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}

/* wordmark: title case, normal A, blue AI badge */
.brand{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  margin-top:clamp(.6rem,3vh,1.4rem);
}
.brand .name{
  font-size:1.65rem;font-weight:800;letter-spacing:-.035em;
  color:#12325a;
}
.brand .ai{
  font-size:.78rem;font-weight:800;letter-spacing:.06em;
  color:#fff;
  background:linear-gradient(180deg,#54a0ff,var(--blue) 60%,var(--blue-deep));
  border-radius:8px;padding:.3rem .45rem .26rem;
  box-shadow:0 6px 16px rgba(47,125,246,.35);
}

/* the orb */
.orb-stage{
  margin-top:clamp(1.6rem,6vh,3rem);
  position:relative;
  width:min(62vw,248px);aspect-ratio:1;
  display:grid;place-items:center;
}
.ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(47,125,246,.28);
  animation:ripple 3.6s cubic-bezier(.25,.6,.35,1) infinite;
}
.ring:nth-child(2){animation-delay:1.2s}
.ring:nth-child(3){animation-delay:2.4s}
@keyframes ripple{
  0%{transform:scale(.78);opacity:.55}
  70%{opacity:0}
  100%{transform:scale(1.28);opacity:0}
}
.orb{
  position:relative;
  width:78%;aspect-ratio:1;border-radius:50%;
  border:0;cursor:pointer;padding:0;
  background:
    radial-gradient(circle at 34% 28%, #ffffff 0%, #cfe6ff 12%, #6fb0ff 38%, var(--blue) 66%, #1550b8 100%);
  box-shadow:
    0 26px 54px rgba(28,86,180,.34),
    0 10px 22px rgba(47,125,246,.28),
    inset 0 -14px 30px rgba(9,44,105,.42),
    inset 0 10px 26px rgba(255,255,255,.5);
  animation:breathe 3.4s ease-in-out infinite;
  transition:transform .18s ease;
}
.orb::after{
  content:"";position:absolute;
  top:12%;left:20%;width:42%;height:26%;
  border-radius:50%;
  background:radial-gradient(ellipse at 40% 40%,rgba(255,255,255,.92),rgba(255,255,255,0) 70%);
  filter:blur(1px);
}
.orb::before{
  content:"";position:absolute;
  bottom:9%;left:50%;transform:translateX(-50%);
  width:56%;height:18%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(146,200,255,.5),rgba(146,200,255,0) 70%);
  filter:blur(3px);
}
.orb:active{transform:scale(.97)}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.045)}
}
.orb-shadow{
  position:absolute;bottom:-2%;left:50%;transform:translateX(-50%);
  width:46%;height:9%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(30,80,160,.22),rgba(30,80,160,0) 70%);
  filter:blur(4px);
}

.headline{
  margin-top:clamp(1.6rem,5vh,2.4rem);
  font-size:clamp(2rem,8.4vw,2.5rem);
  font-weight:800;letter-spacing:-.035em;line-height:1.08;
  color:#0f2b4d;
}
.headline span{
  display:block;
  background:linear-gradient(100deg,var(--blue) 0%,#6aa8ff 55%,#2f7df6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{
  margin-top:.85rem;
  font-size:1.02rem;font-weight:500;line-height:1.5;
  color:#4a6789;max-width:19rem;
}

.spacer{flex:1;min-height:1.2rem}

.cta{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.65rem;
  appearance:none;border:0;cursor:pointer;text-decoration:none;
  border-radius:18px;padding:1.2rem 1.25rem;
  background:linear-gradient(180deg,#4b93ff 0%,var(--blue) 55%,var(--blue-deep) 100%);
  color:#fff;font:700 1.08rem/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.015em;
  box-shadow:0 16px 34px rgba(47,125,246,.36),inset 0 1px 0 rgba(255,255,255,.32);
  transition:transform .16s ease,filter .16s ease;
}
.cta:hover{filter:brightness(1.04)}
.cta:active{transform:translateY(1px) scale(.995)}
.wave{display:flex;align-items:center;gap:3px;height:18px}
.wave i{display:block;width:3px;border-radius:2px;background:#fff;animation:bar 1.15s ease-in-out infinite}
.wave i:nth-child(1){height:7px;animation-delay:0s}
.wave i:nth-child(2){height:13px;animation-delay:.12s}
.wave i:nth-child(3){height:18px;animation-delay:.24s}
.wave i:nth-child(4){height:11px;animation-delay:.36s}
.wave i:nth-child(5){height:8px;animation-delay:.48s}
@keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}

.under{
  margin-top:1rem;font-size:.92rem;color:var(--muted);font-weight:500;
  background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(88,127,174,.4);
}

@media (prefers-reduced-motion:reduce){
  .orb,.ring,.wave i{animation:none}
}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bloom"></div>
    <div class="wash"></div>
  </div>

  <main class="screen">
    <div class="brand">
      <span class="name">Axon</span>
      <span class="ai">AI</span>
    </div>

    <div class="orb-stage">
      <span class="ring" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <button type="button" class="orb" id="orb" aria-label="Talk to Axon"></button>
      <span class="orb-shadow" aria-hidden="true"></span>
    </div>

    <h1 class="headline">More than AI.<span>An artificial person.</span></h1>
    <p class="sub">Here for your day — remembers everything, thinks it through, and talks like a real one.</p>

    <div class="spacer"></div>

    <a class="cta" id="talkBtn" href="/mockup2.html">
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      Talk
    </a>
    <button type="button" class="under" id="signinBtn">Sign in</button>
  </main>

<script>
const orb=document.getElementById('orb');
const talkBtn=document.getElementById('talkBtn');
const signinBtn=document.getElementById('signinBtn');
const WHO_KEY='axon.who';

orb.addEventListener('click',()=>{window.location.href=talkBtn.getAttribute('href')});

function showWho(){
  let who='';
  try{who=localStorage.getItem(WHO_KEY)||''}catch(e){}
  signinBtn.textContent=who?who:'Sign in';
}
showWho();

signinBtn.addEventListener('click',()=>{
  let who='';
  try{who=localStorage.getItem(WHO_KEY)||''}catch(e){}
  if(who){
    try{localStorage.removeItem(WHO_KEY)}catch(e){}
    showWho();
    return;
  }
  const v=prompt('Your name or email');
  if(!v)return;
  const name=String(v).split('@')[0].trim();
  if(!name)return;
  try{localStorage.setItem(WHO_KEY,name)}catch(e){}
  showWho();
});
</script>
</body>
</html>
