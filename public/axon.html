<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Axon"/>
<meta name="theme-color" content="#f6f5f2"/>
<meta name="cache-control" content="no-store"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icons/axon-180.png"/>
<link rel="icon" href="/icons/axon-192.png"/>
<title>Axon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#141416;
  --soft:#6f6f75;
  --gold:#f5c518;
  --gold-deep:#e0ac00;
  --paper:#f6f5f2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Outfit",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.halo{
  position:absolute;top:6%;left:50%;transform:translateX(-50%);
  width:min(76vw,330px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#fff 0%,#fdfdfc 58%,rgba(246,245,242,.35) 82%,rgba(246,245,242,0) 100%);
}
.dune{position:absolute;left:-10%;right:-10%;height:50vh;bottom:-6vh}
.dune::before,.dune::after{
  content:"";position:absolute;left:-15%;right:-15%;height:60%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));
  box-shadow:0 -1px 0 rgba(0,0,0,.028);
}
.dune::before{bottom:14%;transform:rotate(-4deg)}
.dune::after{bottom:0;transform:rotate(3deg)}

.screen{
  position:relative;z-index:1;
  width:min(100%,430px);min-height:100dvh;margin:0 auto;
  padding:clamp(2.4rem,8vh,4rem) 1.5rem clamp(2rem,5vh,3rem);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}

.wordmark{
  margin-top:clamp(3rem,16vh,7rem);
  display:flex;align-items:center;justify-content:center;gap:.55rem;
}
.mark{
  display:flex;align-items:baseline;
  font-family:"Space Grotesk",system-ui,sans-serif;
  font-weight:700;font-size:clamp(3.3rem,14.5vw,4.35rem);
  letter-spacing:-.03em;line-height:.9;padding-right:.06em;
  background:linear-gradient(158deg,#2f2f35 0%,#101012 52%,#38383f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.mark svg{display:block;height:.78em;width:auto;margin-right:.015em;transform:translateY(.012em)}
.ai{
  align-self:flex-start;margin-top:.55rem;
  font-family:"Space Grotesk",system-ui,sans-serif;
  font-weight:700;font-size:.92rem;letter-spacing:.02em;color:#1a1500;
  background:linear-gradient(180deg,#ffd23f,var(--gold) 60%,var(--gold-deep));
  border-radius:7px;padding:.26rem .42rem .22rem;
  box-shadow:0 5px 14px rgba(224,172,0,.32);
}

.tagline{
  margin-top:1.4rem;
  font-size:min(5vw,1.5rem);font-weight:500;
  letter-spacing:-.022em;color:#26262a;white-space:nowrap;
}

.spacer{flex:1}

.cta{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.7rem;
  appearance:none;border:0;cursor:pointer;text-decoration:none;
  border-radius:16px;padding:1.2rem 1.25rem;
  background:linear-gradient(180deg,#ffd23f 0%,var(--gold) 55%,var(--gold-deep) 100%);
  color:#1a1500;font:600 1.08rem/1 "Outfit",system-ui,sans-serif;letter-spacing:-.01em;
  box-shadow:0 14px 30px rgba(224,172,0,.32),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .16s ease,filter .16s ease;
}
.cta:hover{filter:brightness(1.02)}
.cta:active{transform:translateY(1px) scale(.995)}

.wave{display:flex;align-items:center;gap:3px;height:19px}
.wave i{display:block;width:3px;border-radius:2px;background:#1a1500;animation:bar 1.15s ease-in-out infinite}
.wave i:nth-child(1){height:7px;animation-delay:0s}
.wave i:nth-child(2){height:14px;animation-delay:.12s}
.wave i:nth-child(3){height:19px;animation-delay:.24s}
.wave i:nth-child(4){height:12px;animation-delay:.36s}
.wave i:nth-child(5){height:8px;animation-delay:.48s}
@keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}

.under{
  margin-top:1.1rem;font-size:.9rem;color:#5c5c62;font-weight:400;
  background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(92,92,98,.4);
}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="halo"></div>
    <div class="dune"></div>
  </div>

  <main class="screen">
    <div class="wordmark" role="img" aria-label="Axon AI">
      <span class="mark">
        <svg viewBox="0 0 108 128" aria-hidden="true">
          <defs>
            <linearGradient id="ink" x1="10%" y1="0%" x2="90%" y2="100%">
              <stop offset="0%" stop-color="#2f2f35"/>
              <stop offset="52%" stop-color="#101012"/>
              <stop offset="100%" stop-color="#38383f"/>
            </linearGradient>
          </defs>
          <path fill="url(#ink)" d="M38 0 L70 0 L108 128 L82 128 L54 32 L26 128 L0 128 Z"/>
        </svg>XON</span>
      <span class="ai">AI</span>
    </div>

    <p class="tagline">Your AI Chief of Staff</p>

    <div class="spacer"></div>

    <a class="cta" id="talkBtn" href="/mockup2.html">
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      Talk
    </a>
    <button type="button" class="under" id="signinBtn">Sign in</button>
  </main>

<script>
const talkBtn=document.getElementById('talkBtn');
const signinBtn=document.getElementById('signinBtn');
const WHO_KEY='axon.who';

function showWho(){
  let who='';
  try{who=localStorage.getItem(WHO_KEY)||''}catch(e){}
  signinBtn.textContent=who?who:'Sign in';
}
showWho();

signinBtn.addEventListener('click',()=>{
  let who='';
  try{who=localStorage.getItem(WHO_KEY)||''}catch(e){}
  if(who){
    try{localStorage.removeItem(WHO_KEY)}catch(e){}
    showWho();
    return;
  }
  const v=prompt('Your name or email');
  if(!v)return;
  const name=String(v).split('@')[0].trim();
  if(!name)return;
  try{localStorage.setItem(WHO_KEY,name)}catch(e){}
  showWho();
});
</script>
</body>
</html>
