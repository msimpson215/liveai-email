<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Axon"/>
<meta name="theme-color" content="#1e3a8a"/>
<meta name="cache-control" content="no-store"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icons/axon-180.png"/>
<link rel="icon" href="/icons/axon-192.png"/>
<title>Axon AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  /* Marty's VoxTalk blues */
  --pale:#dbeafe;
  --sky:#93c5fd;
  --navy:#1e3a8a;
  --blue:#3b82f6;
  --blue-mid:#2563eb;
  --blue-deep:#1e40af;
  --light:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color:#fff;
  background:radial-gradient(circle at 50% 18%, var(--pale) 0%, var(--sky) 38%, var(--navy) 88%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

.screen{
  position:relative;z-index:1;
  width:min(100%,430px);min-height:100dvh;margin:0 auto;
  padding:clamp(1.8rem,6vh,2.8rem) 1.5rem clamp(1.8rem,5vh,2.6rem);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}

/* wordmark — title case, normal A */
.brand{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  margin-top:clamp(.4rem,2vh,1rem);
}
.brand .name{
  font-size:1.6rem;font-weight:800;letter-spacing:-.035em;
  color:#12306e;
}
.brand .ai{
  font-size:.76rem;font-weight:800;letter-spacing:.06em;color:#fff;
  background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);
  border-radius:8px;padding:.3rem .45rem .26rem;
  box-shadow:0 6px 16px rgba(37,99,235,.35);
}

/* orb — same gradient + pulse as VoxTalk, bigger and 3D */
.orb-stage{
  margin-top:clamp(2rem,8vh,3.6rem);
  position:relative;width:min(60vw,240px);aspect-ratio:1;
  display:grid;place-items:center;
}
.orb{
  position:relative;
  width:100%;aspect-ratio:1;border-radius:50%;
  border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 30% 30%, var(--blue), var(--blue-deep));
  box-shadow:
    0 6px 18px rgba(37,99,235,.3),
    0 26px 60px rgba(15,40,110,.45),
    inset 0 -18px 38px rgba(10,32,90,.5),
    inset 0 12px 30px rgba(255,255,255,.28);
  animation:listenPulse 2.6s ease-in-out infinite, breathe 3.6s ease-in-out infinite;
}
.orb::after{
  content:"";position:absolute;
  top:13%;left:20%;width:40%;height:25%;border-radius:50%;
  background:radial-gradient(ellipse at 40% 40%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);
  filter:blur(1px);
}
.orb:active{transform:scale(.96)}
@keyframes listenPulse{
  0%{box-shadow:0 0 0 0 rgba(59,130,246,.7),0 26px 60px rgba(15,40,110,.45),inset 0 -18px 38px rgba(10,32,90,.5),inset 0 12px 30px rgba(255,255,255,.28)}
  50%{box-shadow:0 0 0 22px rgba(59,130,246,0),0 26px 60px rgba(15,40,110,.45),inset 0 -18px 38px rgba(10,32,90,.5),inset 0 12px 30px rgba(255,255,255,.28)}
  100%{box-shadow:0 0 0 0 rgba(59,130,246,0),0 26px 60px rgba(15,40,110,.45),inset 0 -18px 38px rgba(10,32,90,.5),inset 0 12px 30px rgba(255,255,255,.28)}
}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.035)}
}

.headline{
  margin-top:clamp(2rem,6vh,2.8rem);
  font-size:clamp(1.85rem,7.6vw,2.25rem);
  font-weight:800;letter-spacing:-.03em;line-height:1.14;
  color:#0d2a63;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}
.sub{
  margin-top:.9rem;
  font-size:1.02rem;font-weight:500;line-height:1.5;
  color:#153a7e;max-width:19rem;
}

.spacer{flex:1;min-height:1.2rem}

.cta{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.65rem;
  appearance:none;border:0;cursor:pointer;text-decoration:none;
  border-radius:18px;padding:1.2rem 1.25rem;
  background:linear-gradient(180deg,var(--light) 0%,var(--blue-mid) 55%,var(--blue-deep) 100%);
  color:#fff;font:700 1.08rem/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.015em;
  box-shadow:0 16px 34px rgba(20,50,130,.42),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .16s ease,filter .16s ease;
}
.cta:hover{filter:brightness(1.05)}
.cta:active{transform:translateY(1px) scale(.995)}
.wave{display:flex;align-items:center;gap:3px;height:18px}
.wave i{display:block;width:3px;border-radius:2px;background:#fff;animation:bar 1.15s ease-in-out infinite}
.wave i:nth-child(1){height:7px;animation-delay:0s}
.wave i:nth-child(2){height:13px;animation-delay:.12s}
.wave i:nth-child(3){height:18px;animation-delay:.24s}
.wave i:nth-child(4){height:11px;animation-delay:.36s}
.wave i:nth-child(5){height:8px;animation-delay:.48s}
@keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}

.under{
  margin-top:1rem;font-size:.92rem;font-weight:500;
  color:rgba(255,255,255,.88);
  background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:rgba(255,255,255,.45);
}

@media (prefers-reduced-motion:reduce){
  .orb,.wave i{animation:none}
}
</style>
</head>
<body>
  <main class="screen">
    <div class="brand">
      <span class="name">Axon</span>
      <span class="ai">AI</span>
    </div>

    <div class="orb-stage">
      <button type="button" class="orb" id="orb" aria-label="Talk to Axon"></button>
    </div>

    <h1 class="headline">Here to help,<br/>every day.</h1>
    <p class="sub">Ask it anything, anytime — and it always remembers.</p>

    <div class="spacer"></div>

    <a class="cta" id="talkBtn" href="/mockup2.html">
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      Talk
    </a>
    <button type="button" class="under" id="signinBtn">Sign in</button>
  </main>

<script>
const orb=document.getElementById('orb');
const talkBtn=document.getElementById('talkBtn');
const signinBtn=document.getElementById('signinBtn');
const WHO_KEY='axon.who';

orb.addEventListener('click',()=>{window.location.href=talkBtn.getAttribute('href')});

function showWho(){
  let who='';
  try{who=localStorage.getItem(WHO_KEY)||''}catch(e){}
  signinBtn.textContent=who?who:'Sign in';
}
showWho();

signinBtn.addEventListener('click',()=>{
  let who='';
  try{who=localStorage.getItem(WHO_KEY)||''}catch(e){}
  if(who){
    try{localStorage.removeItem(WHO_KEY)}catch(e){}
    showWho();return;
  }
  const v=prompt('Your name or email');
  if(!v)return;
  const name=String(v).split('@')[0].trim();
  if(!name)return;
  try{localStorage.setItem(WHO_KEY,name)}catch(e){}
  showWho();
});
</script>
</body>
</html>
