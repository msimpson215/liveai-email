<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex">
<title>Scan Here — A1 Professional Asphalt</title>
<style>
  :root{ --black:#0b0b0b; --yellow:#fdba01; --white:#f4f4f4 }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--black); color:var(--white); min-height:100vh;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
  }
  .sheet{ width:100%; max-width:600px; min-height:100vh; display:flex; flex-direction:column; background:var(--black) }
  .logo{ display:block; width:100%; height:auto }
  .stripes{ height:14px; background:repeating-linear-gradient(135deg,var(--yellow) 0 22px,#111 22px 44px) }
  main{ padding:28px 24px 36px; text-align:center; flex:1 0 auto }
  h1{ margin:0 0 8px; font-size:28px; line-height:1.2; font-weight:800; text-transform:uppercase; letter-spacing:.02em }
  h1 em{ font-style:normal; color:var(--yellow) }
  .sub{ margin:0 0 22px; font-size:16px; color:#cfcfcf; line-height:1.45 }
  .panel{
    background:#fff; border:4px solid var(--yellow); border-radius:12px; padding:18px;
    margin:0 auto 22px; max-width:360px;
  }
  .panel img{ width:100%; max-width:300px; height:auto; display:block; margin:0 auto }
  .scan{ margin:0 0 18px; font-size:22px; font-weight:800; letter-spacing:.08em; color:var(--yellow) }
  .about{ margin:0 auto; max-width:420px; font-size:16px; line-height:1.5; color:#ddd }
  .about b{ color:var(--yellow) }
  .try{
    display:inline-block; margin:26px 0 0; text-decoration:none;
    background:var(--yellow); color:#111; font-size:16px; font-weight:800;
    padding:14px 24px; border-radius:10px;
  }
</style>
</head>
<body>
<div class="sheet">
  <img class="logo" src="/art/a1-logo.jpg" alt="A1 Professional Asphalt and Sealing LLC">
  <div class="stripes"></div>
  <main>
    <h1>Scan Here</h1>
    <p class="sub">Talk with our <em>AI team member</em> about A1 Professional Asphalt.</p>
    <div class="panel">
      <img src="/qr/a1-ask.png" alt="QR code — scan to open the A1 AI team member">
    </div>
    <p class="scan">SCAN HERE</p>
    <p class="about">
      Learn all about <b>A1 Professional Asphalt.</b><br>
      Talk with our <b>AI team member now</b> to get your questions answered.
    </p>
    <a class="try" href="/a1-ask.html">Open the AI team member</a>
  </main>
  <div class="stripes"></div>
</div>
</body>
</html>
