<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf8f5">
<meta name="robots" content="noindex">
<title>Start Your Business — StartABusiness.Center (version 1)</title>
<link rel="stylesheet" href="/css/sabc-card.css">
</head>
<body data-state="idle">

<!--
  Version 1, kept exactly as it was on 8 August 2026 and never overwritten.
  /start always shows the current artwork; this URL always shows this one, so a
  version that works can never be lost to a later export.
-->
<div class="stage" id="stage">
  <p class="missing" id="missing">Version 1 of the artwork is not on this server.</p>
  <img class="art" id="art" src="/art/sabc-orb-v1.png"
       alt="Start your business — talk with our AI business consultant">
  <button type="button" class="hot" id="orbHot" aria-label="Tap the orb to talk about your business">Tap the orb</button>
  <button type="button" class="hot btnHot" id="uploadHot" aria-label="Upload documents">Upload documents</button>
  <button type="button" class="hot btnHot" id="reviewHot" aria-label="My business review">My business review</button>
</div>

<div class="tray">
  <p class="status" id="status">Tap the orb and tell me about your business.</p>
  <p class="row" id="row"></p>
</div>

<input type="file" id="docInput" class="file"
       accept=".pdf,.doc,.docx,.txt,.md,.csv,application/pdf,text/plain,text/csv,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
<input type="file" id="profileInput" class="file" accept=".json,application/json">

<script src="/axon-voice.js"></script>

window.SABC_HOTSPOTS = {

</script>
<script src="/js/sabc-client.js"></script>
</body>
</html>
