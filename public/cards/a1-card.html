<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex">
<title>Joe Schanz — A1 Professional Asphalt</title>
<style>
  :root{ --black:#0b0b0b; --yellow:#fdba01; --white:#f4f4f4 }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:#111; color:var(--white); min-height:100vh;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
  }
  .sheet{ width:100%; max-width:720px; min-height:100vh; background:var(--black); display:flex; flex-direction:column }
  .top{ background:var(--yellow); padding:18px 20px 14px }
  .top img{ display:block; width:100%; height:auto; max-height:160px; object-fit:contain }
  .mid{ padding:28px 26px 20px; flex:1 0 auto }
  .name{ margin:0; font-size:34px; font-weight:800; letter-spacing:-.02em }
  .title{ margin:4px 0 16px; color:var(--yellow); font-size:18px; font-weight:700 }
  .rule{ height:2px; background:var(--yellow); width:72px; margin:0 0 18px }
  .row{ margin:0 0 10px; font-size:17px; line-height:1.45 }
  .row a{ color:var(--white); text-decoration:none }
  .foot{
    background:#000; padding:16px 20px 20px; text-align:center;
    font-size:14.5px; line-height:1.5; color:#ddd;
  }
  .foot a{ color:var(--yellow); font-weight:800; text-decoration:none }
  .foot b{ color:var(--yellow) }
</style>
</head>
<body>
<div class="sheet">
  <div class="top">
    <img src="/art/a1-logo.jpg" alt="A1 Professional Asphalt &amp; Sealing LLC">
  </div>
  <div class="mid">
    <h1 class="name">Joe Schanz</h1>
    <p class="title">Owner</p>
    <div class="rule"></div>
    <p class="row"><a href="tel:+16184441827">(618) 444-1827</a></p>
    <p class="row"><a href="mailto:joe@a1asphaltsealing.com">joe@a1asphaltsealing.com</a></p>
    <p class="row">Lebanon, Illinois</p>
  </div>
  <div class="foot">
    Scan the <a href="/a1/card/back">QR code on the back</a> to speak with our <b>AI team member.</b>
  </div>
</div>
</body>
</html>
