<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live AI Dash Email — A1 Asphalt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #f6f8fc;
      font-family: Arial, sans-serif;
      color: #202124;
      padding: 24px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
    }
    .orb {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid #F5C518;
      background: #F5C518 url('/email/a1-logo.jpg') center/68% no-repeat;
      box-shadow: 0 0 60px rgba(245,197,24,0.45), 0 0 120px rgba(245,197,24,0.18);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(245,197,24,0.65), 0 0 160px rgba(245,197,24,0.28); }
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      font-size: 14px;
    }
    .links a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>A1 Asphalt — Gmail email orb (click to test voice)</h1>
  <div class="orb" id="orb" role="button" tabindex="0" aria-label="Open email orb popup"></div>
  <div class="links">
    <a href="/mailer.html">Email template</a>
    <a href="/email-orb-launcher.html">Link generator</a>
    <a href="/email-plate.html?src=email&popup=1">Orb popup</a>
  </div>
  <script src="/assets/axon-email-orb.js"></script>
  <script>
    function openOrb() { AxonEmailOrb.openEmailOrb({ src: 'email' }); }
    document.getElementById('orb').addEventListener('click', openOrb);
    document.getElementById('orb').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openOrb(); }
    });
  </script>
</body>
</html>
