<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="SiteEye360 — live 360° job site monitoring. See everything. Stay in control."/>
  <title>SiteEye360 — See Everything. Stay in Control.</title>
  <link rel="stylesheet" href="/css/siteeye360.css"/>
</head>
<body data-page="home" class="canva-page">

  <main class="canva-stage" id="canva-stage">
    <!-- Export from Canva as PNG → save to public/images/canva-index.png -->
    <img
      class="canva-art"
      id="canva-art"
      src="/images/canva-index.png"
      alt="SiteEye360 — live 360° job site monitoring system for commercial trucks"
      width="1920"
      height="4800"
    />

    <nav class="canva-hotspots" aria-label="Main navigation">
      <a href="/" class="hotspot hotspot-logo" data-page="home" aria-label="SiteEye360 Home"></a>
      <a href="/overview.html" class="hotspot hotspot-overview" data-page="overview" aria-label="Overview"></a>
      <a href="/features.html" class="hotspot hotspot-features" data-page="features" aria-label="Features"></a>
      <a href="/how-it-works.html" class="hotspot hotspot-how" data-page="how-it-works" aria-label="How It Works"></a>
      <a href="/system-specs.html" class="hotspot hotspot-specs" data-page="system-specs" aria-label="System Specs"></a>
      <a href="/contact.html" class="hotspot hotspot-contact" data-page="contact" aria-label="Contact"></a>
    </nav>

    <aside class="alert-panel canva-alert" id="alert-panel" aria-label="Driver alert system demo">
      <div class="alert-header">
        <span class="alert-title">Driver Alert</span>
        <span class="live-badge">
          <span class="live-dot" aria-hidden="true"></span>
          Live
        </span>
      </div>

      <div class="mount-demo">
        <div class="device-unit" id="device-unit" role="button" tabindex="0" aria-label="Alert unit — drag into mount to activate">
          <span class="led" aria-hidden="true"></span>
          <span class="device-label">SiteEye360</span>
        </div>

        <div class="mount-slot" id="mount-slot" role="button" tabindex="0" aria-label="Hood mount — open circuit powers LED">
          <span class="mount-icon">Hood<br/>Mount</span>
        </div>
      </div>

      <p class="alert-status">
        <strong id="alert-status-text">Seat in mount to activate</strong>
      </p>
    </aside>
  </main>

  <script src="/js/siteeye360.js"></script>
</body>
</html>
