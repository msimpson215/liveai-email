<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A1 email orb link</title>
<style>
:root{--yellow:#FED100;--bg:#0a0a0a;--panel:#141414;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;line-height:1.6;padding:32px 20px 64px;}
.wrap{max-width:720px;margin:0 auto;}
h1{font-size:1.5rem;margin-bottom:8px;}
h1 span{color:var(--yellow);}
.lead{color:#aaa;margin-bottom:24px;}
.block{background:var(--panel);border:1px solid #2a2a2a;border-radius:10px;padding:20px;margin-bottom:20px;}
.code{background:#080808;border:1px solid #333;border-radius:8px;padding:14px;font-size:0.85rem;color:#f5e6a8;word-break:break-all;margin:10px 0 14px;}
.btn{padding:12px 22px;background:var(--yellow);color:#000;font-weight:900;border:none;border-radius:8px;cursor:pointer;margin-right:8px;}
.btn.secondary{background:transparent;border:2px solid var(--yellow);color:var(--yellow);}
.note{font-size:0.85rem;color:#888;}
</style>
</head>
<body>
<div class="wrap">
  <h1>A1 Asphalt <span>email orb</span></h1>
  <p class="lead">Tiny orb window, upper-right. Gmail stays underneath. No fake inbox.</p>

  <div class="block">
    <p class="note">Paste this link on the orb in Gmail:</p>
    <div class="code" id="httpsLink"></div>
    <button type="button" class="btn" data-copy="httpsLink">Copy link</button>
    <button type="button" class="btn secondary" id="test">Test tiny window</button>
  </div>

  <div class="block">
    <p class="note"><a href="/mailer.html" style="color:#FED100;">mailer.html</a> — ready email: “Talk to A1 Professional Asphalt now”</p>
  </div>
</div>
<script src="/assets/axon-email-orb.js"></script>
<script>
(function () {
  var o = 'https://liveai-email.onrender.com';
  document.getElementById('httpsLink').textContent = AxonEmailOrb.httpsHyperlink({ src: 'email' }, o);
  document.getElementById('test').onclick = function () { AxonEmailOrb.openEmailOrb({ src: 'email' }, o); };
  document.querySelectorAll('[data-copy]').forEach(function (btn) {
    btn.onclick = function () {
      navigator.clipboard.writeText(document.getElementById(btn.getAttribute('data-copy')).textContent).then(function () {
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.textContent = 'Copy link'; }, 1500);
      });
    };
  });
})();
</script>
</body>
</html>
