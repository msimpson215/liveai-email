<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="cache-control" content="no-store"/>
<title>Axon AI Brain — QuickBooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#1c1a16;
  --text:#2a2720;
  --yellow:#F5C518;
  --yellow-hot:#ffe566;
  --ember:#b8860b;
  --panel:rgba(255,255,255,.78);
  --line:rgba(40,35,20,.14);
  --mute:rgba(42,39,32,.62);
  --ok:#1f7a3a;
  --warn:#8a5a00;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse 95% 70% at 50% -8%, rgba(245,197,24,.42), transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 85%, rgba(120,110,90,.12), transparent 50%),
    linear-gradient(165deg, #eceae4 0%, #ddd9d0 45%, #cfc9bc 100%);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(rgba(40,35,20,.05) 1px, transparent 1px);
  background-size:24px 24px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 32%, #000 18%, transparent 75%);
  animation:grainDrift 18s linear infinite;
}
@keyframes grainDrift{
  from{transform:translateY(0)}
  to{transform:translateY(-28px)}
}

.stage{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(1.25rem,4vw,2.5rem) 1.25rem 2.5rem;
}

.brand{
  font-family:Syne,sans-serif;
  font-weight:800;
  font-size:clamp(1.85rem,6.5vw,3.4rem);
  letter-spacing:-0.03em;
  line-height:1;
  text-align:center;
  color:var(--ink);
  text-shadow:0 0 40px rgba(245,197,24,.45);
  animation:brandIn .9s cubic-bezier(.2,.8,.2,1) both;
}
.tag{
  margin-top:.55rem;
  font-size:clamp(.92rem,2.4vw,1.05rem);
  color:var(--mute);
  text-align:center;
  max-width:28rem;
  animation:brandIn 1s .12s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes brandIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.orb-wrap{
  position:relative;
  margin:clamp(1.6rem,5vh,3rem) 0 clamp(1.2rem,3vh,2rem);
  width:min(72vw,280px);height:min(72vw,280px);
  display:grid;place-items:center;
  animation:orbEnter 1.1s .2s cubic-bezier(.2,.85,.2,1) both;
}
@keyframes orbEnter{
  from{opacity:0;transform:scale(.72)}
  to{opacity:1;transform:none}
}
.orb-halo{
  position:absolute;inset:-18%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(245,197,24,.45) 0%, rgba(245,197,24,.12) 38%, transparent 68%);
  animation:haloPulse 3.2s ease-in-out infinite;
  pointer-events:none;
}
.orb-ring{
  position:absolute;inset:-6%;
  border-radius:50%;
  border:1px solid rgba(255,230,120,.35);
  box-shadow:0 0 40px rgba(245,197,24,.25), inset 0 0 30px rgba(245,197,24,.08);
  animation:ringSpin 14s linear infinite;
  pointer-events:none;
}
.orb-ring::after{
  content:"";position:absolute;inset:12%;border-radius:50%;
  border:1px dashed rgba(245,197,24,.22);
  animation:ringSpin 22s linear infinite reverse;
}
@keyframes haloPulse{
  0%,100%{transform:scale(1);opacity:.85}
  50%{transform:scale(1.08);opacity:1}
}
@keyframes ringSpin{to{transform:rotate(360deg)}}

.orb{
  position:relative;z-index:2;
  width:78%;height:78%;
  border-radius:50%;
  cursor:pointer;
  border:0;
  appearance:none;
  background:
    radial-gradient(circle at 32% 28%, #fff8c8 0%, var(--yellow-hot) 18%, var(--yellow) 42%, #d4a017 72%, #8a6208 100%);
  box-shadow:
    0 0 0 3px rgba(255,240,160,.35),
    0 0 50px rgba(245,197,24,.55),
    0 0 110px rgba(245,197,24,.28),
    inset 0 -18px 36px rgba(80,50,0,.35),
    inset 0 12px 24px rgba(255,255,220,.45);
  animation:orbPulse 2.8s ease-in-out infinite;
  transition:filter .25s;
}
.orb:focus-visible{outline:3px solid #fff;outline-offset:6px;}
.orb:hover{filter:brightness(1.06);}
@keyframes orbPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(255,240,160,.35),0 0 50px rgba(245,197,24,.55),0 0 110px rgba(245,197,24,.28),inset 0 -18px 36px rgba(80,50,0,.35),inset 0 12px 24px rgba(255,255,220,.45)}
  50%{transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,250,200,.55),0 0 80px rgba(245,197,24,.85),0 0 160px rgba(245,197,24,.4),inset 0 -18px 36px rgba(80,50,0,.35),inset 0 12px 24px rgba(255,255,220,.55)}
}
body.connecting .orb,body.active .orb{
  animation:orbLive 1.15s ease-in-out infinite alternate;
}
@keyframes orbLive{
  from{transform:scale(1.02);filter:saturate(1.1)}
  to{transform:scale(1.1);filter:saturate(1.25) brightness(1.08)}
}
body.error .orb{
  background:radial-gradient(circle at 32% 28%, #ffd0c8 0%, #e85d04 50%, #7a1a00 100%);
  animation:none;
}

.orb-label{
  position:absolute;z-index:3;left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-family:Syne,sans-serif;font-weight:700;font-size:.78rem;
  letter-spacing:.04em;text-transform:uppercase;
  color:rgba(20,14,0,.72);pointer-events:none;text-align:center;
  text-shadow:0 1px 0 rgba(255,255,200,.35);
}
body.active .orb-label,body.connecting .orb-label{color:rgba(20,14,0,.85)}

.status-row{
  display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;justify-content:center;
  margin-bottom:1.1rem;min-height:1.5rem;
  font-size:.8rem;color:var(--mute);
  animation:brandIn 1s .28s cubic-bezier(.2,.8,.2,1) both;
}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.28rem .65rem;border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.65);
  font-weight:600;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;
}
.pill .dot{
  width:7px;height:7px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 8px var(--yellow);animation:blink 1.6s infinite;
}
.pill.live .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.demo .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
@keyframes blink{50%{opacity:.35}}

.ask{
  width:min(100%,420px);
  display:flex;gap:.55rem;
  animation:brandIn 1s .35s cubic-bezier(.2,.8,.2,1) both;
}
.ask input{
  flex:1;min-width:0;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:14px;
  padding:.85rem 1rem;
  font:500 .95rem/1.3 "IBM Plex Sans",sans-serif;
  backdrop-filter:blur(10px);
}
.ask input::placeholder{color:rgba(42,39,32,.4)}
.ask input:focus{outline:2px solid rgba(245,197,24,.65);outline-offset:2px}
.ask button{
  border:0;border-radius:14px;
  background:linear-gradient(180deg, var(--yellow-hot), var(--yellow));
  color:var(--ink);
  font:800 .9rem/1 Syne,sans-serif;
  padding:0 1.1rem;cursor:pointer;
  box-shadow:0 0 24px rgba(245,197,24,.35);
}
.ask button:disabled{opacity:.55;cursor:wait}

.chips{
  display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;
  width:min(100%,520px);margin-top:.85rem;
  animation:brandIn 1s .42s cubic-bezier(.2,.8,.2,1) both;
}
.chip{
  border:1px solid var(--line);
  background:rgba(255,255,255,.55);
  color:var(--text);
  border-radius:999px;
  padding:.45rem .75rem;
  font:500 .75rem/1.2 "IBM Plex Sans",sans-serif;
  cursor:pointer;
  transition:border-color .15s, background .15s;
}
.chip:hover,.chip:focus-visible{
  border-color:rgba(180,140,20,.55);
  background:rgba(245,197,24,.18);
  outline:none;
}

.panel{
  width:min(100%,560px);
  margin-top:1.35rem;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  padding:1rem 1.1rem 1.15rem;
  backdrop-filter:blur(14px);
  box-shadow:0 18px 40px rgba(40,30,10,.12);
  display:none;
  animation:panelIn .55s cubic-bezier(.2,.8,.2,1) both;
}
.panel.show{display:block}
@keyframes panelIn{
  from{opacity:0;transform:translateY(18px) scale(.98)}
  to{opacity:1;transform:none}
}
.panel h2{
  font-family:Syne,sans-serif;font-size:1rem;font-weight:700;
  margin-bottom:.45rem;color:var(--ink);
}
.answer{
  font-size:.92rem;line-height:1.55;color:var(--text);
  margin-bottom:.85rem;
}
.warning{color:var(--warn);font-size:.8rem;margin-bottom:.6rem}
#chartBox{position:relative;width:100%;height:220px;margin-top:.25rem}
#chart{width:100%;height:100%;display:block}

.foot{
  margin-top:auto;padding-top:2rem;
  font-size:.72rem;color:rgba(42,39,32,.45);text-align:center;
  max-width:28rem;line-height:1.45;
}
.foot a{color:rgba(140,100,10,.95);text-decoration:none}
.foot a:hover{text-decoration:underline}

@media(max-width:480px){
  .ask{flex-direction:column}
  .ask button{padding:.85rem 1rem}
  #chartBox{height:200px}
}
</style>
</head>
<body>
  <main class="stage">
    <h1 class="brand">Axon AI Brain</h1>
    <p class="tag">Joe’s books. Yellow orb. Ask for a P&amp;L or chart payroll across years.</p>

    <div class="orb-wrap">
      <div class="orb-halo" aria-hidden="true"></div>
      <div class="orb-ring" aria-hidden="true"></div>
      <button type="button" class="orb" id="orb" aria-label="Tap to talk to Axon AI Brain"></button>
      <span class="orb-label" id="orbLabel">Tap to talk</span>
    </div>

    <div class="status-row" id="statusRow">
      <span class="pill demo" id="modePill"><span class="dot"></span><span id="modeText">Checking books…</span></span>
      <span id="voiceHint">Voice + text both work</span>
    </div>

    <form class="ask" id="askForm">
      <input id="q" type="text" autocomplete="off" placeholder="Ask the books…" aria-label="Ask the books"/>
      <button type="submit" id="askBtn">Ask</button>
    </form>

    <div class="chips" role="list">
      <button type="button" class="chip" data-q="A year ago in the month of May, give me a profit and loss statement">May last year P&amp;L</button>
      <button type="button" class="chip" data-q="On an XY chart, look at my payroll over the past five years">Payroll 5-year chart</button>
      <button type="button" class="chip" data-q="What was net income last May?">Net income last May</button>
    </div>

    <section class="panel" id="panel" aria-live="polite">
      <h2 id="panelTitle">Answer</h2>
      <p class="warning" id="warn" hidden></p>
      <p class="answer" id="answer"></p>
      <div id="chartBox"><canvas id="chart"></canvas></div>
    </section>

    <p class="foot">
      Live AI Email · QuickBooks connect via Intuit app credentials on Render ·
      <a href="/demo/catalog.html">Demo catalog</a>
    </p>
  </main>

<script>
const orb=document.getElementById('orb');
const orbLabel=document.getElementById('orbLabel');
const modePill=document.getElementById('modePill');
const modeText=document.getElementById('modeText');
const voiceHint=document.getElementById('voiceHint');
const askForm=document.getElementById('askForm');
const qInput=document.getElementById('q');
const askBtn=document.getElementById('askBtn');
const panel=document.getElementById('panel');
const panelTitle=document.getElementById('panelTitle');
const answerEl=document.getElementById('answer');
const warnEl=document.getElementById('warn');
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');

let pc=null,localStream=null,starting=false,audioEl=null;

async function loadStatus(){
  try{
    const r=await fetch('/api/brain/status',{cache:'no-store'});
    const d=await r.json();
    const live=d.mode==='live';
    modePill.className='pill '+(live?'live':'demo');
    modeText.textContent=live?'Live QuickBooks':'Demo books';
    voiceHint.textContent=d.company||'';
  }catch(e){
    modeText.textContent='Offline';
  }
}
loadStatus();

function money(n){
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
}

function fitCanvas(){
  const box=canvas.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=box.clientWidth;
  const h=box.clientHeight;
  canvas.width=Math.floor(w*dpr);
  canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w,h};
}

function drawChart(chart){
  const {w,h}=fitCanvas();
  ctx.clearRect(0,0,w,h);
  if(!chart)return;

  const pad={t:28,r:16,b:42,l:52};
  const iw=w-pad.l-pad.r;
  const ih=h-pad.t-pad.b;

  ctx.fillStyle='rgba(28,26,22,.9)';
  ctx.font='600 13px Syne,sans-serif';
  ctx.fillText(chart.title||'',pad.l,18);

  if(chart.type==='bar'&&chart.series&&chart.series.length){
    // Grouped bars: income vs expenses by category name (top categories)
    const income=(chart.series.find(s=>/income/i.test(s.name))||chart.series[0]).points.slice(0,6);
    const expense=(chart.series.find(s=>/expense/i.test(s.name))||chart.series[1]||{points:[]}).points.slice(0,6);
    const labels=[...new Set([...income.map(p=>p.x),...expense.map(p=>p.x)])].slice(0,6);
    const mapY=(pts,name)=>{const hit=pts.find(p=>p.x===name);return hit?Number(hit.y)||0:0};
    const vals=labels.flatMap(l=>[mapY(income,l),mapY(expense,l)]);
    const maxY=Math.max(...vals,1);
    const gap=8;
    const groupW=iw/Math.max(labels.length,1);
    const bw=(groupW-gap)/2;
    labels.forEach((label,i)=>{
      const x0=pad.l+i*groupW+gap/2;
      const iv=mapY(income,label);
      const ev=mapY(expense,label);
      const ihBar=(iv/maxY)*ih*0.85;
      const ehBar=(ev/maxY)*ih*0.85;
      ctx.fillStyle='#F5C518';
      roundRect(ctx,x0,pad.t+ih-ihBar,bw,ihBar,6);ctx.fill();
      ctx.fillStyle='#C45C00';
      roundRect(ctx,x0+bw+2,pad.t+ih-ehBar,bw,ehBar,6);ctx.fill();
      ctx.fillStyle='rgba(42,39,32,.55)';
      ctx.font='10px IBM Plex Sans,sans-serif';
      ctx.textAlign='center';
      const short=String(label).length>12?String(label).slice(0,11)+'…':label;
      ctx.fillText(short,x0+groupW/2-gap/2,h-12);
    });
    ctx.fillStyle='#8a7000';ctx.font='11px IBM Plex Sans,sans-serif';ctx.textAlign='left';
    ctx.fillText('Income',pad.l,18);
    ctx.fillStyle='#C45C00';
    ctx.fillText('Expenses',pad.l+64,18);
    return;
  }

  if(chart.type==='line'||(chart.series&&chart.series[0]&&chart.type!=='waterfall')){
    const series=chart.series||[{points:chart.points||[],color:'#F5C518',name:'Series'}];
    const all=series.flatMap(s=>s.points||[]);
    if(!all.length)return;
    const ys=all.map(p=>Number(p.y)||0);
    let minY=Math.min(...ys,0);
    let maxY=Math.max(...ys);
    if(minY===maxY){maxY=minY+1}
    const padY=(maxY-minY)*0.08;
    minY-=padY;maxY+=padY;
    const xs=series[0].points.map(p=>p.x);

    ctx.strokeStyle='rgba(40,35,20,.1)';
    ctx.lineWidth=1;
    for(let i=0;i<=4;i++){
      const y=pad.t+ih*(i/4);
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+iw,y);ctx.stroke();
      const val=maxY-(maxY-minY)*(i/4);
      ctx.fillStyle='rgba(42,39,32,.45)';
      ctx.font='11px IBM Plex Sans,sans-serif';
      ctx.textAlign='right';
      ctx.fillText(money(val),pad.l-8,y+4);
    }

    series.forEach((s,si)=>{
      const pts=s.points||[];
      const color=s.color||'#D4A017';
      ctx.beginPath();
      pts.forEach((p,i)=>{
        const x=pad.l+(xs.length===1?iw/2:(i/(xs.length-1))*iw);
        const y=pad.t+ih*((maxY-p.y)/(maxY-minY));
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.strokeStyle=color;
      ctx.lineWidth=2.5;
      ctx.stroke();
      if(si===0&&chart.type==='line'){
        ctx.lineTo(pad.l+iw,pad.t+ih);
        ctx.lineTo(pad.l,pad.t+ih);
        ctx.closePath();
        const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ih);
        g.addColorStop(0,'rgba(245,197,24,.35)');
        g.addColorStop(1,'rgba(245,197,24,0)');
        ctx.fillStyle=g;
        ctx.fill();
      }
      pts.forEach((p,i)=>{
        const x=pad.l+(xs.length===1?iw/2:(i/(xs.length-1))*iw);
        const y=pad.t+ih*((maxY-p.y)/(maxY-minY));
        ctx.beginPath();
        ctx.arc(x,y,4.5,0,Math.PI*2);
        ctx.fillStyle=color;
        ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.9)';
        ctx.lineWidth=1.5;
        ctx.stroke();
      });
    });

    xs.forEach((label,i)=>{
      const x=pad.l+(xs.length===1?iw/2:(i/(xs.length-1))*iw);
      ctx.fillStyle='rgba(42,39,32,.55)';
      ctx.font='11px IBM Plex Sans,sans-serif';
      ctx.textAlign='center';
      ctx.fillText(String(label),x,h-14);
    });
    return;
  }

  // waterfall / simple bars
  const points=chart.points||[];
  if(!points.length)return;
  const ys=points.map(p=>Math.abs(Number(p.y)||0));
  const maxY=Math.max(...ys,1);
  const gap=10;
  const bw=(iw-(points.length-1)*gap)/points.length;
  points.forEach((p,i)=>{
    const val=Number(p.y)||0;
    const bh=(Math.abs(val)/maxY)*ih*0.85;
    const x=pad.l+i*(bw+gap);
    const y=pad.t+ih-bh;
    ctx.fillStyle=p.color||'#F5C518';
    roundRect(ctx,x,y,bw,bh,8);
    ctx.fill();
    ctx.fillStyle='rgba(42,39,32,.65)';
    ctx.font='11px IBM Plex Sans,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(String(p.x),x+bw/2,h-14);
    ctx.fillStyle='rgba(28,26,22,.9)';
    ctx.font='600 11px IBM Plex Sans,sans-serif';
    ctx.fillText(money(val),x+bw/2,y-8);
  });
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

async function askBooks(question){
  const q=String(question||'').trim();
  if(!q)return;
  qInput.value=q;
  askBtn.disabled=true;
  panel.classList.add('show');
  panelTitle.textContent='Thinking…';
  answerEl.textContent='';
  warnEl.hidden=true;
  fitCanvas();ctx.clearRect(0,0,canvas.width,canvas.height);
  try{
    const r=await fetch('/api/brain/ask',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q})
    });
    const d=await r.json();
    panelTitle.textContent=d.intent==='payroll_chart'?'Payroll trend'
      :d.intent==='pnl'?'Profit & Loss':'Axon AI Brain';
    answerEl.textContent=d.answer||'No answer.';
    if(d.warning){warnEl.hidden=false;warnEl.textContent=d.warning}
    if(d.chart){
      panel.dataset.lastChart=JSON.stringify(d.chart);
      drawChart(d.chart);
    }else{
      delete panel.dataset.lastChart;
    }
  }catch(e){
    panelTitle.textContent='Error';
    answerEl.textContent='Could not reach the brain. Try again.';
  }
  askBtn.disabled=false;
}

askForm.addEventListener('submit',e=>{
  e.preventDefault();
  askBooks(qInput.value);
});
document.querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click',()=>askBooks(btn.getAttribute('data-q')));
});
window.addEventListener('resize',()=>{
  if(panel.classList.contains('show')&&panel.dataset.lastChart){
    try{drawChart(JSON.parse(panel.dataset.lastChart))}catch(e){}
  }
});

/* ---- Voice (OpenAI Realtime via /session?src=qb) ---- */
function ensureAudio(){
  if(!audioEl){audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;}
  return audioEl;
}
async function stopVoice(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;
  document.body.classList.remove('active','connecting','error');
  orbLabel.textContent='Tap to talk';
}
async function connectVoice(){
  const r=await fetch('/session?src=qb',{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  pc.ontrack=e=>{if(audio.srcObject!==e.streams[0]){audio.srcObject=e.streams[0];audio.play().catch(()=>{})}};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc.addTrack(localStream.getTracks()[0]);
  const dc=pc.createDataChannel('oai-events');
  dc.addEventListener('message',ev=>{
    try{
      const msg=JSON.parse(ev.data);
      if(msg.type==='conversation.item.input_audio_transcription.completed'&&msg.transcript){
        const t=msg.transcript;
        if(/payroll|profit|p\s*&\s*l|pnl|chart|may/i.test(t))askBooks(t);
      }
    }catch(e){}
  });
  dc.addEventListener('open',()=>{
    try{
      dc.send(JSON.stringify({
        type:'session.update',
        session:{
          type:'realtime',
          audio:{input:{transcription:{model:'gpt-4o-mini-transcribe'}}}
        }
      }));
    }catch(e){}
    try{dc.send(JSON.stringify({type:'response.create'}))}catch(e){}
  });
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  document.body.classList.add('active');
  document.body.classList.remove('connecting','error');
  orbLabel.textContent='Listening…';
}
async function toggleVoice(){
  if(pc||starting){await stopVoice();return}
  starting=true;
  document.body.classList.add('connecting');
  document.body.classList.remove('error');
  orbLabel.textContent='Connecting…';
  try{await connectVoice()}
  catch(e){
    console.error(e);
    await stopVoice();
    document.body.classList.add('error');
    orbLabel.textContent='Try again';
    panel.classList.add('show');
    panelTitle.textContent='Voice';
    answerEl.textContent=e.message&&/OPENAI|API key|session/i.test(e.message)
      ?e.message
      :'Voice needs OPENAI_API_KEY on the server. Text ask still works on demo books.';
  }
  starting=false;
}
orb.addEventListener('click',toggleVoice);
orb.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleVoice()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')stopVoice()});
</script>
