<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<title>SiteEye360 Live — AI team member</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--orange:#ff6a00;--orange2:#ff8a2b;}
html,body{width:100%;height:100%;overflow:hidden;color:#fff;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;}
body{
  background:radial-gradient(circle at 50% 44%, rgba(255,106,0,.22) 0%, rgba(255,106,0,.06) 34%, rgba(11,13,18,0) 62%), #0b0d12;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 22px;text-align:center;
}
.brand{font-weight:900;font-size:clamp(20px,6vw,30px);letter-spacing:-.02em;margin-bottom:6px;}
.brand .eye{color:var(--orange);}
.brand .live{color:#ff3b30;font-weight:900;display:inline-flex;align-items:center;gap:5px;font-size:.62em;vertical-align:middle;}
.brand .live .d{width:8px;height:8px;border-radius:50%;background:#ff2b20;box-shadow:0 0 9px #ff2b20;animation:blink 1.1s infinite;}
@keyframes blink{50%{opacity:.3}}
.tag{color:#c9ced8;font-size:clamp(13px,3.4vw,16px);font-weight:600;margin-bottom:30px;}
.tag b{color:#fff;font-weight:800;}
#orb{
  width:46vmin;height:46vmin;min-width:170px;min-height:170px;max-width:300px;max-height:300px;
  border-radius:50%;cursor:pointer;position:relative;
  background:radial-gradient(circle at 48% 40%, #ffe0b0 0%, var(--orange2) 32%, var(--orange) 60%, #c74e00 100%);
  box-shadow:0 0 60px 12px rgba(255,106,0,.45), inset 0 0 44px rgba(255,255,255,.16);
  animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 50px 8px rgba(255,106,0,.38), inset 0 0 44px rgba(255,255,255,.16);}
  50%{box-shadow:0 0 84px 22px rgba(255,138,43,.6), inset 0 0 50px rgba(255,255,255,.22);}
}
body.connecting #orb,body.active #orb{animation:pulseOn 1.2s ease-in-out infinite alternate;}
@keyframes pulseOn{from{transform:scale(.98);}to{transform:scale(1.06);}}
#status{margin-top:26px;font-size:14px;font-weight:800;color:#e7ebf1;min-height:20px;letter-spacing:.02em;}
body.idle #status::after{content:"Tap the orb to talk";}
body.connecting #status::after{content:"Connecting\2026";}
body.active #status::after{content:"Listening \2014 ask me anything";}
body.error #status::after{content:"Tap the orb to try again";}
.hint{margin-top:10px;font-size:11.5px;color:#7a828f;letter-spacing:.04em;}
.hint b{color:var(--orange);font-weight:800;}
</style>
</head>
<body class="idle">
<div class="brand">Site<span class="eye">Eye</span>360 <span class="live"><span class="d"></span>Live</span></div>
<div class="tag"><b>AI team member</b> &mdash; ask me anything</div>
<div id="orb" role="button" tabindex="0" aria-label="Tap to talk to the SiteEye AI team member"></div>
<div id="status" aria-live="polite"></div>
<div class="hint">Powered by <b>Axon AI</b></div>
<script>
/* Simple SiteEye voice orb — connects to the SiteEye 360 Live brain (src=siteeye). */
const SRC='siteeye';
const sessionUrl='/session?gate=1&src='+encodeURIComponent(SRC);
let pc=null,localStream=null,starting=false,audioEl=null;
function setState(s){document.body.className=s;}
function ensureAudio(){if(!audioEl){audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;}return audioEl;}
function resumeAudio(){if(audioEl&&audioEl.paused){audioEl.play().catch(function(){});return true;}return false;}
async function stop(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  dc=null;responseActive=false;speechStartedAt=0;lastTurnMs=0;dropTurn();
  starting=false;setState('idle');
}
let micTrack=null,dc=null,aiSpeaking=false,audioCtx=null,aiAnalyser=null,aiData=null,aiMeterTimer=null,lastAiSound=0;
/* Only answer a real person. The server no longer replies to every committed
   chunk of audio, so wind can't be mistaken for a turn and trigger the opening
   line again. We check the transcript against how long the sound lasted. */
const JUNK_TURNS=new Set(['','you','thank you','thanks','thanks for watching','bye','goodbye','silence','music','uh','um','hmm','mm','ah','oh','huh','so','the','a','i']);
let responseActive=false,speechStartedAt=0,lastTurnMs=0,turnPending=false,turnTimer=null;
function isRealSpeech(transcript,ms){
  const s=String(transcript||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
  if(!s)return false;
  if(ms<320)return false;
  if(JUNK_TURNS.has(s)&&ms<1200)return false;
  return /[a-z0-9]/.test(s);
}
function dropTurn(){turnPending=false;if(turnTimer){clearTimeout(turnTimer);turnTimer=null;}}
function askForReply(){
  const send=dc&&dc.readyState==='open';
  dropTurn();
  if(responseActive||aiSpeaking||!send)return;
  try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}
}
function handleEvent(ev){
  let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
  const t=msg.type||'';
  if(t==='response.created')responseActive=true;
  else if(t==='response.done')responseActive=false;
  else if(t==='input_audio_buffer.speech_started')speechStartedAt=Date.now();
  else if(t==='input_audio_buffer.speech_stopped'){
    lastTurnMs=speechStartedAt?(Date.now()-speechStartedAt):0;
    turnPending=true;
    if(turnTimer)clearTimeout(turnTimer);
    turnTimer=setTimeout(function(){
      if(turnPending&&lastTurnMs>=700)askForReply();else dropTurn();
    },2500);
  }
  else if(t==='conversation.item.input_audio_transcription.completed'){
    if(turnPending){if(isRealSpeech(msg.transcript,lastTurnMs))askForReply();else dropTurn();}
  }
  else if(t==='conversation.item.input_audio_transcription.failed'){
    if(turnPending){if(lastTurnMs>=700)askForReply();else dropTurn();}
  }
}
function refreshMic(){
  if(!micTrack)return;
  /* Mute mic while SiteEye AI is talking so wind/bar noise cannot cancel it. */
  micTrack.enabled=!aiSpeaking;
}
function setupAiMeter(stream){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(function(){});
    const src=audioCtx.createMediaStreamSource(stream);
    aiAnalyser=audioCtx.createAnalyser();aiAnalyser.fftSize=512;
    aiData=new Uint8Array(aiAnalyser.frequencyBinCount);
    src.connect(aiAnalyser);lastAiSound=Date.now();
    if(aiMeterTimer)clearInterval(aiMeterTimer);
    aiMeterTimer=setInterval(function(){
      if(!aiAnalyser)return;
      aiAnalyser.getByteTimeDomainData(aiData);
      let sum=0;for(let i=0;i<aiData.length;i++){const v=(aiData[i]-128)/128;sum+=v*v;}
      const rms=Math.sqrt(sum/aiData.length),now=Date.now();
      if(rms>0.025){lastAiSound=now;if(!aiSpeaking){aiSpeaking=true;refreshMic();}}
      else if(aiSpeaking&&(now-lastAiSound)>700){aiSpeaking=false;refreshMic();}
    },100);
  }catch(e){}
}
async function connectVoice(){
  const r=await fetch(sessionUrl,{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  pc.ontrack=function(e){
    if(audio.srcObject!==e.streams[0]){audio.srcObject=e.streams[0];audio.play().catch(function(){});}
    setupAiMeter(e.streams[0]);
  };
  localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  micTrack=localStream.getAudioTracks()[0];
  micTrack.enabled=false; /* mute during opening so wind cannot cut the intro */
  pc.addTrack(micTrack);
  dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}});
  dc.addEventListener('message',handleEvent);
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  setState('active');
}
async function start(){
  if(pc||starting)return;
  starting=true;setState('connecting');
  try{await connectVoice();}
  catch(e){console.error(e);await stop();setState('error');}
  starting=false;
}
function toggleVoice(){if(pc||starting){if(!resumeAudio())stop();}else{start();}}
const orb=document.getElementById('orb');
orb.addEventListener('click',function(e){e.stopPropagation();toggleVoice();});
orb.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleVoice();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')stop();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&(pc||starting))stop();});
window.addEventListener('pagehide',function(){if(pc||starting)stop();});
window.addEventListener('beforeunload',function(){if(pc||starting)stop();});
setState('idle');
</script>
</body>
</html>
