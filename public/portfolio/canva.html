<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7fc">
<title>Martin Simpson — Entire Portfolio</title>
<link rel="icon" href="/icons/axon-blue-192.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#f4f7fc}
  .stage{position:relative;width:100%;max-width:1024px;margin:0 auto;line-height:0}
  .art{display:block;width:100%;height:auto}
  .hot{position:absolute;display:block;border-radius:12px;-webkit-tap-highlight-color:transparent}
  .hot:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
  body.tune .hot{outline:2px dashed #f4681f;background:rgba(244,104,31,.15)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="art" src="/portfolio/assets/canva-dashboard-2.png" width="1024" height="1536"
       alt="Martin Simpson — Entire Portfolio. Projects, products, and AI applications, powered by Axon AI.">
</div>
<script>
/* Click areas over the Canva artwork, in pixels of a 683 x 1024 view of it.
   Add ?tune=1 to the URL to outline them after a new export. */
var W=683,H=1024;
var SPOTS=[
  [458,10,508,36,'/portfolio/','Portfolio'],
  [535,10,576,36,'/cv2/','About'],
  [598,10,646,36,'mailto:msimpson215@gmail.com','Contact'],

  [27,212,146,343,'/axon-ai','Axon AI'],
  [156,212,275,343,'/cv2/','AI Interactive Résumé'],
  [285,212,403,343,'/ask/stress-test','Conversational Pamphlets'],
  [413,212,530,343,'/talk.html','Convo Email'],
  [541,212,657,343,'https://a1-test-fyjq.onrender.com','Website AI'],

  [27,360,146,488,'/grocery','Grocery Shopper'],
  [156,360,275,488,'https://a1-test-fyjq.onrender.com/dierbergs-demo/','Grocery Shopper Teammate'],
  [285,360,403,488,'/aipoint.html','AI Point'],
  [541,360,657,488,'/axon.html','Personal Axon'],

  [27,555,146,694,'/portfolio/predeicer.html','Pre-De-Icer'],
  [156,555,275,694,'/portfolio/siteeye.html','SiteEye 360'],
  [285,555,403,694,'/portfolio/bandage.html','No More Boo-Boos'],
  [413,555,530,694,'/portfolio/rmk.html','Ronald McDonald Kitchen'],
  [541,555,657,694,'mailto:msimpson215@gmail.com?subject=Product%20idea','Add Product'],

  [28,760,147,901,'/dna-fraternity.html','Home DNA Paternity Test'],
  [158,760,277,901,'/dna','Axon DNA Brain']
];
var stage=document.getElementById('stage');
SPOTS.forEach(function(s){
  var a=document.createElement('a');
  a.className='hot';
  a.href=s[4];
  a.setAttribute('aria-label',s[5]);
  if(/^https?:/.test(s[4]))a.target='_blank',a.rel='noopener';
  a.style.left=(s[0]/W*100)+'%';
  a.style.top=(s[1]/H*100)+'%';
  a.style.width=((s[2]-s[0])/W*100)+'%';
  a.style.height=((s[3]-s[1])/H*100)+'%';
  stage.appendChild(a);
});
if(/[?&]tune=1/.test(location.search))document.body.classList.add('tune');
</script>
</body>
</html>
