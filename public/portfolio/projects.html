<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Project Portfolio — Joe Schanze &amp; Martin Simpson</title>
<link rel="icon" href="/icons/axon-blue-192.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff}
  .stage{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0}
  .art{display:block;width:100%;height:auto}
  .hot{position:absolute;display:block;border-radius:10px;-webkit-tap-highlight-color:transparent}
  .hot:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
  body.tune .hot{outline:2px dashed #f4681f;background:rgba(244,104,31,.15)}
  .cover{position:absolute;background:#fff;z-index:2}
  .added{position:absolute;z-index:2;container-type:inline-size;display:flex;flex-direction:column;background:#fff;border-radius:3.5%/7%;overflow:hidden;text-decoration:none;color:#0a204a;font-family:Arial,Helvetica,sans-serif;line-height:1.2;box-shadow:0 0 0 2px #fff,0 6px 16px rgba(20,58,110,.1)}
  .added img{display:block;width:100%;height:52%;object-fit:cover;flex:none}
  .added .t{font-weight:700;font-size:5.4cqw;padding:2.6cqw 4.5cqw .6cqw}
  .added .d{flex:1;font-size:3.9cqw;color:#3f5470;padding:0 4.5cqw;line-height:1.3}
  .added .m{align-self:flex-end;font-size:3.2cqw;color:#176be8;padding:0 4.5cqw 2.6cqw}
  .jump{max-width:1536px;margin:0 auto;padding:12px 22px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:800}
  .jump a{color:#176be8;text-decoration:none}
  .who{max-width:1536px;margin:0 auto;padding:16px 22px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;display:flex;gap:28px;line-height:1.4}
  .who a{color:#176be8;font-weight:800;text-decoration:none}
  .who span{color:#8aa0b8}
</style>
</head>
<body>
<p class="jump"><a href="/portfolio/projects.html">Portfolio</a><a href="/portfolio/relay/">Axon Relay</a><a href="/cv2/">Résumé</a><a href="https://a1-test-fyjq.onrender.com">A1 Asphalt</a></p>
<div class="stage" id="stage">
  <img class="art" src="/portfolio/assets/project-portfolio.png?v=4" width="1536" height="1024"
       alt="Project Portfolio — AI applications, products, and inventions. Joe Schanze and Martin Simpson.">
  </div>
<p class="who"><a href="/cv2/">Martin Simpson</a><span>Joe Schanze — résumé coming</span></p>
<script>
/* Click areas over the Canva artwork, in pixels of a 1024 x 682 view of it.
   Nothing is drawn on the artwork. Add ?tune=1 to outline the areas. */
var W=1024,H=682;
var COLS=[[20,257],[270,505],[519,754],[767,1003]];
var ROWS=[[128,259],[267,391],[403,524],[533,652]];
var SLUGS=[
  ['axon-websites','Axon AI for Websites'],
  ['conversational-resume','Conversational Résumé'],
  ['conversational-email','Conversational Email'],
  ['ai-point','Axon AI Point'],
  ['patient-education','Patient Education QR'],
  ['product-instructions','Product Instruction QR'],
  ['personal-axon','Personal Axon'],
  ['grocery-shopping','Grocery Shopping Teammate'],
  ['added','ai-to-ai','Axon Relay'],
  ['cover','Start a Business with AI'],
  ['dna-answers','DNA Answers'],
  ['std-sti-testing','STD / STI Testing'],
  ['pre-de-icer','Pre-De-Icer'],
  ['siteeye-360','SiteEye 360 Live'],
  ['no-more-boo-boos','No More Boo-Boos'],
  ['ronald-mcdonald-kitchen','Ronald McDonald Kitchen']
];
var stage=document.getElementById('stage');
SLUGS.forEach(function(s,i){
  if(!s) return;
  var c=COLS[i%4],r=ROWS[Math.floor(i/4)];
  var kind=s[0];
  var slug=kind==='cover'||kind==='added'?s[1]:s[0];
  var label=kind==='cover'||kind==='added'?s[s.length-1]:s[1];
  var a=document.createElement(kind==='cover'?'div':'a');
  a.className=kind==='cover'?'cover':kind==='added'?'added':'hot';
  if(kind!=='cover'){a.href=kind==='added'?'/portfolio/relay/':'/portfolio/projects/'+s[0]+'.html';}
  a.setAttribute('aria-label',label);
  if(kind==='added'){
    a.innerHTML='<img src="/portfolio/relay/relay-tile.jpg" alt=""><span class="t">Axon Relay</span><span class="d">Your AI calls people, or talks to their AI, so you never pick up the phone.</span><span class="m">Learn more →</span>';
  }
  a.style.left=(c[0]/W*100)+'%';
  a.style.top=(r[0]/H*100)+'%';
  a.style.width=((c[1]-c[0])/W*100)+'%';
  a.style.height=((r[1]-r[0])/H*100)+'%';
  stage.appendChild(a);
});
/* His name in the header, and his photo, both open the résumé. */
[['Martin Simpson','/cv2/','50.5%','13%','12%','4.5%'],['Martin Simpson','/cv2/','74%','0%','26%','17%']].forEach(function(h){
  var a=document.createElement('a');
  a.className='hot';
  a.href=h[1];
  a.setAttribute('aria-label',h[0]);
  a.style.left=h[2]; a.style.top=h[3]; a.style.width=h[4]; a.style.height=h[5];
  stage.appendChild(a);
});
if(/[?&]tune=1/.test(location.search))document.body.classList.add('tune');
</script>
</body>
</html>
