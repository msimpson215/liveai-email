<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axon AI</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb {
      width: 160px;
      height: 160px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      color: #2b2417;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.15;
      background:
        radial-gradient(circle at 35% 35%, #fff8c9 0%, #ffe27a 28%, #ffc61a 58%, #f59e0b 100%);
      box-shadow:
        0 0 42px rgba(255, 193, 7, 0.45),
        0 18px 40px rgba(0,0,0,0.18),
        inset 0 10px 18px rgba(255,255,255,0.45),
        inset 0 -16px 24px rgba(165,100,0,0.18);
    }

    .orb:active {
      transform: scale(0.985);
    }
  </style>
</head>
<body>
  <button class="orb" id="launchOrb" aria-label="Talk to Axon AI">
    Talk to<br />Axon AI
  </button>

  <script>
    const APP_URL = "https://liveai-email.onrender.com";
    const width = 420;
    const height = 640;
    const left = Math.max(0, Math.round((window.screen.width - width) / 2));
    const top = Math.max(0, Math.round((window.screen.height - height) / 2));

    let launched = false;

    function openAxon() {
      if (launched) return;
      launched = true;

      const popup = window.open(
        APP_URL,
        "axon",
        `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no`
      );

      if (popup) {
        popup.focus();
        setTimeout(() => window.close(), 150);
      } else {
        launched = false;
      }
    }

    document.getElementById("launchOrb").addEventListener("click", openAxon);

    window.addEventListener("load", () => {
      setTimeout(openAxon, 50);
    });
  </script>
</body>
</html>
