<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axon AI</title>
  <style>
    :root {
      --bg: #f6f1df;
      --orb1: #ffe27a;
      --orb2: #ffc61a;
      --orb3: #f59e0b;
      --orbGlow: rgba(255, 193, 7, 0.42);
      --text: #2b2417;
      --shadow: rgba(0,0,0,0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .orb-button {
      width: 168px;
      height: 168px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: var(--text);
      font-weight: 700;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: -0.01em;
      background:
        radial-gradient(circle at 35% 35%, #fff8c9 0%, var(--orb1) 28%, var(--orb2) 58%, var(--orb3) 100%);
      box-shadow:
        0 0 36px var(--orbGlow),
        0 18px 40px var(--shadow),
        inset 0 10px 18px rgba(255,255,255,0.45),
        inset 0 -16px 24px rgba(165,100,0,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .orb-button:hover {
      transform: scale(1.03);
      box-shadow:
        0 0 52px rgba(255, 193, 7, 0.55),
        0 20px 44px rgba(0,0,0,0.2),
        inset 0 10px 18px rgba(255,255,255,0.45),
        inset 0 -16px 24px rgba(165,100,0,0.18);
    }

    .orb-button:active {
      transform: scale(0.985);
    }

    .hidden-link {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <button class="orb-button" id="launchOrb" aria-label="Talk to Axon AI">
      Talk to<br />Axon AI
    </button>

    <a
      id="fallbackLink"
      class="hidden-link"
      href="https://liveai-email.onrender.com"
      target="axon"
      rel="noopener"
    >
      Open Axon
    </a>
  </div>

  <script>
    const APP_URL = "https://liveai-email.onrender.com";
    const width = 420;
    const height = 640;
    const left = Math.max(0, Math.round((window.screen.width - width) / 2));
    const top = Math.max(0, Math.round((window.screen.height - height) / 2));

    function openAxon() {
      const popup = window.open(
        APP_URL,
        "axon",
        `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no`
      );

      if (popup) {
        popup.focus();
        setTimeout(() => window.close(), 250);
      } else {
        window.location.href = APP_URL;
      }
    }

    document.getElementById("launchOrb").addEventListener("click", openAxon);

    window.addEventListener("load", () => {
      setTimeout(openAxon, 80);
    });
  </script>
</body>
</html>
