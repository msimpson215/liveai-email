<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A1 Asphalt</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#111;color:#FED100;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;}
  p{font-size:13px;opacity:0.85;margin:0;}
</style>
<script src="/assets/axon-email-orb.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var opts = { src: params.get('src') || 'email' };
  if (params.get('name')) opts.name = params.get('name');
  if (params.get('tier')) opts.tier = params.get('tier');

  var w = null;
  try { w = AxonEmailOrb.openEmailOrb(opts); } catch (e) { w = null; }

  if (w) {
    setTimeout(function () { try { window.close(); } catch (e) {} }, 100);
  } else {
    location.replace(AxonEmailOrb.buildPlateUrl(opts));
  }
})();
</script>
</head>
<body>
  <p>Opening A1 orb…</p>
</body>
</html>
