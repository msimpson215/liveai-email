<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title></title>
<script src="/assets/axon-email-orb.js"></script>
<script>
(function () {
  var w = null;
  try { w = AxonEmailOrb.openEmailOrb({ src: 'email' }); } catch (e) {}
  if (w) {
    try { window.close(); } catch (e) {}
    /* If this tab can't close (Gmail opened it), jump focus isn't possible —
       leave a blank page so it isn't a second "product". */
    document.write('');
  } else {
    location.replace('/email-plate.html?src=email&popup=1&autostart=1');
  }
})();
</script>
</head>
<body></body>
</html>
