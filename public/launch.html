<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launching Axon…</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status {
      color: #666;
      font-size: 14px;
      text-align: center;
    }

    .status a {
      color: #6b46ff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="status">
    Opening Axon…
    <div style="margin-top:10px;">
      <a href="https://liveai-email.onrender.com" target="axon" rel="noopener">
        Tap here if nothing opens
      </a>
    </div>
  </div>

  <script>
    const width = 420;
    const height = 640;
    const left = Math.max(0, Math.round((window.screen.width - width) / 2));
    const top = Math.max(0, Math.round((window.screen.height - height) / 2));

    const popup = window.open(
      "https://liveai-email.onrender.com",
      "axon",
      `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no`
    );

    if (popup) {
      popup.focus();
      setTimeout(() => {
        window.close();
      }, 300);
    }
  </script>
</body>
</html>
