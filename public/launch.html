<!DOCTYPE html>
<html>
<head>
  <title>Launching Axon…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f7f7f8;
      font-family: Arial, sans-serif;
    }
    .hint {
      display: grid;
      place-items: center;
      height: 100%;
      color: #666;
      font-size: 14px;
    }
    a { color: #6b46ff; }
  </style>
</head>
<body>
  <div class="hint">
    <div>
      Opening Axon…
      <div style="margin-top:8px;">
        <a href="https://liveai-email.onrender.com" target="axon">Tap here if nothing opens</a>
      </div>
    </div>
  </div>

  <script>
    const w = 420;
    const h = 620;
    const left = Math.round((screen.width - w) / 2);
    const top = Math.round((screen.height - h) / 2);

    const popup = window.open(
      "https://liveai-email.onrender.com",
      "axon",
      `popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=no`
    );

    if (popup) {
      popup.focus();
      setTimeout(() => {
        window.close();
      }, 300);
    }
  </script>
</body>
</html>
