<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A1 AI — Talk to us</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle, #252525 0%, #000 100%);
      color: #FED100;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      max-width: 360px;
      text-align: center;
    }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.4;
      margin: 0 0 20px;
      color: rgba(254, 209, 0, 0.85);
    }
    .orb-btn {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      border: none;
      border-radius: 50%;
      background: #FED100;
      box-shadow: 0 0 60px rgba(254, 209, 0, 0.75);
      cursor: pointer;
      animation: pulse 1.4s infinite alternate ease-in-out;
    }
    .orb-btn:active { transform: scale(0.97); }
    @keyframes pulse {
      from { box-shadow: 0 0 50px rgba(254, 209, 0, 0.6); transform: scale(1); }
      to   { box-shadow: 0 0 90px rgba(254, 209, 0, 1); transform: scale(1.04); }
    }
    .cta {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 24px;
      background: #FED100;
      color: #111;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .hint {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(254, 209, 0, 0.55);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tap below to talk with our A1 AI team member</h1>
    <button class="orb-btn" id="orb" aria-label="Start conversation"></button>
    <a class="cta" id="link" href="#">Start conversation</a>
    <p class="hint">Allow microphone when asked.<br />You can close the window when done.</p>
  </div>

  <script>
    const APP_BASE = "https://liveai-email.onrender.com";
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src") || "email";
    const APP_URL = `${APP_BASE}/?src=${encodeURIComponent(src)}`;

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || window.innerWidth < 768;

    function openConversation() {
      if (isMobile) {
        window.location.href = APP_URL;
        return;
      }

      const width = 450;
      const height = 680;
      const left = Math.max(0, Math.round((window.screen.width - width) / 2));
      const top = Math.max(0, Math.round((window.screen.height - height) / 2));

      const popup = window.open(
        APP_URL,
        "axon_plate",
        `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no`
      );

      if (!popup) {
        window.location.href = APP_URL;
      }
    }

    document.getElementById("orb").addEventListener("click", openConversation);
    document.getElementById("link").href = APP_URL;
    document.getElementById("link").addEventListener("click", (e) => {
      if (!isMobile) {
        e.preventDefault();
        openConversation();
      }
    });
  </script>
</body>
</html>
