<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axon</title>
  <style>
    :root {
      --bg: #f6f1df;
      --orb1: #ffd54a;
      --orb2: #ffb300;
      --orbGlow: rgba(255, 193, 7, 0.45);
      --text: #2e2a22;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .orb-button {
      width: 132px;
      height: 132px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background:
        radial-gradient(circle at 35% 35%, #fff7bf 0%, var(--orb1) 32%, var(--orb2) 72%, #e19100 100%);
      box-shadow:
        0 0 0 10px rgba(255,255,255,0.45),
        0 0 40px var(--orbGlow),
        0 18px 40px rgba(0,0,0,0.15),
        inset 0 8px 18px rgba(255,255,255,0.55),
        inset 0 -12px 24px rgba(165,100,0,0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .orb-button:hover {
      transform: scale(1.03);
      box-shadow:
        0 0 0 10px rgba(255,255,255,0.45),
        0 0 55px rgba(255, 193, 7, 0.58),
        0 22px 48px rgba(0,0,0,0.18),
        inset 0 8px 18px rgba(255,255,255,0.55),
        inset 0 -12px 24px rgba(165,100,0,0.2);
    }

    .orb-button:active {
      transform: scale(0.98);
    }

    .label {
      font-size: 14px;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .hidden-link {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <button class="orb-button" id="launchOrb" aria-label="Talk to Axon"></button>
    <div class="label">Talk to Axon</div>
    <a
      id="fallbackLink"
      class="hidden-link"
      href="https://liveai-email.onrender.com"
      target="axon"
      rel="noopener"
    >
      Open Axon
    </a>
  </div>

  <script>
    const APP_URL = "https://liveai-email.onrender.com";
    const width = 420;
    const height = 640;
    const left = Math.max(0, Math.round((window.screen.width - width) / 2));
    const top = Math.max(0, Math.round((window.screen.height - height) / 2));

    function openAxon() {
      const popup = window.open(
        APP_URL,
        "axon",
        `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no`
      );

      if (popup) {
        popup.focus();
        setTimeout(() => window.close(), 250);
      } else {
        window.location.href = APP_URL;
      }
    }

    document.getElementById("launchOrb").addEventListener("click", openAxon);

    window.addEventListener("load", () => {
      setTimeout(openAxon, 80);
    });
  </script>
</body>
</html>
