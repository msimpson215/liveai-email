<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title></title>
<style>html,body{margin:0;background:transparent;background-color:transparent;}</style>
<script src="/assets/axon-email-orb.js"></script>
<script>
(function(){
  var p=AxonEmailOrb.openEmailOrb({src:'email'});
  if(p){
    try{window.close()}catch(e){}
    return;
  }
  try{
    window.resizeTo(236,236);
    window.moveTo(Math.round((screen.width-236)/2),Math.round((screen.height-236)/2));
  }catch(e){}
  location.replace(AxonEmailOrb.buildPlateUrl({src:'email'}));
})();
</script>
</head><body></body></html>
