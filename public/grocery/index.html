<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F4ED"/>
  <title>AXON Grocery Shopper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/grocery/app.css"/>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="wordmark">AXON</div>
      <div class="sub">Grocery Shopper</div>
    </div>
    <button class="cart-btn" id="cartBtn" type="button" hidden>
      <span class="cart-label">Cart</span>
      <span class="cart-meta" id="cartMeta">0 items · $0.00</span>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="orb-float" id="orbFloat" aria-hidden="true">
      <div class="orb-bloom"></div>
      <div class="orb-ring"></div>
      <div class="orb" id="heroOrb"></div>
    </div>
    <section class="welcome" id="welcome"></section>

    <p class="reply" id="reply" hidden></p>
    <section class="results" id="results" hidden></section>
    <aside class="cart-panel" id="cartPanel" hidden></aside>
    <section class="checkout" id="checkout" hidden></section>
  </main>

  <form class="composer" id="form">
    <label class="sr-only" for="q">What do you need?</label>
    <input id="q" name="q" autocomplete="off" placeholder="What do you need?" />
    <span class="mic" title="Voice coming soon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#6B7280" stroke-width="1.8"/><path d="M6 11a6 6 0 0012 0" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"/><path d="M12 17v3" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <button type="submit">Send</button>
  </form>

  <p class="attr">Product data provided in part by Open Food Facts.</p>
  <script type="module" src="/grocery/app.js"></script>
</body>
</html>
