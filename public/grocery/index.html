<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F4ED"/>
  <title>AXON Grocery Shopper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/grocery/app.css?v=mock3"/>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="wordmark">AXON</div>
      <div class="sub">Grocery Shopper</div>
    </div>
    <button class="cart-btn" id="cartBtn" type="button" hidden>
      <svg class="cart-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 7h15l-1.4 8.2a2 2 0 01-2 1.7H9.2a2 2 0 01-2-1.6L5.2 4H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="20" r="1.3" fill="currentColor"/>
        <circle cx="17" cy="20" r="1.3" fill="currentColor"/>
      </svg>
      <span class="cart-copy">
        <span class="cart-label" id="cartCountLabel">0 items</span>
        <span class="cart-meta" id="cartMeta">$0.00</span>
      </span>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="orb-float" id="orbFloat">
      <div class="orb-bloom"></div>
      <div class="orb-ring"></div>
      <button class="orb" id="heroOrb" type="button" aria-label="Ask Axon what you need"></button>
    </div>
    <section class="welcome" id="welcome">
      <p class="ask">What do you need?</p>
      <div class="chips" id="chips">
        <button type="button" data-say="Apples">Apples</button>
        <button type="button" data-say="Bananas">Bananas</button>
        <button type="button" data-say="Milk">Milk</button>
        <button type="button" data-say="sharp cheddar cheese">Cheese</button>
      </div>
      <section class="mailer" id="mailer">
        <div class="mailer-head">
          <span class="mailer-kicker">This week</span>
          <h2>Sunday specials</h2>
        </div>
        <div class="mailer-row" id="specials"></div>
      </section>
    </section>

    <div class="talk" id="talk" hidden>
      <div class="bubble me" id="said"></div>
      <p class="bubble axon" id="reply"></p>
    </div>
    <section class="results" id="results" hidden></section>
    <aside class="cart-panel" id="cartPanel" hidden></aside>
    <section class="checkout" id="checkout" hidden></section>
  </main>
  <div class="veil" id="veil" hidden></div>

  <form class="composer" id="form">
    <label class="sr-only" for="q">What do you need?</label>
    <div class="field">
      <input id="q" name="q" autocomplete="off" placeholder="Type your grocery request..." />
      <span class="mic" title="Voice coming soon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#3b82f6" stroke-width="1.8"/><path d="M6 11a6 6 0 0012 0" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/><path d="M12 17v3" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
    </div>
    <button type="submit">Send</button>
  </form>

  <p class="attr">Product data provided in part by Open Food Facts.</p>
  <script type="module" src="/grocery/app.js?v=mock3"></script>
</body>
</html>
