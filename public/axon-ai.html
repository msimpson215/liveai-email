<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060f">
<meta name="description" content="Axon AI — a talking team member for a website that already exists.">
<title>Axon AI</title>
<link rel="icon" href="/icons/axon-blue-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#02060f;color:#d7e6ff}
  body{
    font-family:"Avenir Next","Century Gothic",Futura,system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .sky{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 48%, rgba(18,64,160,.28) 0%, transparent 62%),
      radial-gradient(circle at 50% 100%, rgba(8,24,70,.5) 0%, transparent 46%),
      #02060f;
  }
  .mark{
    position:fixed;top:max(28px,env(safe-area-inset-top));left:0;right:0;
    text-align:center;z-index:3;
    font-size:11px;font-weight:600;letter-spacing:.42em;color:rgba(186,210,255,.55);
  }
  .stage{
    position:fixed;inset:0;
    display:grid;place-items:center;
  }
  .orb-wrap{position:relative;display:grid;place-items:center}
  .halo{
    position:absolute;width:min(90vw,620px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(80,160,255,.28) 0%,rgba(30,90,220,.10) 38%,transparent 68%);
    pointer-events:none;
    animation:breathe 6.5s ease-in-out infinite;
  }
  #orb{
    appearance:none;border:0;padding:0;cursor:pointer;position:relative;z-index:2;
    width:min(46vw,280px);aspect-ratio:1;border-radius:50%;background:transparent;
  }
  .sphere{
    display:block;width:100%;height:100%;border-radius:50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.92) 0 4%, transparent 18%),
      radial-gradient(circle at 68% 72%, rgba(6,18,60,.55) 0%, transparent 42%),
      radial-gradient(circle at 50% 44%, #9fd4ff 0%, #3b82f6 36%, #1d4ed8 62%, #07163f 100%);
    box-shadow:
      0 0 48px 8px rgba(59,130,246,.45),
      0 0 140px 28px rgba(29,78,216,.28),
      inset 0 -28px 48px rgba(2,8,30,.55),
      inset 0 18px 36px rgba(255,255,255,.22);
    transition:transform .2s ease, box-shadow .3s ease;
  }
  #orb:active .sphere{transform:scale(.97)}
  .sphere::before,.sphere::after{
    content:"";position:absolute;inset:-10px;border-radius:50%;
    border:1px solid rgba(147,197,253,.0);pointer-events:none;
  }
  .sphere{position:relative}
  body[data-state="connecting"] .sphere{animation:pulse .9s ease-in-out infinite}
  body[data-state="speaking"] .sphere{
    box-shadow:
      0 0 70px 16px rgba(96,165,250,.7),
      0 0 180px 40px rgba(37,99,235,.38),
      inset 0 -28px 48px rgba(2,8,30,.45),
      inset 0 18px 36px rgba(255,255,255,.28);
  }
  body[data-state="speaking"] .sphere::before,
  body[data-state="speaking"] .sphere::after,
  body[data-state="listening"] .sphere::before{
    border-color:rgba(147,197,253,.45);
    animation:ripple 2.8s ease-out infinite;
  }
  body[data-state="speaking"] .sphere::after{animation-delay:1.4s}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
  @keyframes pulse{50%{filter:brightness(1.12);transform:scale(1.03)}}
  @keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.28);opacity:0}}

  .whisper{
    position:fixed;left:0;right:0;top:calc(50% + min(26vw,160px));
    text-align:center;font-size:13px;letter-spacing:.12em;
    color:rgba(186,210,255,.38);min-height:1.4em;z-index:3;
    transition:opacity .6s ease;
  }
  body[data-state="speaking"] .whisper,
  body[data-state="listening"] .whisper{opacity:0}

  /* Text panel — grows out of the orb */
  .text{
    position:fixed;z-index:4;display:flex;flex-direction:column;gap:10px;
    width:min(34vw,340px);max-height:min(58vh,420px);
    left:max(24px,calc(50% - min(23vw,140px) - 360px));
    top:50%;transform:translateY(-50%) scale(.86);transform-origin:right center;
    opacity:0;pointer-events:none;
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  }
  body.show-text .text{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
  .log{
    flex:1;min-height:120px;overflow:auto;
    background:rgba(6,14,36,.55);border:1px solid rgba(147,197,253,.18);
    border-radius:16px;padding:14px 14px 10px;
    font-size:14px;line-height:1.45;color:#cfe0ff;
    backdrop-filter:blur(12px);
  }
  .log .you{color:#8fb4ff;margin:0 0 8px}
  .log .ai{color:#e8f1ff;margin:0 0 8px}
  .compose{display:flex;gap:8px}
  .compose input{
    flex:1;min-width:0;border:1px solid rgba(147,197,253,.28);
    background:rgba(6,14,36,.7);color:#e8f1ff;border-radius:999px;
    padding:12px 16px;font:500 14px/1.3 inherit;outline:none;
  }
  .compose input::placeholder{color:rgba(186,210,255,.4)}
  .compose button{
    border:0;border-radius:999px;background:#3b82f6;color:#fff;
    font:700 13px/1 inherit;padding:0 16px;cursor:pointer;
  }

  /* Files — from the right */
  .files{
    position:fixed;z-index:4;right:0;top:0;bottom:0;width:min(86vw,340px);
    background:linear-gradient(180deg,rgba(6,14,40,.92),rgba(4,10,28,.96));
    border-left:1px solid rgba(147,197,253,.16);
    padding:88px 28px 32px;transform:translateX(100%);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;gap:14px;
  }
  body.show-files .files{transform:none}
  .files h2{font-size:13px;font-weight:600;letter-spacing:.22em;color:rgba(186,210,255,.7)}
  .drop{
    border:1px dashed rgba(147,197,253,.35);border-radius:16px;padding:28px 18px;
    text-align:center;cursor:pointer;color:rgba(186,210,255,.7);font-size:14px;line-height:1.5;
  }
  .drop:hover,.drop.over{border-color:#60a5fa;color:#dbeafe;background:rgba(37,99,235,.12)}
  .docs{list-style:none;font-size:13px;color:#9fb6e0;display:flex;flex-direction:column;gap:8px}
  .docs li{padding:8px 0;border-bottom:1px solid rgba(147,197,253,.1)}
  .files .note{margin-top:auto;font-size:12px;line-height:1.5;color:rgba(186,210,255,.38)}

  .dots{
    position:fixed;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:22px;z-index:5;
  }
  .dot{
    appearance:none;width:13px;height:13px;border-radius:50%;padding:0;
    border:1px solid rgba(186,210,255,.7);background:rgba(147,197,253,.12);cursor:pointer;
    position:relative;
  }
  .dot.on{background:#93c5fd;border-color:#93c5fd;box-shadow:0 0 12px rgba(147,197,253,.8)}
  .dot span{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(186,210,255,.0);white-space:nowrap;pointer-events:none;
    transition:color .2s ease;
  }
  .dot:hover span,.dot:focus-visible span{color:rgba(186,210,255,.75)}
  .dot.wait{opacity:.35;cursor:default}

  #file{display:none}

  @media (max-width:860px){
    .text{
      left:16px;right:16px;width:auto;top:auto;bottom:84px;
      transform:translateY(12px) scale(.96);transform-origin:center bottom;
      max-height:38vh;
    }
    body.show-text .text{transform:none}
    .whisper{top:auto;bottom:72px}
  }
</style>
</head>
<body data-state="idle">
  <div class="sky" aria-hidden="true"></div>
  <div class="mark">AXON AI</div>

  <div class="stage">
    <div class="orb-wrap">
      <div class="halo" aria-hidden="true"></div>
      <button type="button" id="orb" aria-label="Talk with Axon AI"><span class="sphere"></span></button>
    </div>
  </div>
  <p class="whisper" id="hint">Tap</p>

  <aside class="text" id="textPane" aria-label="Text with Axon">
    <div class="log" id="log"></div>
    <form class="compose" id="textForm">
      <input id="q" type="text" autocomplete="off" placeholder="Type instead" enterkeyhint="send" aria-label="Type a question">
      <button type="submit">Send</button>
    </form>
  </aside>

  <aside class="files" id="filesPane" aria-label="Upload files">
    <h2>Upload files</h2>
    <div class="drop" id="drop">Drop a file here, or click to choose.<br>PDF, Word, or text.</div>
    <ul class="docs" id="docs"></ul>
    <p class="note">Axon reads what you give it, then you can talk or type about it.</p>
  </aside>

  <nav class="dots" aria-label="More">
    <button type="button" class="dot" id="textDot" aria-label="Text"><span>Text</span></button>
    <button type="button" class="dot" id="fileDot" aria-label="Files"><span>Files</span></button>
    <button type="button" class="dot wait" id="soonDot" aria-label="Coming" tabindex="-1"><span></span></button>
  </nav>

  <input id="file" type="file" accept=".pdf,.doc,.docx,.txt,.md,.csv,application/pdf,text/plain">

<script src="/axon-voice.js"></script>
<script>
const orb=document.getElementById('orb');
const hint=document.getElementById('hint');
const logEl=document.getElementById('log');
const docsEl=document.getElementById('docs');
const drop=document.getElementById('drop');
const fileInput=document.getElementById('file');
const textDot=document.getElementById('textDot');
const fileDot=document.getElementById('fileDot');

let pc=null,localStream=null,starting=false,audioEl=null,voice=null,dc=null;
let greeted=false,textOffered=false,curAI=null;

function setState(s,msg){
  document.body.dataset.state=s||'idle';
  if(msg!==undefined)hint.textContent=msg;
}
function ensureAudio(){
  if(!audioEl){
    audioEl=document.createElement('audio');
    audioEl.autoplay=true;audioEl.playsInline=true;
    document.body.appendChild(audioEl);
  }
  return audioEl;
}
function line(role,text){
  const d=document.createElement('div');
  d.className=role;
  d.textContent=(role==='you'?'You: ':'Axon: ')+text;
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
  return d;
}
function showText(){
  document.body.classList.add('show-text');
  textDot.classList.add('on');
  setTimeout(function(){try{document.getElementById('q').focus()}catch(e){}},400);
}
function toggleText(){
  const on=!document.body.classList.contains('show-text');
  document.body.classList.toggle('show-text',on);
  textDot.classList.toggle('on',on);
  if(on)setTimeout(function(){try{document.getElementById('q').focus()}catch(e){}},200);
}
function toggleFiles(){
  const on=!document.body.classList.contains('show-files');
  document.body.classList.toggle('show-files',on);
  fileDot.classList.toggle('on',on);
}

async function stopVoice(){
  if(voice){voice.detach();voice=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  dc=null;starting=false;
  setState('idle','Tap');
}

let reconnecting=false,reconnectTries=0;
async function handleLost(){
  if(reconnecting)return;
  reconnecting=true;
  try{if(voice){voice.detach();voice=null}}catch(e){}
  try{if(pc)pc.close()}catch(e){}
  pc=null;dc=null;
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  const wait=Math.min(8000,600*Math.pow(2,reconnectTries++));
  setTimeout(async function(){
    try{await connectVoice();reconnectTries=0;}
    catch(e){if(reconnectTries<5)handleLost();}
    finally{reconnecting=false;}
  },wait);
}

async function connectVoice(){
  const r=await fetch('/session?gate=1&src=axonai',{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error){
    const err=new Error(data.error||'session');
    err.status=r.status;throw err;
  }
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');

  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  let remoteStream=null;
  pc.ontrack=function(e){
    remoteStream=e.streams[0];
    if(audio.srcObject!==e.streams[0]){
      audio.srcObject=e.streams[0];
      audio.play().catch(function(){});
    }
  };
  localStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
  });
  const micTrack=localStream.getAudioTracks()[0];
  micTrack.enabled=false;
  pc.addTrack(micTrack);

  dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){
    if(AxonVoice.hasHistory())return;
    try{dc.send(JSON.stringify({type:'response.create'}))}catch(e){}
  });
  dc.addEventListener('message',function(ev){
    try{
      const m=JSON.parse(ev.data);
      if(m.type==='response.created'){
        setState('speaking');
        if(!textOffered){
          textOffered=true;
          setTimeout(showText,6500);
        }
      }
      if(m.type==='response.done')setState('listening');
      if(m.type==='response.output_audio_transcript.delta'&&m.delta){
        if(!curAI){curAI=line('ai','');curAI._raw='';}
        curAI._raw=(curAI._raw||'')+m.delta;
        curAI.textContent='Axon: '+curAI._raw;
        logEl.scrollTop=logEl.scrollHeight;
      }
      if(m.type==='response.output_audio_transcript.done'||m.type==='response.audio_transcript.done'){
        if(m.transcript){
          if(!curAI)curAI=line('ai','');
          curAI._raw=m.transcript;
          curAI.textContent='Axon: '+m.transcript;
        }
        curAI=null;
      }
    }catch(e){}
  });

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  voice=AxonVoice.attach({
    dc:dc,micTrack:micTrack,localStream:localStream,remoteStream:remoteStream,
    voice:data.voice,pc:pc,onLost:handleLost
  });
  setState('listening');
}

async function toggle(){
  if(starting)return;
  if(pc){await stopVoice();return;}
  starting=true;
  setState('connecting','…');
  try{await connectVoice();}
  catch(e){
    await stopVoice();
    setState('idle',e.status===429?'Busy — tap again':'Tap');
  }
  starting=false;
}

function sendText(text){
  text=String(text||'').trim();
  if(!text)return;
  line('you',text);
  document.getElementById('q').value='';
  if(dc&&dc.readyState==='open'){
    try{
      dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:text}]}}));
      dc.send(JSON.stringify({type:'response.create'}));
    }catch(e){}
  }else{
    toggle().then(function(){
      const wait=setInterval(function(){
        if(dc&&dc.readyState==='open'){
          clearInterval(wait);
          try{
            dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:text}]}}));
            dc.send(JSON.stringify({type:'response.create'}));
          }catch(e){}
        }
      },200);
      setTimeout(function(){clearInterval(wait)},8000);
    });
  }
}

async function readFile(file){
  if(!file)return;
  drop.textContent='Reading '+file.name+'…';
  const body=new FormData();
  body.append('file',file);
  try{
    const r=await fetch('/api/axon-ai/read',{method:'POST',body:body});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'upload failed');
    const li=document.createElement('li');
    li.textContent=d.name;
    docsEl.appendChild(li);
    drop.textContent='Drop another file, or click to choose.';
    const note='The visitor uploaded "'+d.name+'". Use only this text. If asked about the file, work from it. Contents:\n'+d.text;
    if(dc&&dc.readyState==='open'){
      dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:note}]}}));
      dc.send(JSON.stringify({type:'response.create',response:{instructions:'A file was just uploaded. Acknowledge it in one or two sentences and offer to talk from it. Do not read it aloud.'}}));
    }else{
      line('ai','I have '+d.name+'. Tap the orb and we can talk through it.');
    }
  }catch(e){
    drop.textContent=e.message||'Could not read that file.';
  }
  fileInput.value='';
}

orb.addEventListener('click',toggle);
textDot.addEventListener('click',toggleText);
fileDot.addEventListener('click',toggleFiles);
drop.addEventListener('click',function(){fileInput.click()});
fileInput.addEventListener('change',function(){readFile(fileInput.files[0])});
;['dragenter','dragover'].forEach(function(ev){
  drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')});
});
;['dragleave','drop'].forEach(function(ev){
  drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')});
});
drop.addEventListener('drop',function(e){
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f)readFile(f);
});
document.getElementById('textForm').addEventListener('submit',function(e){
  e.preventDefault();
  sendText(document.getElementById('q').value);
});
window.addEventListener('pagehide',function(){if(pc||starting)stopVoice()});
</script>
</body>
</html>
