<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Axon AI — a talking team member for a website that already exists.">
<title>Axon AI</title>
<link rel="icon" href="/icons/axon-blue-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#fff;color:#0f1b33}
  body{
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .mark{
    position:fixed;top:max(30px,env(safe-area-inset-top));left:0;right:0;
    text-align:center;z-index:3;
    font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:.08em;color:#0f1b33;
  }
  .stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-bottom:40px;
  }
  #orb{
    appearance:none;border:0;padding:0;cursor:pointer;background:transparent;
    width:min(72vw,52vh,440px);aspect-ratio:1;border-radius:50%;
    -webkit-tap-highlight-color:transparent;
  }
  #orb{position:relative;transform:scale(calc(1 + var(--lvl,0) * .05));transition:transform .08s linear}
  #orb .halo{
    position:absolute;inset:-18%;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(50,120,255,.55) 0,rgba(50,120,255,.2) 42%,transparent 68%);
    opacity:calc(.18 + var(--lvl,0) * 1.4);transform:scale(calc(.9 + var(--lvl,0) * .3));
    transition:opacity .08s linear,transform .08s linear;
  }
  #orb .ring{
    position:absolute;inset:-5%;border-radius:50%;pointer-events:none;z-index:0;opacity:0;
    background:conic-gradient(from 0deg,transparent 0 62%,rgba(120,180,255,.9) 82%,transparent 100%);
    -webkit-mask:radial-gradient(circle,transparent 64%,#000 65.5%,#000 68%,transparent 69.5%);
    mask:radial-gradient(circle,transparent 64%,#000 65.5%,#000 68%,transparent 69.5%);
    animation:spin 2.6s linear infinite;transition:opacity .5s ease;
  }
  body.live[data-state="listening"] #orb .ring{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  #orb img{
    position:relative;z-index:1;
    display:block;width:100%;height:100%;
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 64%,transparent 71%);mask-image:radial-gradient(circle at 50% 50%,#000 64%,transparent 71%);
    transition:transform .2s ease, filter .3s ease;
    animation:breathe 5s ease-in-out infinite;
  }
  #orb:active img{transform:scale(.97)}
  body[data-state="connecting"] #orb img{animation:pulse .9s ease-in-out infinite}
  body[data-state="speaking"] #orb img{filter:brightness(calc(1.04 + var(--lvl,0) * .3)) saturate(calc(1.05 + var(--lvl,0) * .3))}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .under{margin-top:20px;min-height:40px;display:flex;align-items:center;justify-content:center}
  .hint{font-size:15px;font-weight:500;color:#3a4660;text-align:center}
  .hint:empty{display:none}
  .pause{
    display:none;appearance:none;cursor:pointer;
    border:1.5px solid #0f1b33;background:transparent;color:#0f1b33;border-radius:999px;
    padding:8px 22px;font:700 13px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
    transition:background .2s ease,color .2s ease;
  }
  .pause:hover{background:#0f1b33;color:#fff}
  body.live .pause,body.paused .pause{display:inline-block}
  body.live .hint,body.paused .hint{display:none}

  /* Text panel — grows out of the orb */
  .text{
    position:fixed;z-index:4;display:flex;flex-direction:column;gap:10px;
    width:min(30vw,340px);max-height:min(58vh,440px);
    left:max(24px,calc(50% - min(36vw,26vh,220px) - min(30vw,340px) - 40px));
    top:50%;transform:translateY(-50%) scale(.86);transform-origin:right center;
    opacity:0;pointer-events:none;
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  }
  body.show-text .text{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
  .log{
    flex:1;min-height:120px;overflow:auto;
    background:#fff;border:1px solid #e3e1dc;border-radius:16px;padding:14px 14px 10px;
    font-size:14px;line-height:1.45;color:#0f1b33;
    box-shadow:0 10px 30px rgba(15,27,51,.08);
  }
  .log .you{color:#1d4ed8;margin:0 0 8px}
  .log .ai{color:#0f1b33;margin:0 0 8px}
  .compose{display:flex;gap:8px}
  .compose input{
    flex:1;min-width:0;border:1px solid #dcd9d3;background:#fff;color:#0f1b33;border-radius:999px;
    padding:12px 16px;font:500 14px/1.3 inherit;outline:none;
  }
  .compose input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .compose input::placeholder{color:#9aa2b1}
  .compose button{
    border:0;border-radius:999px;background:#1d4ed8;color:#fff;
    font:700 13px/1 inherit;padding:0 18px;cursor:pointer;
  }

  /* Files — grows out of the orb on the right */
  .files{
    position:fixed;z-index:4;width:min(30vw,340px);max-height:min(58vh,440px);overflow:auto;
    right:max(24px,calc(50% - min(36vw,26vh,220px) - min(30vw,340px) - 40px));
    top:50%;transform:translateY(-50%) scale(.86);transform-origin:left center;
    opacity:0;pointer-events:none;
    background:#fff;border:1px solid #e3e1dc;border-radius:16px;box-shadow:0 10px 30px rgba(15,27,51,.08);
    padding:22px 22px 18px;
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;gap:14px;
  }
  body.show-files .files{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
  .files h2{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#0f1b33}
  .drop{
    border:1.5px dashed #c9cfdb;border-radius:16px;padding:28px 18px;
    text-align:center;cursor:pointer;color:#3a4660;font-size:14px;line-height:1.5;
  }
  .drop:hover,.drop.over{border-color:#2563eb;color:#1d4ed8;background:rgba(37,99,235,.05)}
  .docs{list-style:none;font-size:13px;color:#3a4660;display:flex;flex-direction:column;gap:8px}
  .docs li{padding:8px 0;border-bottom:1px solid #eeece8}
  .files .note{margin-top:auto;font-size:12px;line-height:1.5;color:#8a93a3}

  .dots{
    position:fixed;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:22px;z-index:5;
  }
  .dot{
    appearance:none;width:13px;height:13px;border-radius:50%;padding:0;
    border:1.5px solid #0f1b33;background:transparent;cursor:pointer;position:relative;
  }
  .dot.on{background:#1d4ed8;border-color:#1d4ed8}
  .dot span{
    position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:transparent;white-space:nowrap;pointer-events:none;transition:color .2s ease;
  }
  .dot:hover span,.dot:focus-visible span{color:#3a4660}
  .dot.wait{opacity:.3;cursor:default}

  #file{display:none}

  .intro{
    position:fixed;inset:0;z-index:10;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    transition:opacity .7s ease;
  }
  .intro img{width:min(100vw,1100px,calc((100vh - 150px) * 1.78));display:block;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 90%,transparent);
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .intro button{
    appearance:none;border:0;cursor:pointer;border-radius:999px;
    background:#1452ff;color:#fff;font:700 17px/1 inherit;letter-spacing:.04em;
    padding:18px 44px;box-shadow:0 12px 34px rgba(20,82,255,.35),0 0 0 6px rgba(20,82,255,.08);
    animation:glow 2.6s ease-in-out infinite;
  }
  .intro small{font-size:13px;color:#6b7590;margin-top:6px}
  @keyframes glow{50%{box-shadow:0 12px 40px rgba(20,82,255,.5),0 0 0 12px rgba(20,82,255,.06)}}
  body.started .intro{opacity:0;pointer-events:none}
  body:not(.started) .mark,body:not(.started) .dots{visibility:hidden}

  @media (max-width:860px){
    .text{
      left:16px;right:16px;width:auto;top:auto;bottom:70px;
      transform:translateY(12px) scale(.96);transform-origin:center bottom;
      max-height:38vh;
    }
    body.show-text .text{transform:none}
    .files{
      left:16px;right:16px;width:auto;top:auto;bottom:70px;
      transform:translateY(12px) scale(.96);transform-origin:center bottom;max-height:38vh;
    }
    body.show-files .files{transform:none}
  }
</style>
</head>
<body data-state="idle">
  <div class="intro" id="intro">
    <img src="/sites/assets/axon-logo-orb.jpg" alt="Axon AI">
    <button type="button" id="hello">Say hello</button>
    <small>Sound on. Talk, type, or upload a file.</small>
  </div>
  <div class="mark">AXON AI</div>

  <div class="stage">
    <button type="button" id="orb" aria-label="Tap the orb to talk with Axon AI"><span class="halo"></span><span class="ring"></span><img src="/art/axon-orb.png" alt="" width="655" height="655"></button>
    <div class="under">
      <p class="hint" id="hint"></p>
      <button type="button" class="pause" id="pauseBtn">Pause</button>
    </div>
  </div>

  <aside class="text" id="textPane" aria-label="Text with Axon">
    <div class="log" id="log"></div>
    <form class="compose" id="textForm">
      <input id="q" type="text" autocomplete="off" placeholder="Type instead" enterkeyhint="send" aria-label="Type a question">
      <button type="submit">Send</button>
    </form>
  </aside>

  <aside class="files" id="filesPane" aria-label="Upload files">
    <h2>Upload files</h2>
    <div class="drop" id="drop">Drop a file here, or click to choose.<br>PDF, Word, or text.</div>
    <ul class="docs" id="docs"></ul>
    <p class="note">Axon reads what you give it, then you can talk or type about it.</p>
  </aside>

  <nav class="dots" aria-label="More">
    <button type="button" class="dot" id="textDot" aria-label="Text"><span>Text</span></button>
    <button type="button" class="dot" id="fileDot" aria-label="Files"><span>Files</span></button>
  </nav>

  <input id="file" type="file" accept=".pdf,.doc,.docx,.txt,.md,.csv,application/pdf,text/plain">

<script>
const orb=document.getElementById('orb');
const hint=document.getElementById('hint');
const pauseBtn=document.getElementById('pauseBtn');
const logEl=document.getElementById('log');
const docsEl=document.getElementById('docs');
const drop=document.getElementById('drop');
const fileInput=document.getElementById('file');
const textDot=document.getElementById('textDot');
const fileDot=document.getElementById('fileDot');

let pc=null,dc=null,localStream=null,audioEl=null;
let starting=false,ready=false,closing=false,audioBlocked=false,textOffered=false;
let curAI=null,curYou=null,aiQuiet=0,youQuiet=0;
let history=[],docsText='',greet=null;

function setState(s,msg){
  document.body.dataset.state=s||'idle';
  if(msg!==undefined)hint.textContent=msg;
}
function setLive(on){
  document.body.classList.toggle('live',on);
  if(on)document.body.classList.remove('paused');
  pauseBtn.textContent=on?'Pause':'Resume';
}
function ensureAudio(){
  if(!audioEl){
    audioEl=document.createElement('audio');
    audioEl.autoplay=true;audioEl.playsInline=true;
    document.body.appendChild(audioEl);
  }
  return audioEl;
}
let lvlCtx=null,lvlRaf=0;
function startLevel(stream){
  try{
    if(!lvlCtx)lvlCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(lvlCtx.resume)lvlCtx.resume();
    const an=lvlCtx.createAnalyser();
    an.fftSize=512;
    lvlCtx.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.fftSize);
    let smooth=0;
    cancelAnimationFrame(lvlRaf);
    (function tick(){
      an.getByteTimeDomainData(buf);
      let sum=0;
      for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
      const target=Math.min(1,Math.sqrt(sum/buf.length)*4.5);
      smooth+=(target-smooth)*(target>smooth?.45:.1);
      orb.style.setProperty('--lvl',smooth.toFixed(3));
      lvlRaf=requestAnimationFrame(tick);
    })();
  }catch(e){}
}
function stopLevel(){
  cancelAnimationFrame(lvlRaf);
  orb.style.setProperty('--lvl','0');
}
function line(role,text){
  const d=document.createElement('div');
  d.className=role;
  d._raw=text;
  d.textContent=(role==='you'?'You: ':'Axon: ')+text;
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
  return d;
}
function remember(role,text){
  text=String(text||'').trim();
  if(!text)return;
  history.push({role:role,text:text});
  if(history.length>40)history=history.slice(-40);
}
function showText(){
  if(innerWidth<=860){document.body.classList.remove('show-files');fileDot.classList.remove('on');}
  document.body.classList.add('show-text');
  textDot.classList.add('on');
  setTimeout(function(){try{document.getElementById('q').focus()}catch(e){}},400);
}
function toggleText(){
  const on=!document.body.classList.contains('show-text');
  document.body.classList.toggle('show-text',on);
  textDot.classList.toggle('on',on);
  if(on)setTimeout(function(){try{document.getElementById('q').focus()}catch(e){}},200);
}
function toggleFiles(){
  const on=!document.body.classList.contains('show-files');
  if(on&&innerWidth<=860){document.body.classList.remove('show-text');textDot.classList.remove('on');}
  document.body.classList.toggle('show-files',on);
  fileDot.classList.toggle('on',on);
}

function send(ev){
  if(!dc||dc.readyState!=='open'||!ready)return false;
  try{dc.send(JSON.stringify(ev));return true}catch(e){return false}
}
function endAI(){
  clearTimeout(aiQuiet);
  if(curAI){remember('assistant',curAI._raw);curAI=null}
}
function endYou(){
  clearTimeout(youQuiet);
  if(curYou){remember('user',curYou._raw);curYou=null}
}

function onEvent(m){
  if(m.type==='session.started'){
    ready=true;
    setLive(true);
    setState('listening');
    if(greet){send({type:'session.commentary.append',event_id:'greeting_1',delegation_id:null,content:greet});greet=null}
    armFive();
    if(!textOffered){textOffered=true;setTimeout(showText,6500)}
    return;
  }
  if(m.type==='session.output_transcript.delta'&&m.delta){
    endYou();
    if(!curAI)curAI=line('ai','');
    curAI._raw+=m.delta;
    curAI.textContent='Axon: '+curAI._raw;
    logEl.scrollTop=logEl.scrollHeight;
    setState('speaking');
    clearTimeout(aiQuiet);
    aiQuiet=setTimeout(function(){endAI();if(pc)setState('listening')},1200);
    return;
  }
  if(m.type==='session.input_transcript.delta'&&m.delta){
    endAI();
    if(!curYou)curYou=line('you','');
    curYou._raw+=m.delta;
    curYou.textContent='You: '+curYou._raw;
    logEl.scrollTop=logEl.scrollHeight;
    setState('listening');
    clearTimeout(youQuiet);
    youQuiet=setTimeout(endYou,1500);
    return;
  }
  if(m.type==='session.closed'){teardown();return}
  if(m.type==='error')console.warn('Axon voice:',m.error&&m.error.message);
}

let fiveTimer=0,fiveDone=false;
function armFive(){
  if(fiveTimer||fiveDone)return;
  fiveTimer=setTimeout(endFive,30*1000);
}
function endFive(){
  if(fiveDone)return;
  fiveDone=true;
  clearTimeout(fiveTimer);
  showText();
  send({type:'session.input_audio.mute',event_id:'five_mute'});
  if(localStream){try{localStream.getAudioTracks().forEach(function(t){t.enabled=false})}catch(e){}}
  send({type:'session.instructions.append',event_id:'five_up',delegation_id:null,
    content:"The time is up. Right now, say this once, warmly, then stop. Do not ask a question and do not add a pitch: We're going to switch you to text now. Please feel free to use it to keep asking questions."});
  setTimeout(function(){stopVoice()},9000);
}

function teardown(){
  clearTimeout(fiveTimer);fiveTimer=0;
  endAI();endYou();
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  if(audioEl){try{audioEl.pause();audioEl.srcObject=null}catch(e){}}
  dc=null;ready=false;closing=false;audioBlocked=false;
  stopLevel();
  setLive(false);
  setState('idle',fiveDone?'Switched to text':undefined);
}
function stopVoice(){
  if(!pc)return;
  if(audioEl){try{audioEl.pause();audioEl.srcObject=null}catch(e){}}
  if(localStream){try{localStream.getAudioTracks().forEach(function(t){t.enabled=false})}catch(e){}}
  stopLevel();
  setLive(false);
  if(closing)return;
  closing=true;
  if(!send({type:'session.close',event_id:'close_1'})){teardown();return}
  setTimeout(function(){if(closing)teardown()},2500);
}

function waitForIce(conn){
  if(conn.iceGatheringState==='complete')return Promise.resolve();
  return new Promise(function(resolve){
    const t=setTimeout(done,4000);
    function done(){clearTimeout(t);conn.removeEventListener('icegatheringstatechange',check);resolve()}
    function check(){if(conn.iceGatheringState==='complete')done()}
    conn.addEventListener('icegatheringstatechange',check);
  });
}

async function connectVoice(){
  const conn=new RTCPeerConnection();
  pc=conn;
  const audio=ensureAudio();
  conn.ontrack=function(e){
    const stream=e.streams[0]||new MediaStream([e.track]);
    audio.srcObject=stream;
    audio.play().then(function(){audioBlocked=false}).catch(function(){
      audioBlocked=true;
      setState('idle','Tap the orb to hear Axon');
    });
    startLevel(stream);
  };
  conn.addEventListener('connectionstatechange',function(){
    if(pc!==conn)return;
    if(conn.connectionState==='failed'||(conn.connectionState==='disconnected'&&!closing)){
      teardown();
      if(!fiveDone)setState('idle','The line dropped. Tap the orb to keep talking.');
    }
  });
  localStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
  });
  if(pc!==conn){localStream.getTracks().forEach(function(t){t.stop()});localStream=null;return}
  localStream.getAudioTracks().forEach(function(t){conn.addTrack(t,localStream)});

  dc=conn.createDataChannel('oai-events');
  dc.addEventListener('message',function(ev){
    try{onEvent(JSON.parse(ev.data))}catch(e){}
  });
  dc.addEventListener('close',function(){if(pc===conn&&!fiveDone)teardown()});

  const offer=await conn.createOffer();
  await conn.setLocalDescription(offer);
  await waitForIce(conn);
  const r=await fetch('/api/axon-ai/live',{
    method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sdp:conn.localDescription.sdp,history:history.slice(-12)})
  });
  if(!r.ok){const err=new Error('session');err.status=r.status;throw err}
  const data=await r.json();
  if(pc!==conn)return;
  greet=data.greet||null;
  await conn.setRemoteDescription({type:'answer',sdp:data.transport.sdp});
  await new Promise(function(resolve,reject){
    let waited=0;
    const t=setInterval(function(){
      waited+=100;
      if(ready||pc!==conn){clearInterval(t);resolve()}
      else if(waited>=15000){clearInterval(t);reject(new Error('timeout'))}
    },100);
  });
}

async function toggle(){
  if(starting)return;
  if(pc&&audioBlocked){
    audioEl.play().then(function(){audioBlocked=false;setState('listening','')}).catch(function(){});
    return;
  }
  if(pc){stopVoice();document.body.classList.add('paused');return}
  if(fiveDone){showText();return}
  starting=true;
  setState('connecting','');
  try{await connectVoice()}
  catch(e){
    const wasPaused=document.body.classList.contains('paused');
    teardown();
    if(wasPaused)document.body.classList.add('paused');
    setState('idle',e.status===429?'Busy right now. Tap the orb to try again.':'Tap the orb to talk with Axon');
  }
  starting=false;
}

let typing=false;
async function sendText(text){
  text=String(text||'').trim();
  if(!text||typing)return;
  typing=true;
  endAI();endYou();
  line('you',text);
  remember('user',text);
  document.getElementById('q').value='';
  const wait=line('ai','…');
  try{
    const r=await fetch('/api/axon-ai/text',{
      method:'POST',cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history.slice(-20),docs:docsText})
    });
    const d=await r.json().catch(function(){return{}});
    const reply=d.reply||d.error||'No answer just now. Try again.';
    wait._raw=reply;
    wait.textContent='Axon: '+reply;
    logEl.scrollTop=logEl.scrollHeight;
    if(d.reply){
      remember('assistant',d.reply);
      send({type:'session.thinking.append',event_id:'typed_'+Date.now(),delegation_id:null,
        content:('The visitor typed: "'+text+'". It was answered in the text box: "'+d.reply+'". Do not read it aloud. If they talk about it, you already know.').slice(0,1800)});
    }
  }catch(e){
    wait.textContent='Axon: No answer just now. Try again.';
  }
  typing=false;
}

async function readFile(file){
  if(!file)return;
  drop.textContent='Reading '+file.name+'…';
  const body=new FormData();
  body.append('file',file);
  try{
    const r=await fetch('/api/axon-ai/read',{method:'POST',body:body});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'upload failed');
    const li=document.createElement('li');
    li.textContent=d.name;
    docsEl.appendChild(li);
    drop.textContent='Drop another file, or click to choose.';
    docsText=(docsText+'\n\n--- '+d.name+' ---\n'+d.text).slice(-24000);
    const spoken=send({type:'session.thinking.append',event_id:'file_'+Date.now(),delegation_id:null,
      content:('The visitor uploaded "'+d.name+'". The start of it reads: '+d.text).slice(0,1800)});
    if(spoken){
      send({type:'session.commentary.append',event_id:'filesay_'+Date.now(),delegation_id:null,
        content:'A file named "'+d.name+'" was just uploaded. Acknowledge it in one sentence and offer to talk about it. Do not read it aloud.'});
    }else{
      line('ai','I have '+d.name+'. Ask me about it here, or tap the orb and we can talk it through.');
    }
  }catch(e){
    drop.textContent=e.message||'Could not read that file.';
  }
  fileInput.value='';
}

orb.addEventListener('click',toggle);
pauseBtn.addEventListener('click',toggle);
textDot.addEventListener('click',toggleText);
fileDot.addEventListener('click',toggleFiles);
drop.addEventListener('click',function(){fileInput.click()});
fileInput.addEventListener('change',function(){readFile(fileInput.files[0])});
;['dragenter','dragover'].forEach(function(ev){
  drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')});
});
;['dragleave','drop'].forEach(function(ev){
  drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')});
});
drop.addEventListener('drop',function(e){
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f)readFile(f);
});
document.getElementById('textForm').addEventListener('submit',function(e){
  e.preventDefault();
  sendText(document.getElementById('q').value);
});
window.addEventListener('pagehide',function(){if(pc){send({type:'session.close'});teardown()}});
document.getElementById('hello').addEventListener('click',function(){
  document.body.classList.add('started');
  ensureAudio().play().catch(function(){});
  try{lvlCtx=lvlCtx||new (window.AudioContext||window.webkitAudioContext)();lvlCtx.resume();}catch(e){}
  toggle();
});
</script>
