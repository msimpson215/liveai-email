<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Talk with A1 Professional Asphalt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at 50% 42%, #2a2a2a 0%, #0c0c0c 70%, #050505 100%);
  color:#F5C518;
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:22px;text-align:center;
}
#brand{
  font-size:0.74rem;letter-spacing:2px;text-transform:uppercase;
  color:rgba(245,197,24,0.75);
}
#orb{
  width:min(220px,58vw);height:min(220px,58vw);
  border-radius:50%;cursor:pointer;flex-shrink:0;
  background:#F5C518 url('/email/a1-logo.jpg') center/68% no-repeat;
  background-color:#F5C518;
  border:3px solid #F5C518;
  box-shadow:0 0 60px rgba(245,197,24,0.5),0 0 130px rgba(245,197,24,0.2);
  animation:pulse 3s ease-in-out infinite;
}
body.connecting #orb,body.active #orb{
  border-color:#fff;
  animation:pulseOn 1.15s ease-in-out infinite alternate;
}
body.error #orb{border-color:#e0533f;}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);box-shadow:0 0 90px rgba(245,197,24,0.7),0 0 180px rgba(245,197,24,0.3);}
}
@keyframes pulseOn{
  from{transform:scale(1.02);}
  to{transform:scale(1.1);box-shadow:0 0 120px rgba(245,197,24,0.95),0 0 220px rgba(245,197,24,0.45);}
}
#status{
  font-size:0.95rem;letter-spacing:1px;text-transform:uppercase;
  min-height:1.3em;color:#F5C518;
}
#hint{
  font-size:0.78rem;color:rgba(245,197,24,0.5);min-height:1.1em;max-width:300px;
}
#close{
  position:fixed;top:12px;right:14px;width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(245,197,24,0.4);background:rgba(0,0,0,0.4);
  color:#F5C518;font-size:1.05rem;cursor:pointer;line-height:1;
}
</style>
</head>
<body class="idle">
<button id="close" title="Close" aria-label="Close">&#10005;</button>
<div id="wrap">
  <div id="brand">A1 Professional Asphalt &amp; Sealing</div>
  <div id="orb" role="button" tabindex="0" aria-label="Talk with our AI"></div>
  <div id="status">Tap the orb to talk</div>
  <div id="hint">Artificial team member &middot; available now</div>
</div>
<script>
const P=new URLSearchParams(location.search);
const isMini=P.get('mini')==='1';
let pc=null,localStream=null,starting=false,popWin=null;
const sessionUrl='/session?src=email';
const orb=document.getElementById('orb');
const statusEl=document.getElementById('status');
const hintEl=document.getElementById('hint');

/* The small pop-out window: tiny, pinned to the upper-right corner. */
const WIN_W=300,WIN_H=380,WIN_MARGIN=20;
function cornerLeft(){return Math.max(0,(screen.availWidth||screen.width)-WIN_W-WIN_MARGIN);}
function cornerTop(){return WIN_MARGIN;}

/* Mini = the small pop-out window. Shrink + pin to upper-right. */
if(isMini){
  try{
    window.resizeTo(WIN_W,WIN_H);
    window.moveTo(cornerLeft(),cornerTop());
  }catch(e){}
}

function setIdle(){
  document.body.className='idle';
  statusEl.textContent='Tap the orb to talk';
  hintEl.textContent='Artificial team member \u00b7 available now';
}
function setConnecting(){
  document.body.className='connecting';
  statusEl.textContent='Connecting\u2026';
  hintEl.textContent='Allow the microphone when asked';
}
function setActive(){
  document.body.className='active';
  statusEl.textContent='Listening \u2014 tap orb to stop';
  hintEl.textContent='Speak naturally';
}
function setError(){
  document.body.className='error';
  statusEl.textContent='Could not start \u2014 tap to retry';
  hintEl.textContent='Check your microphone and connection';
}
function setLaunched(){
  document.body.className='idle';
  statusEl.textContent='Open in the corner window';
  hintEl.textContent='Talk up in the corner \u00b7 your inbox stays here \u00b7 tap orb to reopen';
}
function setBlocked(){
  document.body.className='error';
  statusEl.textContent='Allow pop-ups, then tap again';
  hintEl.textContent='Click the blocked pop-up icon in the address bar \u2192 always allow';
}

async function stop(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;
  setIdle();
}

async function connectVoice(){
  const r=await fetch(sessionUrl);
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=document.createElement('audio');
  audio.autoplay=true;
  pc.ontrack=e=>{if(audio.srcObject!==e.streams[0])audio.srcObject=e.streams[0]};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc.addTrack(localStream.getTracks()[0]);
  pc.createDataChannel('oai-events');
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  setActive();
}

async function talk(){
  if(pc||starting){await stop();return}
  starting=true;
  setConnecting();
  try{
    await connectVoice();
  }catch(e){
    console.error(e);
    if(pc){try{pc.close()}catch(_){}pc=null}
    if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(_){}localStream=null}
    try{
      await connectVoice();
    }catch(e2){
      console.error(e2);
      if(pc){try{pc.close()}catch(_){}pc=null}
      if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(_){}localStream=null}
      setError();
    }
  }
  starting=false;
}

/* Top-level tab: tapping the orb pops out a small centered window.
   Gmail tab stays open behind it. If the popup is blocked, talk inline. */
function openMiniWindow(){
  if(popWin && !popWin.closed){ try{popWin.focus()}catch(e){} return; }
  const features='popup=yes,width='+WIN_W+',height='+WIN_H+
    ',left='+cornerLeft()+',top='+cornerTop()+
    ',toolbar=no,menubar=no,location=no,status=no,scrollbars=no,resizable=yes';
  popWin=window.open(location.pathname+'?mini=1','a1_talk',features);
  if(popWin){
    setLaunched();
    try{popWin.focus()}catch(e){}
  }else{
    setBlocked();
  }
}

function onOrb(){
  if(isMini){ talk(); }
  else{ openMiniWindow(); }
}

orb.addEventListener('click',onOrb);
orb.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();onOrb()}
});
document.getElementById('close').addEventListener('click',async()=>{
  await stop();
  try{window.close()}catch(e){}
  setIdle();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();try{window.close()}catch(x){}}});

if(isMini){
  setIdle();
}else{
  statusEl.textContent='Tap the orb to talk';
  hintEl.textContent='Opens a small window in the corner \u00b7 your inbox stays open';
}
</script>
</body>
</html>
