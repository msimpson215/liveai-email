<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>A1 Professional Asphalt &mdash; Conversation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;
  -webkit-tap-highlight-color:transparent;user-select:none;}
/* Your design, full-bleed, margin to margin (looks right on big screens & laptops). */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
#outreachPage{display:none;}
body.outreach{background:#fff;}
body.outreach #bg{display:none;}
body.outreach #outreachPage{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;background:#fff;color:#111;font-family:system-ui,sans-serif;
  padding:clamp(22px,5vw,54px) 22px;text-align:center;
}
.a1Mark{font-weight:950;letter-spacing:-0.05em;font-size:clamp(56px,12vw,112px);line-height:0.8;color:#111;}
.a1Brand{font-weight:900;font-size:clamp(22px,5vw,44px);line-height:1.05;margin-top:10px;}
.a1Brand span{display:block;color:#f1be00;}
.a1Sub{max-width:760px;margin-top:14px;font-size:clamp(16px,2.4vw,24px);font-weight:650;color:#333;line-height:1.35;}
/* Live orb sits exactly on the orb in your image (positioned by JS). */
#orb{
  position:fixed;border-radius:50%;cursor:pointer;z-index:2;
  background:transparent;
  box-shadow:0 0 34px 8px rgba(255,205,0,0.35);
  animation:pulse 2.6s ease-in-out infinite;
}
#humanLink{
  position:fixed;z-index:3;display:block;transform:translateX(-50%);
  padding:10px 16px;border-radius:999px;background:rgba(0,0,0,0.80);
  color:#fff;text-decoration:none;font:700 13px/1.2 system-ui,sans-serif;
  box-shadow:0 10px 35px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.18);
  white-space:nowrap;
}
#stopBtn{
  position:fixed;z-index:3;left:50%;bottom:42px;transform:translateX(-50%);display:none;
  padding:12px 22px;border:0;border-radius:999px;background:#111;color:#fff;
  font:800 14px/1 system-ui,sans-serif;letter-spacing:0.04em;cursor:pointer;
  box-shadow:0 12px 38px rgba(0,0,0,0.4);text-transform:uppercase;
}
body.connecting #stopBtn,body.active #stopBtn{display:block;}
#poweredBy{
  position:fixed;right:16px;bottom:12px;z-index:3;text-align:right;
  font:600 12px/1.3 system-ui,sans-serif;letter-spacing:0.01em;color:rgba(255,255,255,0.82);
  text-shadow:0 1px 8px rgba(0,0,0,0.85);pointer-events:none;
}
#poweredBy b{font-weight:800;color:#fff;}
@keyframes pulse{
  0%,100%{box-shadow:0 0 30px 6px rgba(255,205,0,0.30);}
  50%{box-shadow:0 0 64px 18px rgba(255,215,0,0.62);}
}
body.connecting #orb,body.active #orb{animation:pulseOn 1.1s ease-in-out infinite alternate;}
@keyframes pulseOn{
  from{box-shadow:0 0 50px 12px rgba(255,255,255,0.55);}
  to{box-shadow:0 0 110px 30px rgba(255,225,0,0.9);}
}
/* ---- Type-instead fallback (for loud places) ---- */
#textToggle{
  position:fixed;z-index:4;left:50%;bottom:12px;transform:translateX(-50%);display:none;
  padding:9px 18px;border:0;border-radius:999px;background:rgba(17,17,17,0.9);color:#fff;
  font:700 13px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,0.35);
  white-space:nowrap;
}
body.active #textToggle,body.connecting #textToggle{display:block;}
body.texting #textToggle{display:none;}
#textPanel{
  position:fixed;z-index:6;left:0;right:0;bottom:0;display:none;background:#fff;
  border-top:1px solid #e6e6e6;box-shadow:0 -10px 44px rgba(0,0,0,0.22);
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));
}
body.texting #textPanel{display:block;}
body.texting #stopBtn,body.texting #poweredBy{display:none;}
#textPanel .note{
  font:600 13px/1.4 system-ui,sans-serif;color:#7a5d00;background:#fff8df;border:1px solid #ffe39a;
  border-radius:10px;padding:9px 11px;margin-bottom:10px;display:none;
}
body.noisy #textPanel .note{display:block;}
#answer{
  max-height:34vh;overflow:auto;font:500 15px/1.55 system-ui,sans-serif;color:#111;
  margin-bottom:10px;white-space:pre-wrap;-webkit-user-select:text;user-select:text;
}
#answer:empty{display:none;}
#answer .you{color:#555;font-weight:700;}
.trow{display:flex;gap:8px;}
#textInput{
  flex:1;padding:13px 14px;border:1px solid #ccc;border-radius:12px;
  font:500 16px/1.2 system-ui,sans-serif;outline:none;background:#fff;color:#111;
}
#textInput:focus{border-color:#fed100;box-shadow:0 0 0 3px rgba(254,209,0,0.25);}
#sendBtn{
  padding:13px 20px;border:0;border-radius:12px;background:#fed100;color:#111;
  font:800 14px/1 system-ui,sans-serif;cursor:pointer;
}
#voiceBack{
  display:block;margin:11px auto 0;background:none;border:0;color:#666;
  font:600 13px/1 system-ui,sans-serif;cursor:pointer;text-decoration:underline;
}
</style>
</head>
<body class="idle">
<img id="bg" src="/email/talk-bg.png" alt=""/>
<div id="outreachPage" aria-hidden="true">
  <div class="a1Mark">A1</div>
  <div class="a1Brand">Professional <span>Asphalt &amp; Sealing</span></div>
  <div class="a1Sub">Ask our AI team member about asphalt, sealcoating, concrete, parking lot repairs, or future bids.</div>
</div>
<div id="orb" role="button" tabindex="0" aria-label="Talk"></div>
<button id="stopBtn" type="button">Stop</button>
<a id="humanLink" href="tel:+16189293301">Talk to a human team member</a>
<div id="poweredBy">Powered by <b>Axon AI</b></div>
<button id="textToggle" type="button">Type your question instead</button>
<div id="textPanel" aria-live="polite">
  <div class="note">It&rsquo;s a little loud. Please type your question here and I&rsquo;ll answer out loud.</div>
  <div id="answer"></div>
  <div class="trow">
    <input id="textInput" type="text" placeholder="Type your question&hellip;" autocomplete="off" enterkeyhint="send"/>
    <button id="sendBtn" type="button">Send</button>
  </div>
  <button id="voiceBack" type="button">Use voice instead</button>
</div>
<script>
/* ---- position the live orb exactly on the orb drawn in the image ---- */
const params=new URLSearchParams(location.search);
const source=(params.get('src')||'email').toLowerCase();
const sessionSource=(source==='a1tony'||source==='a1outreach')?source:'email';
const isOutreach=sessionSource==='a1tony'||sessionSource==='a1outreach';
const IMG_W=1536,IMG_H=1024;        // background natural size
const ORB_CX=0.508,ORB_CY=0.523;    // orb center as fraction of the image
const ORB_D=0.165;                  // orb diameter as fraction of image width
const orb=document.getElementById('orb');
const humanLink=document.getElementById('humanLink');
function placeOrb(){
  const vw=window.innerWidth,vh=window.innerHeight;
  if(isOutreach){
    const d=Math.max(112,Math.min(Math.min(vw,vh)*0.24,190));
    const left=(vw-d)/2;
    const top=Math.max(vh*0.38,260);
    orb.style.width=d+'px';
    orb.style.height=d+'px';
    orb.style.left=left+'px';
    orb.style.top=top+'px';
    humanLink.style.left=(left+d/2)+'px';
    humanLink.style.top=(top+d+70)+'px';
    return;
  }
  const scale=Math.max(vw/IMG_W,vh/IMG_H);   // object-fit: cover (full-bleed)
  const rw=IMG_W*scale,rh=IMG_H*scale;
  const offX=(vw-rw)/2,offY=(vh-rh)/2;
  const d=ORB_D*rw;
  const left=offX+ORB_CX*rw-d/2;
  const top=offY+ORB_CY*rh-d/2;
  orb.style.width=d+'px';
  orb.style.height=d+'px';
  orb.style.left=left+'px';
  orb.style.top=top+'px';
  humanLink.style.left=(left+d/2)+'px';
  humanLink.style.top=(top+d+64)+'px';
}
placeOrb();
window.addEventListener('resize',placeOrb);

/* ---- Axon AI voice (OpenAI Realtime, GA) ---- */
let pc=null,localStream=null,starting=false,audioEl=null;
let dc=null,micTrack=null,noiseTimer=null,autoTexted=false;
const recipientName=params.get('name')||'';
const autostart=params.get('autostart')==='1';
const sessionParams=new URLSearchParams({src:sessionSource});
if(recipientName)sessionParams.set('name',recipientName);
const sessionUrl='/session?'+sessionParams.toString();
let connState='idle',isTexting=false,isNoisy=false;
function applyClasses(){
  let c=connState+(isOutreach?' outreach':'');
  if(isTexting)c+=' texting';
  if(isNoisy)c+=' noisy';
  document.body.className=c;
}
function setState(s){connState=s;applyClasses();}

function ensureAudio(){
  if(!audioEl){audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;}
  return audioEl;
}
function resumeAudio(){
  if(audioEl&&audioEl.paused){audioEl.play().catch(function(){});return true;}
  return false;
}
async function stop(){
  stopNoiseMonitor();
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  dc=null;micTrack=null;
  isTexting=false;isNoisy=false;autoTexted=false;
  starting=false;setState('idle');
}
async function connectVoice(){
  const r=await fetch(sessionUrl,{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  pc.ontrack=e=>{if(audio.srcObject!==e.streams[0]){audio.srcObject=e.streams[0];audio.play().catch(function(){});}};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  micTrack=localStream.getAudioTracks()[0];
  pc.addTrack(micTrack);
  dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}});
  dc.addEventListener('message',handleEvent);
  startNoiseMonitor();
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  setState('active');
}
async function start(){
  if(pc||starting)return;
  starting=true;setState('connecting');
  try{await connectVoice();}
  catch(e){
    console.error(e);
    await stop();
  }
  starting=false;
}

/* Auto-start on open. To stop: press Stop, press Escape, or leave the page.
   The orb stays tappable as a silent fallback if the browser blocks autostart. */
const stopBtn=document.getElementById('stopBtn');
function toggleVoice(){
  if(pc||starting){if(!resumeAudio())stop();}else{start();}
}
orb.addEventListener('click',function(e){e.stopPropagation();toggleVoice();});
orb.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleVoice();}
});
stopBtn.addEventListener('click',function(e){e.stopPropagation();stop();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')stop();});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(pc||starting))stop();
});
window.addEventListener('pagehide',function(){if(pc||starting)stop();});
window.addEventListener('beforeunload',function(){if(pc||starting)stop();});

/* ---- Type-instead fallback for loud environments ---- */
const textToggle=document.getElementById('textToggle');
const textPanel=document.getElementById('textPanel');
const textInput=document.getElementById('textInput');
const sendBtn=document.getElementById('sendBtn');
const voiceBack=document.getElementById('voiceBack');
const answerEl=document.getElementById('answer');
let curAI=null;

function appendAI(text){
  if(!curAI){curAI=document.createElement('div');answerEl.appendChild(curAI);}
  curAI.textContent+=text;
  answerEl.scrollTop=answerEl.scrollHeight;
}
/* Read the AI's spoken words as text so it works even when you can't hear it. */
function handleEvent(ev){
  let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
  const t=msg.type||'';
  if(t.indexOf('audio_transcript.delta')>=0&&typeof msg.delta==='string'){appendAI(msg.delta);}
  else if(t.indexOf('text.delta')>=0&&typeof msg.delta==='string'){appendAI(msg.delta);}
  else if(t.indexOf('audio_transcript.done')>=0||t==='response.done'){curAI=null;}
}
function setMic(on){if(micTrack){micTrack.enabled=on;}}
function openText(auto){
  if(!pc&&!starting){start();}
  isTexting=true;
  if(auto){isNoisy=true;autoTexted=true;}
  setMic(false);
  applyClasses();
  setTimeout(function(){try{textInput.focus();}catch(e){}},60);
}
function closeText(){
  isTexting=false;isNoisy=false;
  setMic(true);
  applyClasses();
}
function sendText(){
  const text=(textInput.value||'').trim();
  if(!text)return;
  const you=document.createElement('div');you.className='you';you.textContent='You: '+text;
  answerEl.appendChild(you);curAI=null;answerEl.scrollTop=answerEl.scrollHeight;
  textInput.value='';
  if(dc&&dc.readyState==='open'){
    try{
      dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:text}]}}));
      dc.send(JSON.stringify({type:'response.create'}));
    }catch(e){}
  }
}
textToggle.addEventListener('click',function(){openText(false);});
sendBtn.addEventListener('click',sendText);
voiceBack.addEventListener('click',closeText);
textInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendText();}});

/* ---- Noise watch: if it stays loud, auto-offer the text box once ---- */
let audioCtx=null,analyser=null,noiseData=null,loudFrames=0;
function startNoiseMonitor(){
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended'){audioCtx.resume().catch(function(){});}
    const src=audioCtx.createMediaStreamSource(localStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=512;
    noiseData=new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    loudFrames=0;
    noiseTimer=setInterval(checkNoise,250);
  }catch(e){}
}
function checkNoise(){
  if(!analyser||isTexting||autoTexted)return;
  analyser.getByteTimeDomainData(noiseData);
  let sum=0;for(let i=0;i<noiseData.length;i++){const v=(noiseData[i]-128)/128;sum+=v*v;}
  const rms=Math.sqrt(sum/noiseData.length);
  if(rms>0.17){loudFrames++;}else{loudFrames=Math.max(0,loudFrames-1);}
  if(loudFrames>=12){openText(true);}   /* ~3s of sustained loud */
}
function stopNoiseMonitor(){
  if(noiseTimer){clearInterval(noiseTimer);noiseTimer=null;}
  if(audioCtx){try{audioCtx.close()}catch(e){}audioCtx=null;}
  analyser=null;loudFrames=0;
}

setState('idle');
/* Always auto-start the moment the page opens (no button, no extra click). */
setTimeout(start,250);
</script>
</body>
</html>
