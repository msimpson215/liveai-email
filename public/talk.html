<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Talk with A1 Professional Asphalt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at 50% 42%, #2a2a2a 0%, #0c0c0c 70%, #050505 100%);
  color:#F5C518;
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:22px;text-align:center;}
#orb{
  width:min(220px,58vw);height:min(220px,58vw);
  border-radius:50%;cursor:pointer;flex-shrink:0;
  background:#F5C518 url('/email/a1-logo.jpg') center/68% no-repeat;
  background-color:#F5C518;border:3px solid #F5C518;
  box-shadow:0 0 60px rgba(245,197,24,0.5),0 0 130px rgba(245,197,24,0.2);
  animation:pulse 3s ease-in-out infinite;
}
body.connecting #orb,body.active #orb{border-color:#fff;animation:pulseOn 1.15s ease-in-out infinite alternate;}
body.error #orb{border-color:#e0533f;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);box-shadow:0 0 90px rgba(245,197,24,0.7),0 0 180px rgba(245,197,24,0.3);}}
@keyframes pulseOn{from{transform:scale(1.02);}to{transform:scale(1.1);box-shadow:0 0 120px rgba(245,197,24,0.95),0 0 220px rgba(245,197,24,0.45);}}
#status{font-size:0.95rem;letter-spacing:1px;text-transform:uppercase;min-height:1.3em;color:#F5C518;}
#hint{font-size:0.78rem;color:rgba(245,197,24,0.5);min-height:1.1em;max-width:320px;}
#close{position:fixed;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(245,197,24,0.4);background:rgba(0,0,0,0.4);color:#F5C518;font-size:1rem;cursor:pointer;line-height:1;}
</style>
</head>
<body class="idle">
<button id="close" title="Close" aria-label="Close">&#10005;</button>
<div id="wrap">
  <div id="orb" role="button" tabindex="0" aria-label="Click to talk"></div>
  <div id="status">Click to talk</div>
  <div id="hint">Live voice &middot; allow the microphone when asked</div>
</div>
<script>
let pc=null,localStream=null,starting=false,pipWin=null;
const sessionUrl='/session?src=email';
const orb=document.getElementById('orb');
const statusEl=document.getElementById('status');
const hintEl=document.getElementById('hint');

function paint(state,txt){
  document.body.className=state;
  if(statusEl)statusEl.textContent=txt;
  if(pipWin && !pipWin.closed){
    try{
      pipWin.document.body.className=state;
      const ps=pipWin.document.getElementById('status');
      if(ps)ps.textContent=txt;
    }catch(e){}
  }
}
function setIdle(){paint('idle','Click to talk');if(hintEl)hintEl.textContent='Live voice \u00b7 allow the microphone when asked';}
function setConnecting(){paint('connecting','Connecting\u2026');if(hintEl)hintEl.textContent='Allow the microphone when asked';}
function setActive(){paint('active','Listening \u2014 click to stop');if(hintEl)hintEl.textContent='Speak naturally';}
function setError(){paint('error','Click to talk');if(hintEl)hintEl.textContent='Tap the orb to start';}

async function stop(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;
  setIdle();
}

async function connectVoice(){
  const r=await fetch(sessionUrl);
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=document.createElement('audio');
  audio.autoplay=true;
  pc.ontrack=e=>{if(audio.srcObject!==e.streams[0])audio.srcObject=e.streams[0]};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc.addTrack(localStream.getTracks()[0]);
  const dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}});
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  setActive();
}

async function toggle(){
  if(pc||starting){await stop();return}
  starting=true;
  setConnecting();
  try{await connectVoice();}
  catch(e){
    console.error(e);
    if(pc){try{pc.close()}catch(_){}pc=null}
    if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(_){}localStream=null}
    setError();
  }
  starting=false;
}

/* Picture-in-Picture: floating, always-on-top mini window over Gmail.
   Not a pop-up, not an extension. Chrome/Edge. */
async function openFloatingPiP(){
  if(!('documentPictureInPicture' in window))return false;
  if(pipWin && !pipWin.closed){try{pipWin.focus()}catch(e){}return true;}
  try{pipWin=await window.documentPictureInPicture.requestWindow({width:260,height:300});}
  catch(e){pipWin=null;return false;}
  const d=pipWin.document;
  const LOGO=location.origin+'/email/a1-logo.jpg';
  const st=d.createElement('style');
  st.textContent=
    "*{margin:0;padding:0;box-sizing:border-box;}"+
    "html,body{width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;"+
    "align-items:center;justify-content:center;gap:12px;cursor:pointer;"+
    "font-family:Arial,Helvetica,sans-serif;color:#F5C518;"+
    "background:radial-gradient(circle at 50% 42%,#2a2a2a 0%,#080808 75%);}"+
    ".orb{width:150px;height:150px;border-radius:50%;flex-shrink:0;"+
    "background:#F5C518 url("+LOGO+") center/68% no-repeat;border:3px solid #F5C518;"+
    "box-shadow:0 0 46px rgba(245,197,24,0.55);animation:pulse 3s ease-in-out infinite;}"+
    "body.connecting .orb,body.active .orb{border-color:#fff;animation:pulseOn 1.15s ease-in-out infinite alternate;}"+
    "body.error .orb{border-color:#e0533f;}"+
    "@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}"+
    "@keyframes pulseOn{from{transform:scale(1.02)}to{transform:scale(1.1)}}"+
    "#status{font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:0 10px;}";
  d.head.appendChild(st);
  d.body.className='idle';
  const o=d.createElement('div');o.className='orb';
  const s=d.createElement('div');s.id='status';s.textContent='Connecting\u2026';
  d.body.appendChild(o);d.body.appendChild(s);
  o.addEventListener('click',toggle);
  pipWin.addEventListener('pagehide',function(){try{stop()}catch(e){}pipWin=null;});
  if(hintEl)hintEl.textContent='Floating on top \u2014 switch to your Gmail tab; it stays visible';
  toggle();
  return true;
}

async function onOrb(){
  // No pop-up, no extension: float via Picture-in-Picture. If the browser
  // doesn't support PiP, just talk on this page.
  if(await openFloatingPiP())return;
  toggle();
}

orb.addEventListener('click',onOrb);
orb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onOrb()}});
document.getElementById('close').addEventListener('click',async()=>{
  if(pipWin && !pipWin.closed){try{pipWin.close()}catch(e){}}
  await stop();
  try{window.close()}catch(e){}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();try{window.close()}catch(x){}}});

setIdle();
</script>
</body>
</html>
