<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#061636"/>
<meta name="cache-control" content="no-store"/>
<link rel="apple-touch-icon" href="/icons/axon-blue-180.png"/>
<link rel="icon" href="/icons/axon-blue-192.png"/>
<title>Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color:#fff;
  background:
    radial-gradient(70% 45% at 50% 52%, rgba(37,99,235,.28) 0%, transparent 70%),
    linear-gradient(180deg,#0a2150 0%,#061636 55%,#030b1f 100%);
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:min(100%,480px);min-height:100dvh;margin:0 auto;
  padding:clamp(1.8rem,6vh,3rem) 1.4rem calc(1.4rem + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.eyebrow{font-size:1rem;font-weight:600;color:#c9d8f5;line-height:1.4}
h1{font-size:clamp(2.1rem,9vw,2.9rem);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-top:.45rem}
.rule{width:160px;height:2px;margin:1rem auto .9rem;background:linear-gradient(90deg,transparent,#d4a64a,transparent)}
.sub{font-size:1.05rem;line-height:1.5;color:#dbe6fb;max-width:24rem}
.orb-wrap{margin:auto 0;padding:2.4rem 0 1.2rem;display:flex;flex-direction:column;align-items:center}
#orb{
  position:relative;width:min(56vw,210px);aspect-ratio:1;border-radius:50%;cursor:pointer;
  border:3px solid rgba(147,197,253,.95);
  background:radial-gradient(circle at 50% 40%, #123a85 0%, #0a2259 62%, #071a45 100%);
  box-shadow:0 0 28px rgba(96,165,250,.65),0 0 70px rgba(37,99,235,.35),inset 0 0 30px rgba(96,165,250,.35);
  display:grid;place-items:center;transition:transform .18s ease;
}
#orb svg{width:52%;height:auto;position:relative;z-index:1}
#orb::before,#orb::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2px solid rgba(147,197,253,.7);
  animation:ripple 2.6s ease-out infinite;pointer-events:none;
}
#orb::after{animation-delay:1.3s}
@keyframes ripple{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.55);opacity:0}}
#orb:active{transform:scale(.96)}
body[data-state="connecting"] #orb::before,body[data-state="connecting"] #orb::after{animation-duration:1.2s}
body[data-state="speaking"] #orb{box-shadow:0 0 36px rgba(147,197,253,.9),0 0 90px rgba(37,99,235,.55),inset 0 0 34px rgba(147,197,253,.45)}
body[data-state="speaking"] #orb::before,body[data-state="speaking"] #orb::after{animation-duration:1.5s;border-color:rgba(191,219,254,.9)}
body[data-state="listening"] #orb::before,body[data-state="listening"] #orb::after{animation-duration:2s}
.hint{margin-top:1.5rem;font-size:1.15rem;font-weight:700;color:#fff;min-height:1.6em}
.examples{margin-top:1.4rem;display:flex;flex-direction:column;gap:.5rem;width:100%}
.examples span{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8fa6d4}
.examples i{
  font-style:normal;background:rgba(255,255,255,.06);border:1px solid rgba(147,197,253,.22);
  border-radius:12px;padding:.7rem .85rem;font-size:.93rem;color:#e3ecff;text-align:left;
}
.note{
  margin-top:auto;padding-top:1.4rem;font-size:.74rem;line-height:1.5;color:#8fa2c8;max-width:24rem;
}
.powered{margin-top:.6rem;font-size:.7rem;color:#6f84b0;letter-spacing:.02em}
.powered b{color:#93c5fd;font-weight:700}
</style>
</head>
<body data-state="idle">
  <div class="wrap">
    <p class="eyebrow">Do you have questions or want to know more?</p>
    <h1 id="title">Ask</h1>
    <div class="rule"></div>
    <p class="sub" id="blurb">Our AI assistant can help you understand.</p>

    <div class="orb-wrap">
      <button type="button" id="orb" aria-label="Tap to ask a question out loud">
        <svg viewBox="0 0 120 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" aria-hidden="true">
          <rect x="47" y="12" width="26" height="46" rx="13" fill="#fff" stroke="none"/>
          <path d="M37 46c0 13 10 23 23 23s23-10 23-23"/>
          <path d="M60 69v14M47 86h26"/>
          <path d="M24 34c-4 8-4 18 0 26M14 28c-7 12-7 26 0 38" opacity=".85"/>
          <path d="M96 34c4 8 4 18 0 26M106 28c7 12 7 26 0 38" opacity=".85"/>
        </svg>
      </button>
      <p class="hint" id="hint">Tap to talk</p>
    </div>

    <div class="examples" id="examples" hidden>
      <span>You could ask</span>
    </div>

    <p class="note" id="note"></p>
    <p class="powered">Powered by <b>Axon AI</b></p>
  </div>

<script src="/axon-voice.js"></script>
<script>
const TOPIC = window.ASK_TOPIC || null;
const SLUG = (TOPIC && TOPIC.slug) || new URLSearchParams(location.search).get('t') || '';

const orb=document.getElementById('orb');
const hint=document.getElementById('hint');
let pc=null,localStream=null,starting=false,audioEl=null,voice=null;

if(TOPIC){
  document.title=TOPIC.title;
  document.getElementById('title').textContent=TOPIC.title;
  document.getElementById('blurb').textContent=TOPIC.blurb;
  document.getElementById('note').textContent=TOPIC.disclaimer||TOPIC.note||'';
  if(TOPIC.asks&&TOPIC.asks.length){
    const box=document.getElementById('examples');
    TOPIC.asks.forEach(function(a){
      const i=document.createElement('i');
      i.textContent='\u201C'+a+'\u201D';
      box.appendChild(i);
    });
    box.hidden=false;
  }
}

function setState(s,msg){
  document.body.dataset.state=s||'idle';
  if(msg!==undefined)hint.textContent=msg;
}
function ensureAudio(){
  if(!audioEl){
    audioEl=document.createElement('audio');
    audioEl.autoplay=true;audioEl.playsInline=true;
    document.body.appendChild(audioEl);
  }
  return audioEl;
}
async function stopVoice(){
  if(voice){voice.detach();voice=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;
  setState('idle','Tap to talk');
}

/* The call dropped. Nothing used to happen here, so the orb sat there looking
   alive while nothing worked and the only fix was reloading the page. Rebuild
   the connection quietly and keep going; axon-voice.js hands the previous turns
   to the new session so it carries on instead of greeting again. */
let reconnecting=false,reconnectTries=0;
async function handleLost(){
  if(reconnecting)return;
  reconnecting=true;
  const startFn=(typeof connectVoice==='function')?connectVoice:null;
  try{if(voice){voice.detach();voice=null}}catch(e){}
  try{if(pc){pc.close()}}catch(e){}
  pc=null;
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  const wait=Math.min(8000,600*Math.pow(2,reconnectTries++));
  setTimeout(async function(){
    try{ if(startFn)await startFn(); reconnectTries=0; }
    catch(e){ if(reconnectTries<5)handleLost(); }
    finally{ reconnecting=false; }
  },wait);
}

async function connectVoice(){
  const r=await fetch('/session?gate=1&src=ask&t='+encodeURIComponent(SLUG),{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error){
    const err=new Error(data.error||'session');
    err.status=r.status;err.detail=data.error;throw err;
  }
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');

  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  let remoteStream=null;
  pc.ontrack=e=>{
    remoteStream=e.streams[0];
    if(audio.srcObject!==e.streams[0]){
      audio.srcObject=e.streams[0];
      audio.play().catch(()=>{});
    }
  };
  localStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
  });
  const micTrack=localStream.getTracks()[0];
  // Closed through the opening line so the speaker cannot feed back into it
  // and trigger a second, overlapping answer.
  micTrack.enabled=false;
  pc.addTrack(micTrack);

  const dc=pc.createDataChannel('oai-events');
  let greeted=false;
  dc.addEventListener('open',()=>{
    if(greeted||AxonVoice.hasHistory())return;
    greeted=true;
    try{dc.send(JSON.stringify({type:'response.create'}))}catch(e){}
  });
  dc.addEventListener('message',ev=>{
    try{
      const msg=JSON.parse(ev.data);
      if(msg.type==='response.created')setState('speaking','Speaking…');
      if(msg.type==='response.done')setState('listening','Listening — go ahead');
    }catch(e){}
  });

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok){
    let detail='';
    try{detail=await sdp.text()}catch(e){}
    const outOfCredit=/insufficient_quota|exceeded your current quota|billing/i.test(detail);
    const err=new Error(outOfCredit?'quota':(sdp.status===429?'busy':'sdp'));
    err.status=sdp.status;throw err;
  }
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  voice=AxonVoice.attach({dc:dc,micTrack:micTrack,localStream:localStream,remoteStream:remoteStream,voice:data.voice,pc:pc,onLost:handleLost});
  setState('listening','Listening — go ahead');
}
async function toggleVoice(){
  if(starting)return;
  if(pc){await stopVoice();return}
  starting=true;
  setState('connecting','One moment…');
  try{
    await connectVoice();
  }catch(e){
    console.error(e);
    starting=false;
    await stopVoice();
    const why=e&&e.message;
    // A 429 from our own server carries a readable sentence; show it.
    if(e&&e.status===429&&e.detail){setState('idle',e.detail);return}
    setState('idle',
      why==='quota'?'Temporarily unavailable. Please try again later.':
      why==='busy'?'Busy right now. Try again in a minute.':
      'That didn\u2019t connect. Tap to try again.');
    return;
  }
  starting=false;
}
orb.addEventListener('click',toggleVoice);
document.addEventListener('visibilitychange',()=>{
  /* Backgrounding no longer ends the call - axon-voice.js just closes the mic. */
});
window.addEventListener('pagehide',()=>{if(pc||starting)stopVoice()});
</script>
</body>
</html>
