<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>A1 Professional Asphalt and Concrete — talk to our AI Assistant</title>
<style>
  :root{ --black:#0b0b0b; --yellow:#f7c518; --white:#f4f4f4; --grey:#bdbdbd; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{ background:var(--black); color:var(--white); min-height:100vh;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; }
  .sheet{ width:100%; max-width:576px; min-height:100vh; display:flex; flex-direction:column;
    background:var(--black); position:relative; overflow:hidden; }

  .hazard{ height:24px; background:repeating-linear-gradient(135deg,var(--yellow) 0 24px,#111 24px 48px) }

  /* The arch and the road, the way Marty's design has them. */
  .hero{ position:relative; }
  .hero .road{ display:block; width:100%; height:214px; object-fit:cover; object-position:center 30%;
    opacity:.62; }
  .hero::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(11,11,11,.55) 0%, rgba(11,11,11,.1) 40%, var(--black) 100%); }
  .brand{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; gap:12px; padding:0 22px; }
  .brand img{ width:104px; height:104px; object-fit:contain; flex:0 0 104px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)) }
  .brandText b{ display:block; color:var(--yellow); font-size:32px; line-height:1.02; letter-spacing:-.015em }
  .brandText span{ display:block; color:#fff; font-size:21px; font-weight:700; line-height:1.15; margin-top:1px }
  .goldline{ height:2px; background:var(--yellow); position:relative; z-index:3 }

  main{ padding:26px 24px 30px; text-align:center; flex:1 0 auto; position:relative; z-index:2 }
  h1{ margin:0; font-size:37px; line-height:1.07; text-transform:uppercase; letter-spacing:-.005em }
  h1 .w{ color:#fff; display:block }
  h1 .y{ color:var(--yellow); display:block }
  .lead{ margin:15px 0 24px; font-size:17px }

  .orb-wrap{ display:flex; flex-direction:column; align-items:center }
  #orb{ appearance:none; width:206px; height:206px; border-radius:50%; cursor:pointer;
    border:5px solid var(--yellow); background:radial-gradient(circle at 50% 44%, #2c2405 0%, #0d0d0d 72%);
    box-shadow:0 0 0 9px rgba(247,197,24,.10), 0 0 44px rgba(247,197,24,.55), inset 0 0 32px rgba(247,197,24,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    transition:box-shadow .25s, transform .15s }
  #orb:active{ transform:scale(.98) }
  #orb svg{ width:62px; height:62px }
  #orb .cap{ color:var(--yellow); font-size:21px; font-weight:800; text-transform:uppercase }
  body[data-state="connecting"] #orb{ animation:pulse 1.1s ease-in-out infinite }
  body[data-state="speaking"] #orb{ box-shadow:0 0 0 13px rgba(247,197,24,.16), 0 0 68px rgba(247,197,24,.8), inset 0 0 38px rgba(247,197,24,.28) }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 17px rgba(247,197,24,.16), 0 0 62px rgba(247,197,24,.75) } }

  body[data-state="idle"] .hint{visibility:hidden}
  .hint{ margin:14px 0 0; font-size:15px; color:var(--grey) }
  .mode-btn{ margin:18px auto 0; display:block; width:100%; max-width:410px; cursor:pointer;
    background:rgba(0,0,0,.35); border:1px solid var(--yellow); border-radius:30px;
    color:var(--white); font:inherit; font-size:15px; padding:13px 18px }
  .mode-btn.on{ background:var(--yellow); color:#111; font-weight:700 }
  .mode-note{ margin:11px auto 0; font-size:14px; color:var(--grey); max-width:410px; line-height:1.5 }

  .services{ display:grid; grid-template-columns:repeat(4,1fr); margin:24px auto 0; max-width:450px;
    background:rgba(20,20,20,.85); border:1px solid #2b2b2b; border-radius:12px; overflow:hidden }
  .services div{ padding:13px 3px; font-size:11px; font-weight:700; letter-spacing:.06em;
    color:var(--grey); text-transform:uppercase; border-right:1px solid #2b2b2b }
  .services div:last-child{ border-right:0 }
  .services svg{ display:block; margin:0 auto 7px; width:29px; height:21px }

  .callrow{ display:flex; align-items:center; gap:13px; justify-content:center; margin:24px auto 0;
    max-width:460px; text-align:left }
  .callrow .ic{ flex:0 0 44px; width:44px; height:44px; border-radius:50%; background:var(--yellow);
    display:flex; align-items:center; justify-content:center }
  .callrow a{ text-decoration:none; color:var(--yellow) }
  .callrow .lbl{ display:block; color:#fff; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase }
  .callrow .num{ display:block; font-size:30px; font-weight:800; line-height:1.1; letter-spacing:-.01em }

  @media (max-width:400px){
    h1{font-size:30px} .brand img{width:84px;height:84px;flex:0 0 84px}
    .brandText b{font-size:26px} .brandText span{font-size:17px}
    #orb{width:178px;height:178px} .callrow .num{font-size:26px} .hero .road{height:180px}
  }
</style>
</head>
<body data-state="idle">
<div class="sheet">
  <div class="hazard"></div>

  <div class="hero">
    <img class="road" src="/art/a1-asphalt.png" alt="">
    <div class="brand">
      <img src="/art/a1-arch-logo.png" alt="A1">
      <span class="brandText"><b>Professional</b><span>Asphalt and Concrete</span></span>
    </div>
  </div>
  <div class="goldline"></div>

  <main>
    <h1><span class="w">Have questions</span><span class="y">about our services?</span></h1>
    <p class="lead">Talk to our AI Assistant about anything we do.</p>

    <div class="orb-wrap">
      <button type="button" id="orb" aria-label="Tap to talk to our AI Assistant">
        <svg viewBox="0 0 48 48" fill="none" stroke="#f7c518" stroke-width="2.6" stroke-linecap="round">
          <rect x="19" y="9" width="10" height="18" rx="5" fill="#f7c518" stroke="none"/>
          <path d="M15 22a9 9 0 0 0 18 0"/><path d="M24 31v6"/>
          <path d="M11 17c-1.6 2-1.6 8 0 10M37 17c1.6 2 1.6 8 0 10" opacity=".85"/>
          <path d="M6 14c-2.6 3.2-2.6 13 0 16M42 14c2.6 3.2 2.6 13 0 16" opacity=".5"/>
        </svg>
        <span class="cap">Tap to talk</span>
      </button>
      <p class="hint" id="hint">Tap to talk</p>
      <button type="button" id="modeBtn" class="mode-btn">Noisy room? Switch to tap-to-talk &nbsp;&rsaquo;</button>
      <p class="mode-note" id="modeNote"></p>

      <div class="services" aria-hidden="true">
        <div><svg viewBox="0 0 30 22" fill="none" stroke="#f7c518" stroke-width="1.8"><path d="M3 17h24M6 17V9h7l3 4h8v4"/><circle cx="9" cy="19" r="2"/><circle cx="22" cy="19" r="2"/></svg>Paving</div>
        <div><svg viewBox="0 0 30 22" fill="none" stroke="#f7c518" stroke-width="1.8"><path d="M15 3c4 5 6 7.5 6 10.5A6 6 0 0 1 9 13.5C9 10.5 11 8 15 3z"/></svg>Sealcoating</div>
        <div><svg viewBox="0 0 30 22" fill="none" stroke="#f7c518" stroke-width="2"><path d="M10 20 14 2M20 20l4-18"/><path d="M15 18v-3M15 11V8"/></svg>Striping</div>
        <div><svg viewBox="0 0 30 22" fill="none" stroke="#bdbdbd" stroke-width="1.8"><path d="M4 8h22v8H4zM4 8l4-4h22l-4 4M26 16l4-4"/></svg>Concrete</div>
      </div>

      <p class="callrow">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="#111"><path d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l1.9-1.9c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V19c0 .6-.4 1-1 1C10.6 20 4 13.4 4 5c0-.6.4-1 1-1h3.1c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .7-.2 1l-1.9 1.3z"/></svg></span>
        <a href="tel:+16189293301">
          <span class="lbl">Or call one of our team members directly at</span>
          <span class="num">(618) 929-3301</span>
        </a>
      </p>
    </div>
  </main>

  <div class="hazard"></div>
</div>

<script src="/axon-voice.js"></script>
<script>
const orb=document.getElementById('orb');
const hint=document.getElementById('hint');
let pc=null,localStream=null,starting=false,audioEl=null,voice=null;

function setState(s,msg){
  document.body.dataset.state=s||'idle';
  if(msg!==undefined)hint.textContent=msg;
}
function ensureAudio(){
  if(!audioEl){
    audioEl=document.createElement('audio');
    audioEl.autoplay=true;audioEl.playsInline=true;
    document.body.appendChild(audioEl);
  }
  return audioEl;
}
async function stopVoice(){
  if(voice){voice.detach();voice=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  starting=false;
  setState('idle','Tap to talk');
}
// A per-clinic URL (/stress-test/bjc) injects its key so the guide can answer
// where-to-go questions for that location.



/* The call dropped. Nothing used to happen here, so the orb sat there looking
   alive while nothing worked and the only fix was reloading the page. Rebuild
   the connection quietly and keep going; axon-voice.js hands the previous turns
   to the new session so it carries on instead of greeting again. */
let reconnecting=false,reconnectTries=0;
async function handleLost(){
  if(reconnecting)return;
  reconnecting=true;
  const startFn=(typeof connectVoice==='function')?connectVoice:null;
  try{if(voice){voice.detach();voice=null}}catch(e){}
  try{if(pc){pc.close()}}catch(e){}
  pc=null;
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  const wait=Math.min(8000,600*Math.pow(2,reconnectTries++));
  setTimeout(async function(){
    try{ if(startFn)await startFn(); reconnectTries=0; }
    catch(e){ if(reconnectTries<5)handleLost(); }
    finally{ reconnecting=false; }
  },wait);
}

/* ---- Tap-to-talk ----
   In a room with a television or a radio on, hands-free cannot be made to work:
   a TV's voice and a person's voice measure the same through one microphone, so
   the only way to not hear the TV is to keep the microphone shut until the
   person actually wants to speak. Holding the orb does that. */
let tapToTalk=false;
const modeBtn=document.getElementById('modeBtn');
const modeNote=document.getElementById('modeNote');
function setTapToTalk(on,why){
  tapToTalk=!!on;
  if(voice)voice.setPtt(tapToTalk);
  modeBtn.classList.toggle('on',tapToTalk);
  modeBtn.textContent=tapToTalk?'Back to hands-free':'Noisy room? Switch to tap-to-talk';
  modeNote.textContent=tapToTalk
    ? 'Hold the circle while you talk, let go when you\'re done.'
    : (why||'');
  setState(tapToTalk?'listening':'listening',tapToTalk?'Hold the circle and talk':'Tap to talk');
}
function offerTapToTalk(){
  if(tapToTalk)return;
  modeNote.textContent='Sounds like there\'s a TV or people talking near you. Tap-to-talk works better in here.';
}
modeBtn.addEventListener('click',function(e){e.stopPropagation();setTapToTalk(!tapToTalk);});
/* Holding the orb = my turn. Works for mouse, touch and keyboard. */
function holdOn(e){ if(!tapToTalk||!voice)return; e.preventDefault(); voice.hold(true); setState('listening','Listening\u2026 let go when done'); }
function holdOff(){ if(!tapToTalk||!voice)return; voice.hold(false); setState('listening','Hold the circle and talk'); }

async function connectVoice(){
  const url='/session?gate=1&src=email';
  const r=await fetch(url,{cache:'no-store'});
  const data=await r.json();
  if(!r.ok||data.error){
    const err=new Error(r.status===429?'busy':(data.error||'session'));
    err.status=r.status;throw err;
  }
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');

  pc=new RTCPeerConnection();
  const audio=ensureAudio();
  let remoteStream=null;
  pc.ontrack=e=>{
    remoteStream=e.streams[0];
    if(audio.srcObject!==e.streams[0]){
      audio.srcObject=e.streams[0];
      audio.play().catch(()=>{});
    }
  };
  localStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
  });
  const micTrack=localStream.getTracks()[0];
  // Mic stays closed through the opening line so the speaker can't feed back
  // into it and trigger a second, overlapping answer.
  micTrack.enabled=false;
  pc.addTrack(micTrack);

  const dc=pc.createDataChannel('oai-events');
  let greeted=false;
  dc.addEventListener('open',()=>{
    if(greeted||AxonVoice.hasHistory())return;
    greeted=true;
    try{dc.send(JSON.stringify({type:'response.create'}))}catch(e){}
  });
  dc.addEventListener('message',ev=>{
    try{
      const msg=JSON.parse(ev.data);
      if(msg.type==='response.created')setState('speaking','Speaking…');
      if(msg.type==='response.done')setState('listening','Listening — go ahead');
    }catch(e){}
  });

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok){
    let detail='';
    try{detail=await sdp.text()}catch(e){}
    const outOfCredit=/insufficient_quota|exceeded your current quota|billing/i.test(detail);
    const err=new Error(outOfCredit?'quota':(sdp.status===429?'busy':'sdp'));
    err.status=sdp.status;throw err;
  }
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  voice=AxonVoice.attach({dc:dc,micTrack:micTrack,localStream:localStream,remoteStream:remoteStream,voice:data.voice,pc:pc,onLost:handleLost,onNoisyRoom:offerTapToTalk});
  if(tapToTalk)voice.setPtt(true);
  setState('listening','Listening — go ahead');
}
async function toggleVoice(){
  if(starting)return;
  if(pc){await stopVoice();return}
  starting=true;
  setState('connecting','One moment…');
  try{
    await connectVoice();
  }catch(e){
    console.error(e);
    starting=false;
    await stopVoice();
    const why=e&&e.message;
    setState('idle',
      why==='quota'?'Temporarily unavailable — please ask a staff member.':
      why==='busy'?'Busy right now. Try again in a minute.':
      'That didn\u2019t connect. Tap to try again.');
    return;
  }
  starting=false;
}
orb.addEventListener('pointerdown',holdOn);
orb.addEventListener('pointerup',holdOff);
orb.addEventListener('pointercancel',holdOff);
orb.addEventListener('pointerleave',holdOff);
orb.addEventListener('click',function(){if(tapToTalk&&pc)return;toggleVoice();});
document.addEventListener('visibilitychange',()=>{
  /* Backgrounding no longer ends the call - axon-voice.js just closes the mic. */
});
window.addEventListener('pagehide',()=>{if(pc||starting)stopVoice()});
</script>
</body>
</html>
