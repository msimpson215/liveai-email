<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  /* Popups can't be truly transparent — white blends with Gmail */
  background:#fff;
}
body{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:10px;gap:8px;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
/* Orb is sized off the space actually available, so it can never be clipped
   no matter how much chrome the browser puts on this popup. */
.orb{
  width:min(124px,58vh,66vw);
  aspect-ratio:1;
  border-radius:50%;cursor:pointer;flex-shrink:0;
  background:#FED100 url('/email/a1-logo.jpg') center/62% no-repeat;
  background-color:#FED100;
  border:2px solid #FED100;
  box-shadow:0 0 22px rgba(254,209,0,0.35);
  transition:box-shadow .25s ease, transform .25s ease;
}
body.connecting .orb{box-shadow:0 0 28px rgba(254,209,0,0.55);}
body.talking .orb{animation:talkPulse 0.9s ease-in-out infinite alternate;}
body.error .orb{border-color:#c5221f;box-shadow:0 0 16px rgba(197,34,31,0.45);}
@keyframes talkPulse{
  from{transform:scale(1);box-shadow:0 0 18px rgba(254,209,0,0.4);}
  to{transform:scale(1.06);box-shadow:0 0 36px rgba(254,209,0,0.85);}
}
.label{
  font-size:11px;font-weight:700;color:#333;text-align:center;
  line-height:1.25;max-width:100%;pointer-events:none;flex-shrink:0;
}
.hint{
  font-size:10px;font-weight:600;color:#8a8a8a;text-align:center;
  line-height:1.2;pointer-events:none;flex-shrink:0;margin-top:-4px;
}
</style>
</head>
<body>
<div class="orb" id="orb" role="button" tabindex="0" aria-label="A1 Asphalt Team Member"></div>
<div class="label">A1 Asphalt Team Member</div>
<div class="hint" id="hint">Click to talk</div>
<script src="/axon-voice.js"></script>
<script>
let pc=null,localStream=null,starting=false,voice=null,armed=false;
const sessionUrl='/session?gate=1&src=email';
const orb=document.getElementById('orb');
const hint=document.getElementById('hint');
function setHint(t){if(hint)hint.textContent=t;}

/* How much room the CONTENT needs. window.resizeTo sizes the OUTER window,
   which includes the popup's title bar and address bar — that chrome is what
   was eating the orb. Measure it, then size for the inner area. */
const INNER_W=190,INNER_H=240,MARGIN=12;
function fitWindow(){
  try{
    const chromeW=Math.max(0,window.outerWidth-window.innerWidth);
    const chromeH=Math.max(0,window.outerHeight-window.innerHeight);
    const outW=INNER_W+chromeW,outH=INNER_H+chromeH;
    window.resizeTo(outW,outH);
    window.moveTo(Math.max(0,(screen.availWidth||screen.width)-outW-MARGIN),MARGIN);
  }catch(e){}
}
if(new URLSearchParams(location.search).get('popup')==='1'){
  fitWindow();
  /* outerWidth/innerWidth can still be settling right after open, so correct
     once the window has actually painted. */
  window.addEventListener('load',fitWindow);
  setTimeout(fitWindow,300);
  setTimeout(fitWindow,900);
}

async function stop(){
  if(voice){voice.detach();voice=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  document.body.classList.remove('active','connecting','error','talking');
  starting=false;
  setHint('Click to talk');
}

async function fetchSession(){
  const r=await fetch(sessionUrl);
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  return data;
}

let reconnecting=false,reconnectTries=0;
async function handleLost(){
  if(reconnecting)return;
  reconnecting=true;
  try{if(voice){voice.detach();voice=null}}catch(e){}
  try{if(pc){pc.close()}}catch(e){}
  pc=null;
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  const wait=Math.min(8000,600*Math.pow(2,reconnectTries++));
  setTimeout(async function(){
    try{ await connectVoice(); reconnectTries=0; }
    catch(e){ if(reconnectTries<5)handleLost(); }
    finally{ reconnecting=false; }
  },wait);
}

async function connectVoice(){
  const data=await fetchSession();
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=document.createElement('audio');
  audio.autoplay=true;
  let remoteStream=null;
  pc.ontrack=e=>{remoteStream=e.streams[0];if(audio.srcObject!==e.streams[0])audio.srcObject=e.streams[0]};
  localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const micTrack=localStream.getTracks()[0];
  pc.addTrack(micTrack);
  const dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){if(AxonVoice.hasHistory())return;try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}});
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  voice=AxonVoice.attach({
    dc:dc,micTrack:micTrack,localStream:localStream,remoteStream:remoteStream,
    voice:data.voice,pc:pc,onLost:handleLost,
    onAiSpeaking:function(on){document.body.classList.toggle('talking',!!on);}
  });
  document.body.classList.add('active','talking');
  document.body.classList.remove('connecting','error');
  setHint('Click to stop');
}

async function toggle(){
  if(pc||starting){await stop();return}
  starting=true;
  document.body.classList.add('connecting');
  document.body.classList.remove('error');
  setHint('Connecting…');
  try{ await connectVoice(); }
  catch(e){ console.error(e); await stop(); document.body.classList.add('error'); setHint('Click to try again'); }
  starting=false;
}

orb.addEventListener('click',toggle);
orb.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}
});

window.addEventListener('blur',function(){
  if(!armed)return;
  stop();
  try{window.close()}catch(e){}
});
document.addEventListener('visibilitychange',function(){
  if(!armed||!document.hidden)return;
  stop();
  try{window.close()}catch(e){}
});

setTimeout(toggle,280);
setTimeout(function(){armed=true},3500);
</script>
</body>
</html>
