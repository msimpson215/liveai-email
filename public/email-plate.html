<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A1 Asphalt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#111;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,sans-serif;
}
.orb{
  width:200px;height:200px;border-radius:50%;cursor:pointer;
  background:#F5C518 url('/email/a1-logo.jpg') center/62% no-repeat;
  background-color:#F5C518;
  border:3px solid #F5C518;
  box-shadow:0 0 50px rgba(245,197,24,0.5),0 0 100px rgba(245,197,24,0.2);
  animation:pulse 2.4s ease-in-out infinite;
  flex-shrink:0;
  position:relative;
}
.tag{
  margin-top:10px;color:#FED100;font-weight:800;font-size:11px;
  letter-spacing:0.06em;text-transform:uppercase;text-align:center;
  opacity:0.9;pointer-events:none;
}
body.active .orb,body.connecting .orb{
  border-color:#fff;
  animation:pulseOn 1.1s ease-in-out infinite alternate;
}
body.error .orb{border-color:#c5221f;}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);box-shadow:0 0 70px rgba(245,197,24,0.7),0 0 140px rgba(245,197,24,0.3);}
}
@keyframes pulseOn{
  from{transform:scale(1.02);}
  to{transform:scale(1.09);box-shadow:0 0 90px rgba(245,197,24,0.95),0 0 180px rgba(245,197,24,0.4);}
}
</style>
</head>
<body>
<div class="orb" id="orb" role="button" tabindex="0" aria-label="Talk to A1 Professional Asphalt"></div>
<div class="tag">A1 Asphalt · tap to talk</div>
<script src="/axon-voice.js"></script>
<script>
let pc=null,localStream=null,starting=false,voice=null;
const _p=new URLSearchParams(location.search);
const sessionUrl=_p.get('src')==='email'?'/session?gate=1&src=email':'/session?gate=1';
const orb=document.getElementById('orb');
const W=260,H=280,M=12;

/* Pin this tiny window to the upper-right so Gmail stays visible */
if(_p.get('popup')==='1' && window.top===window.self){
  try{
    const left=Math.max(0,(screen.availWidth||screen.width)-W-M);
    window.resizeTo(W,H);
    window.moveTo(left,M);
  }catch(e){}
}

async function stop(){
  if(voice){voice.detach();voice=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  document.body.classList.remove('active','connecting','error');
  starting=false;
}

async function fetchSession(){
  const r=await fetch(sessionUrl);
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  return data;
}

let reconnecting=false,reconnectTries=0;
async function handleLost(){
  if(reconnecting)return;
  reconnecting=true;
  try{if(voice){voice.detach();voice=null}}catch(e){}
  try{if(pc){pc.close()}}catch(e){}
  pc=null;
  if(localStream){try{localStream.getTracks().forEach(function(t){t.stop()})}catch(e){}localStream=null}
  const wait=Math.min(8000,600*Math.pow(2,reconnectTries++));
  setTimeout(async function(){
    try{ await connectVoice(); reconnectTries=0; }
    catch(e){ if(reconnectTries<5)handleLost(); }
    finally{ reconnecting=false; }
  },wait);
}

async function connectVoice(){
  const data=await fetchSession();
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=document.createElement('audio');
  audio.autoplay=true;
  let remoteStream=null;
  pc.ontrack=e=>{remoteStream=e.streams[0];if(audio.srcObject!==e.streams[0])audio.srcObject=e.streams[0]};
  localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const micTrack=localStream.getTracks()[0];
  pc.addTrack(micTrack);
  const dc=pc.createDataChannel('oai-events');
  dc.addEventListener('open',function(){if(AxonVoice.hasHistory())return;try{dc.send(JSON.stringify({type:'response.create'}));}catch(e){}});
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  voice=AxonVoice.attach({dc:dc,micTrack:micTrack,localStream:localStream,remoteStream:remoteStream,voice:data.voice,pc:pc,onLost:handleLost});
  document.body.classList.add('active');
  document.body.classList.remove('connecting','error');
}

async function toggle(){
  if(pc||starting){await stop();return}
  starting=true;
  document.body.classList.add('connecting');
  document.body.classList.remove('error');
  try{ await connectVoice(); }
  catch(e){ console.error(e); await stop(); document.body.classList.add('error'); }
  starting=false;
}

orb.addEventListener('click',toggle);
orb.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();try{window.close()}catch(x){}}});

/* Always start talking when this tiny window opens */
setTimeout(toggle,280);
</script>
</body>
</html>
