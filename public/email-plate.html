<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:none transparent;
  background-color:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
}
.orb{
  width:220px;
  height:220px;
  border-radius:50%;
  cursor:pointer;
  background:#F5C518 url('/email/a1-logo.jpg') center/68% no-repeat;
  background-color:#F5C518;
  border:3px solid #F5C518;
  box-shadow:0 0 60px rgba(245,197,24,0.45),0 0 120px rgba(245,197,24,0.18);
  animation:pulse 3s ease-in-out infinite;
  flex-shrink:0;
}
body.active .orb,body.connecting .orb{
  border-color:#fff;
  animation:pulseOn 1.2s ease-in-out infinite alternate;
}
body.error .orb{
  border-color:#c5221f;
}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);box-shadow:0 0 80px rgba(245,197,24,0.65),0 0 160px rgba(245,197,24,0.28);}
}
@keyframes pulseOn{
  from{transform:scale(1.02);}
  to{transform:scale(1.08);box-shadow:0 0 100px rgba(245,197,24,0.9),0 0 200px rgba(245,197,24,0.4);}
}
</style>
</head>
<body>
<div class="orb" id="orb" role="button" tabindex="0"></div>
<script>
let pc=null,localStream=null,starting=false;
const sessionUrl=new URLSearchParams(location.search).get('src')==='email'?'/session?src=email':'/session';
const orb=document.getElementById('orb');

const _p=new URLSearchParams(location.search);
const inOverlay=_p.get('overlay')==='1'||window.top!==window.self;
if(_p.get('popup')==='1' && !inOverlay){
  try{
    window.resizeTo(236,236);
    window.moveTo(Math.round((screen.width-236)/2),Math.round((screen.height-236)/2));
  }catch(e){}
}

async function stop(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){try{localStream.getTracks().forEach(t=>t.stop())}catch(e){}localStream=null}
  document.body.classList.remove('active','connecting','error');
  starting=false;
}

async function fetchSession(){
  const r=await fetch(sessionUrl);
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'session');
  return data;
}

async function connectVoice(){
  const data=await fetchSession();
  const key=data.value||(data.client_secret&&data.client_secret.value);
  if(!key)throw new Error('no token');
  pc=new RTCPeerConnection();
  const audio=document.createElement('audio');
  audio.autoplay=true;
  pc.ontrack=e=>{if(audio.srcObject!==e.streams[0])audio.srcObject=e.streams[0]};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc.addTrack(localStream.getTracks()[0]);
  pc.createDataChannel('oai-events');
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  const sdp=await fetch('https://api.openai.com/v1/realtime/calls',{
    method:'POST',body:offer.sdp,
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/sdp'}
  });
  if(!sdp.ok)throw new Error('sdp');
  await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});
  document.body.classList.add('active');
  document.body.classList.remove('connecting','error');
}

async function toggle(){
  if(pc||starting){await stop();return}
  starting=true;
  document.body.classList.add('connecting');
  document.body.classList.remove('error');
  try{
    await connectVoice();
  }catch(e){
    console.error(e);
    await stop();
    document.body.classList.add('error');
    try{
      starting=true;
      document.body.classList.add('connecting');
      document.body.classList.remove('error');
      await connectVoice();
    }catch(e2){
      console.error(e2);
      await stop();
      document.body.classList.add('error');
    }
  }
  starting=false;
}

orb.addEventListener('click',toggle);
orb.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();try{window.close()}catch(x){}}});

if(new URLSearchParams(location.search).get('autostart')==='1'){
  setTimeout(toggle,300);
}
</script>
</body>
</html>
