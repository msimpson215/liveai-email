  <rect x="28" y="28" width="844" height="504" rx="22" fill="#fff" stroke="#c5d6ee"/>
  <text x="56" y="78" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6b7c96">EVIDENCE · DIRECTORIES</text>
  <text x="56" y="128" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0b1f4a">Yelp and MapQuest</text>
