<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>A1 Professional Asphalt and Concrete — scan to ask us anything</title>
<style>
  :root{ --black:#0b0b0b; --yellow:#f7c518; --white:#f4f4f4; --grey:#c2c2c2 }
  *{box-sizing:border-box} html,body{margin:0}
  body{ background:var(--black); color:var(--white);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center }
  .sheet{ width:100%; max-width:600px; min-height:100vh; display:flex; flex-direction:column;
    background:var(--black); overflow:hidden }

  .hero{ position:relative; background:linear-gradient(180deg,#f7c518 0%,#e0ac00 100%) }
  .hero .road{ display:block; width:100%; height:150px; object-fit:cover; object-position:center 35%; opacity:.9 }
  .brand{ position:absolute; inset:0; display:flex; align-items:center; gap:12px; padding:0 20px; z-index:2 }
  .brand img{ width:98px; height:98px; object-fit:contain; flex:0 0 98px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.8)) }
  .brandText b{ display:block; color:#fff; font-size:28px; line-height:1.03; text-shadow:0 2px 5px rgba(0,0,0,.7) }
  .brandText span{ display:block; color:#fff; font-size:18px; font-weight:700; margin-top:1px; text-shadow:0 2px 5px rgba(0,0,0,.7) }
  .stripes{ height:14px; background:repeating-linear-gradient(135deg,var(--yellow) 0 22px,#111 22px 44px) }

  main{ padding:26px 24px 32px; text-align:center; flex:1 0 auto }
  h1{ margin:0 0 20px; font-size:25px; line-height:1.35; font-weight:700 }
  h1 em{ font-style:normal; color:var(--yellow) }
  .panel{ background:#fff; border:3px solid var(--yellow); border-radius:10px; padding:18px;
    margin:0 auto 24px; max-width:410px }
  .panel img{ width:100%; max-width:324px; height:auto; display:block; margin:0 auto }
  .about{ display:flex; align-items:flex-start; gap:13px; text-align:left; margin:0 auto 20px;
    max-width:450px; font-size:16.5px; line-height:1.5 }
  .about .tag{ flex:0 0 auto; border:2px solid var(--yellow); border-radius:8px; color:var(--yellow);
    font-size:13px; font-weight:800; padding:5px 8px; letter-spacing:.04em }
  .about b{ color:var(--yellow) }
  .divider{ height:1px; background:var(--yellow); max-width:450px; margin:0 auto 20px; opacity:.7 }
  .callrow{ display:flex; align-items:center; gap:13px; justify-content:center; max-width:450px; margin:0 auto; text-align:left }
  .callrow .ic{ flex:0 0 43px; width:43px; height:43px; border-radius:50%; background:var(--yellow);
    display:flex; align-items:center; justify-content:center }
  .callrow a{ text-decoration:none; color:var(--yellow) }
  .callrow .lbl{ display:block; color:#fff; font-size:16.5px; font-weight:600 }
  .callrow .num{ display:block; font-size:31px; font-weight:800; line-height:1.15; letter-spacing:-.01em }
  .try{ display:inline-block; margin:26px 0 0; text-decoration:none; background:#fff; color:#111;
    font-size:16px; font-weight:600; padding:13px 22px; border-radius:10px }
  @media (max-width:400px){ .brand img{width:78px;height:78px;flex:0 0 78px} .brandText b{font-size:22px}
    h1{font-size:21px} .callrow .num{font-size:26px} }
  @media print{ .try{display:none} }
</style>
</head>
<body>
<div class="sheet">
  <div class="hero">
    <img class="road" src="/art/a1-asphalt.png" alt="">
    <div class="brand">
      <img src="/art/a1-arch-logo.png" alt="A1">
      <span class="brandText"><b>Professional</b><span>Asphalt and Concrete</span></span>
    </div>
  </div>
  <div class="stripes"></div>

  <main>
    <h1>Scan the QR code to<br><em>ask us anything</em> about our services</h1>
    <div class="panel"><img src="/qr/a1-ask.png" alt="QR code - scan to ask A1 about our services"></div>
    <p class="about">
      <span class="tag" aria-hidden="true">AI</span>
      Talk to our AI Assistant about anything we do &mdash;
      <b>paving, sealcoating, striping, concrete.</b>
    </p>
    <div class="divider"></div>
    <p class="callrow">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="#111"><path d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l1.9-1.9c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V19c0 .6-.4 1-1 1C10.6 20 4 13.4 4 5c0-.6.4-1 1-1h3.1c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .7-.2 1l-1.9 1.3z"/></svg></span>
      <a href="tel:+16189293301"><span class="lbl">Or call our team at</span><span class="num">(618) 929-3301</span></a>
    </p>
    <a class="try" href="/a1-ask.html">Try it now</a>
  </main>
</div>
</body>
</html>
