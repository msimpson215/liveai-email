<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nuclear Stress Test — scan to get answers</title>
<style>
  :root{ --deep:#062247; --gold:#c9a227; --ink:#0d2a56 }
  *{box-sizing:border-box} html,body{margin:0}
  body{ background:#f4f7fc; color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center }
  .sheet{ width:100%; max-width:600px; min-height:100vh; background:#fff; display:flex; flex-direction:column; overflow:hidden }
  .proto{ position:fixed; top:10px; right:10px; z-index:9; background:rgba(0,0,0,.55); color:#fff;
    border:1px solid rgba(255,255,255,.35); border-radius:5px; font-size:10px; font-weight:800;
    letter-spacing:.16em; padding:5px 9px; text-transform:uppercase; pointer-events:none }

  .top{ position:relative; color:#fff; text-align:center; padding:24px 22px 28px; overflow:hidden;
    border-bottom-left-radius:46% 26px; border-bottom-right-radius:46% 26px }
  .top .bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0 }
  .top .veil{ position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,rgba(6,34,71,.55),rgba(6,34,71,.8)) }
  .top > *:not(.bg):not(.veil){ position:relative; z-index:2 }
  .flame{ display:block; margin:0 auto 3px; width:23px; height:27px }
  .mem{ font-size:34px; font-weight:700; line-height:1; font-family:Georgia,"Times New Roman",serif }
  .hosp{ font-size:15px; letter-spacing:.22em; margin-top:2px; font-family:Georgia,"Times New Roman",serif }
  .bjc{ display:inline-block; margin-top:7px; background:#1257a5; color:#fff; font-size:13px;
    font-weight:700; letter-spacing:.08em; padding:3px 8px; border-radius:3px }
  .title{ margin:16px 0 5px; font-size:26px; font-weight:800; text-transform:uppercase }
  .scan{ margin:0; color:var(--gold); font-size:16.5px; font-weight:800; text-transform:uppercase; line-height:1.35 }

  main{ padding:28px 24px 32px; text-align:center; flex:1 0 auto }
  .panel{ background:#fff; border-radius:18px; padding:20px; margin:0 auto 24px; max-width:410px;
    box-shadow:0 10px 30px rgba(13,42,86,.17) }
  .panel img{ width:100%; max-width:322px; height:auto; display:block; margin:0 auto }
  .about{ display:flex; align-items:flex-start; gap:15px; text-align:left; margin:0 auto 22px;
    max-width:460px; font-size:16.5px; line-height:1.5; color:#28405f }
  .about .ic{ flex:0 0 44px; width:44px; height:44px; border-radius:50%; background:var(--ink);
    display:flex; align-items:center; justify-content:center }
  .divider{ height:1px; background:#e0c98a; max-width:460px; margin:0 auto 20px }
  .callrow{ display:flex; align-items:center; gap:15px; justify-content:center; max-width:460px; margin:0 auto; text-align:left }
  .callrow .ic{ flex:0 0 44px; width:44px; height:44px; border-radius:50%; background:var(--ink);
    display:flex; align-items:center; justify-content:center }
  .callrow a{ text-decoration:none; color:var(--ink) }
  .callrow .lbl{ display:block; font-size:16.5px; font-weight:600 }
  .callrow .num{ display:block; font-size:30px; font-weight:800; line-height:1.15; letter-spacing:-.01em }
  .try{ display:inline-block; margin:26px 0 0; text-decoration:none; background:var(--ink); color:#fff;
    font-size:16px; font-weight:600; padding:13px 22px; border-radius:10px }
  @media (max-width:400px){ .mem{font-size:27px} .title{font-size:21px} .callrow .num{font-size:26px} }
  @media print{ .try{display:none} }
</style>
</head>
<body>
<div class="sheet">
  <div class="proto">Prototype</div>

  <div class="top">
    <img class="bg" src="/art/memorial-blue-bg.png" alt="">
    <div class="veil"></div>
    <svg class="flame" viewBox="0 0 26 30" fill="#c9a227"><path d="M13 0c3 6-1 8 1 12 1.6 3.2 5-1 5 5 0 5-3.6 8-6 8s-6-2.4-6-7c0-6 5-11 6-18z"/></svg>
    <div class="mem">MEMORIAL</div>
    <div class="hosp">HOSPITAL</div>
    <div class="bjc">BJC</div>
    <div class="title">Nuclear Stress Test</div>
    <p class="scan">Scan the QR code to get answers<br>about your test</p>
  </div>

  <main>
    <div class="panel"><img src="/qr/stress-test-sample.png" alt="QR code - scan to ask questions about your nuclear stress test"></div>
    <p class="about">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="2.2" fill="#fff" stroke="none"/><ellipse cx="12" cy="12" rx="10" ry="4.4"/><ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(120 12 12)"/></svg></span>
      Talk to our AI Assistant about your nuclear stress test &mdash; why it&rsquo;s
      done, what to expect, how to prepare, and when results come back.
    </p>
    <div class="divider"></div>
    <p class="callrow">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="#fff"><path d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l1.9-1.9c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V19c0 .6-.4 1-1 1C10.6 20 4 13.4 4 5c0-.6.4-1 1-1h3.1c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .7-.2 1l-1.9 1.3z"/></svg></span>
      <a href="tel:+16182575480"><span class="lbl">Or call Central Scheduling at</span><span class="num">(618) 257-5480</span></a>
    </p>
    <a class="try" href="/stress-test.html">Try it now</a>
  </main>
</div>
</body>
</html>
