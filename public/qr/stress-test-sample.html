<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Scan to learn about your nuclear stress test</title>
<style>
  :root{ --navy:#0a2466; --ink:#0d1b3e; --muted:#5b6785; }
  *{box-sizing:border-box}
  body{
    margin:0; padding:52px 24px 64px; background:#fff; color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  /* Sized for people reading it without their glasses on. */
  h1{ font-size:27px; line-height:1.35; letter-spacing:-.015em; font-weight:600; margin:0 0 34px; }
  .qr{ width:270px; height:270px; display:block; }
  .line{ font-size:16px; line-height:1.6; color:var(--muted); margin:26px auto 0; max-width:400px; }
  a.try{
    text-decoration:none; background:var(--navy); color:#fff;
    font-size:17px; font-weight:600; padding:15px 26px; border-radius:10px;
  }
  .sample{
    margin-top:30px; font-size:10px; font-weight:800; letter-spacing:.18em;
    color:#c81e3c; border:1px solid #f0c6cf; border-radius:5px; padding:5px 12px;
  }
  .prints{ margin-top:30px; font-size:14px; color:var(--muted); line-height:1.9; }
  .prints a{ color:var(--navy); text-decoration:none; border-bottom:1px solid #cfd9ef; }
  @media print{
    body{padding:0.7in}
    a.try,.prints,.sample{display:none}
  }
</style>
</head>
<body>

<h1>Scan the QR code<br>to learn about your<br>Nuclear Stress Test</h1>

<img class="qr" src="/qr/stress-test-sample.png" alt="QR code — scan to ask questions about your nuclear stress test">

<a class="try" href="/stress-test.html">Try it now</a>

<p class="line">Our AI Assistant cannot give medical advice. Consult with your
cardiologist or primary care provider.</p>

<div class="sample">SAMPLE</div>

<p class="prints">
  Print <a href="/qr/stress-test-cards.html">take-home cards for the front desk</a><br>
  Print a <a href="/qr/stress-test-poster.html">poster for the waiting room</a><br>
  <a href="/stress-test-demo.html">How it works, for the clinic</a>
</p>

</body>
</html>
